  for(var r=0;r<rows.length;r++){ var pr=p[rows[r].id]||{best:0,perfect:false,runs:0};
    if(rows[r].pct>pr.best) pr.best=rows[r].pct;
    if(rows[r].pct===100) pr.perfect=true;

  var face=total>=90?'':(total>=70?'':(total>=50?'':''));
  var h='<div class="qz-item" style="text-align:center"><div style="font-size:40px">'+face+'</div>'
   +'<h3 style="margin:8px 0;color:#c99700;font-size:20px">'+total+'%</h3>'
   +(timeout?'<p style="color:#d97706;font-size:13px">⏰ 时间到！</p>':'')
   +'<p class="lab-sub">'+esc(paper.t)+' · 获得 +'+gain+' XP</p></div>';
  h+='<div class="qz-item"><h4>分项成绩</h4>';

  }
  h+='<button class="lab-rowbtn" style="width:100%;margin-top:14px;padding:12px" data-lv="ex:'+paper.id+'">再考一次</button>';
  h+='<button class="qz-btn" style="width:100%;margin-top:8px;background:rgba(0,0,0,.05)" data-lv="center">返回实战中心</button></div>';

  vibrate([40,80,40,80,40]);
}

var lvLast=0, lvLastEl=null, tX=0, tY=0, tT=0;

function lvAction(v){
  if(v.indexOf('ex:')===0){ startExam(v.slice(3)); }

  document.addEventListener('touchstart',function(e){ var t=e.touches[0]; if(t){ tX=t.clientX; tY=t.clientY; tT=Date.now(); } },{passive:true});
  document.addEventListener('touchend',function(e){
    var hit=e.target.closest('[data-lv]'); if(!hit) return;
    var t=e.changedTouches[0]; if(!t) return;
    if(Math.abs(t.clientX-tX)>14||Math.abs(t.clientY-tY)>14) return;
    if(Date.now()-tT>900) return;
    lvFire(hit);
  },{passive:true});
  document.addEventListener('click',function(e){
    var hit=e.target.closest('[data-lv]'); if(!hit) return;
    if(lvLastEl===hit && Date.now()-lvLast<800) return;  /* 同一元素的 touchend+click 去重 */
    lvFire(hit);
  });
  document.addEventListener('click',function(e){
    var c=e.target.closest('[data-lvc]'); if(!c) return;
    var box=$('tvChips'); if(!box||!box._cmds) return;

    var el=e.target.closest('[data-lvp]'); if(!el) return;

    if(v==='solution'){ showSolution(); return; }

    if(v.indexOf('file:')===0){
      var i=+v.slice(5), f=(S.scn.files||[])[i]; if(!f) return;
      hidePanel(); openEditor({path:f.p,mode:'edit'});
      return;
    }
  });

function state(){

/* ---------- 实证成绩采集 ---------- */
function collect(){
  var ctx={quiz:0,quizTotal:0,lab:0,labTotal:0,simBest:{}};
  var b=bank(), ks=Object.keys(b); ctx.quizTotal=ks.length;
  var q=LS('wg.quiz',{}), n=0;
  for(var i=0;i<ks.length;i++){ var r=q[ks[i]]; if(r&&r.total&&r.best*4>=r.total*3) n++; }
  ctx.quiz=n;
  var scn=scenarios(); ctx.labTotal=scn.length||22;
  var p=LS('wg.labprog',{}), m=0;
  if(scn.length){ for(var j=0;j<scn.length;j++){ var rr=p[scn[j].id]; if(rr&&rr.best>=100) m++; } }
  else { var kk=Object.keys(p); for(var t=0;t<kk.length;t++){ var pp=p[kk[t]]; if(pp&&pp.best>=100) m++; } }
  ctx.lab=m;
  var pids=['mini','std','full','fix'];
  var ex=LS('wg.exams',[]);
  for(var x=0;x<pids.length;x++){ var best=0; for(var y=0;y<ex.length;y++){ if(ex[y]&&ex[y].pid===pids[x]&&ex[y].pct>best) best=ex[y].pct; } ctx.simBest[pids[x]]=best; }
  return ctx;
}
function evalReqs(def,ctx){
  var out=[];
  for(var i=0;i<def.reqs.length;i++){
    var r=def.reqs[i], cur=0, need=1, txt=r.txt;
    if(r.k==='scope'){
      var lst=r.list||[], tot=0, okc=0, qq=LS('wg.quiz',{}), bks=Object.keys(bank());
      for(var a=0;a<lst.length;a++){
        for(var b2=0;b2<bks.length;b2++){
          if(bks[b2].indexOf(lst[a])!==0) continue;
          tot++;
          var rq=qq[bks[b2]]; var minp=r.pct||75; if(rq&&rq.total&&rq.best*100>=rq.total*minp) okc++;
        }
      }
      out.push({met:(tot>0&&okc>=tot), cur:okc, need:tot, frac:tot?Math.min(1,okc/tot):0, txt:(r.txt||'考纲范围内章节全部达标'), curTxt:okc+'/'+tot+' 章'});
      continue;
    }
    if(r.k==='quiz'){ cur=ctx.quiz; need=r.need; }
    else if(r.k==='lab'){ cur=ctx.lab; need=(r.need<0?ctx.labTotal:r.need); if(r.need<0) txt='全对通过全部 '+ctx.labTotal+' 个实训场景'; }
    else if(r.k==='sim'){ cur=ctx.simBest[r.pid]||0; need=r.min; }
    else if(r.k==='simAny'){ need=r.min; for(var j=0;j<r.pids.length;j++){ var b=ctx.simBest[r.pids[j]]||0; if(b>cur) cur=b; } }
    var curTxt;
    if(r.k==='sim'||r.k==='simAny'){ curTxt=(cur>0?cur+' 分':'未参加'); }
    else if(r.k==='lab'){ curTxt=cur+'/'+need+' 个'; }
    else { curTxt=cur+'/'+need+' 章'; }
    out.push({met:cur>=need, cur:cur, need:need, frac:need>0?Math.min(1,cur/need):1, txt:txt, curTxt:curTxt});
  }
  return out;
}

/* ---------- 晋级考核（试炼） ---------- */
var TR=null;
function scopeHit(key, scopes){ for(var i=0;i<scopes.length;i++){ if(key.indexOf(scopes[i])===0) return true; } return false; }
function buildPool(def){
  var b=bank(), q=LS('wg.quiz',{}), pool=[], poolAll=[], ks=Object.keys(b);
  var scopes=(def&&def.pool&&def.pool.length)?def.pool:null;
  for(var i=0;i<ks.length;i++){
    var r=q[ks[i]]; if(!(r&&r.total&&r.best*4>=r.total*3)) continue;
    var arr=b[ks[i]].q||[];
    for(var j=0;j<arr.length;j++){
      var it={q:arr[j].q,o:arr[j].o,a:arr[j].a,e:arr[j].e,src:b[ks[i]].t};
      poolAll.push(it);
      if(!scopes||scopeHit(ks[i],scopes)) pool.push(it);
    }
  }
  if(pool.length<8) pool=poolAll; /* 对标范围题量不足 → 回退全部已达标章节 */
  return shuffle(pool);
}
function startTrial(){
  var s=state(), cur=currentLevel(s), nx=nextDef(cur);
  openLadder();
  if(!nx) return;
  if(nx.cool && s.coolLv===nx.n && (s.coolUntil||0)>Date.now()){
    toastFn('冷静期剩余 '+Math.ceil((s.coolUntil-Date.now())/60000)+' 分钟 — 复盘错题后再来');
    renderLadder(); return;
  }
  var ev=evalReqs(nx,collect()), metAll=true;
  for(var i=0;i<ev.length;i++){ if(!ev[i].met) metAll=false; }
  if(!metAll){ toastFn('条件未达成 — 先完成「'+nx.t+'」的全部要求'); renderLadder(); return; }
  var pool=buildPool(nx);
  if(pool.length<8){ toastFn('考纲范围内达标章节还太少 — 先去考试中心通过对应范围的章节'); renderLadder(); return; }
  var qn=Math.min(nx.qn||12, pool.length);
  TR={lv:nx.n, pass:(nx.pass||85), cool:(nx.cool||0), qs:pool.slice(0,qn), i:0, correct:0, wrongs:[], answered:false};
  renderTrial();
}

  var body=$('rankBody'); if(!body) return;

  if(t.i>=t.qs.length){ finishTrial(); return; }

  var q=t.qs[t.i], def=defByN(t.lv);

   入口：首页「全网学习资源库」按钮（data-resopen）
   功能：分类 / 搜索 / 排序 / 已看标记 / 收藏 / 打开·复制链接 / 平台与开源精选 */
(function () {
  'use strict';
  var D = window.RES_DATA || { items: [], extra: null };
  var ITEMS = D.items || [];
  var EXTRA = D.extra || { platforms: [], projects: [], toolbox: [] };
  var OFFLINE = window.RES_OFFLINE || {};
  var watched = {}, favs = {};
  try { watched = JSON.parse(localStorage.getItem('wg.reswatch') || '{}'); } catch (e) {}
  try { favs = JSON.parse(localStorage.getItem('wg.resfav') || '{}'); } catch (e) {}
  var GCLS = { '装机': 'g1', '计算机': 'g2', '编译原理': 'g3', '进阶': 'g4' };
  var st = { tab: 'all', sort: 'play', q: '', limit: 60, hideW: false, showFav: false, onlyOff: false };

  function saveW() { try { localStorage.setItem('wg.reswatch', JSON.stringify(watched)); } catch (e) {} }
  function saveF() { try { localStorage.setItem('wg.resfav', JSON.stringify(favs)); } catch (e) {} }
  function fmtN(n) {
    n = n || 0;
    if (n >= 1e8) return (n / 1e8).toFixed(1) + '亿';
    if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
    return '' + n;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function toast(msg) {
    var t = document.getElementById('resToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'resToast';
      t.style.cssText = 'position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(20,24,30,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:300;transition:opacity .25s;max-width:82%;text-align:center';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.style.opacity = '0'; }, 2200);
  }
  function copyText(s) {
    function fb() {
      try {
        var ta = document.createElement('textarea');
        ta.value = s; ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
        toast('链接已复制，可粘贴分享');
      } catch (e) { toast('复制失败，请长按选择'); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(function () { toast('链接已复制，可粘贴分享'); }, fb);
    } else fb();
  }
  function openUrl(u) {
    if (!u) return;
    try { location.href = u; } catch (e) { copyText(u); }
  }

  function pool() {
    var arr = ITEMS.slice();
    if (st.tab !== 'all') arr = arr.filter(function (x) { return x.g === st.tab; });
    if (st.showFav) arr = arr.filter(function (x) { return favs[x.b]; });
    if (st.onlyOff) arr = arr.filter(function (x) { return OFFLINE[x.b]; });
    if (st.hideW) arr = arr.filter(function (x) { return !watched[x.b]; });
    if (st.q) {
      var q = st.q.toLowerCase();
      arr = arr.filter(function (x) {
        return ((x.t || '') + ' ' + (x.a || '')).toLowerCase().indexOf(q) >= 0;
      });
    }
    if (st.sort === 'new') arr.sort(function (a, b) { return (b.pub || 0) - (a.pub || 0); });
    else arr.sort(function (a, b) { return (b.p || 0) - (a.p || 0); });
    return arr;
  }

  function itemHtml(x, idx) {
    var w = watched[x.b] ? ' watched' : '';
    var off = OFFLINE[x.b];
    var offTag = off ? '<span class="res-off">已离线' + (off.items.length > 1 ? ' · ' + off.items.length + '集' : '') + '</span>' : '';
    var mainBtn = off
      ? '<button class="res-btn ok" data-act="playlocal">▶ 本地</button><button class="res-btn primary" data-act="online">▶ 在线</button>'
      : '<button class="res-btn primary" data-act="online">▶ 在线</button>';
    var url = 'https://www.bilibili.com/video/' + x.b;
    return '<div class="res-card' + w + '" data-resb="' + esc(x.b) + '">'
      + '<div class="res-num"><b>' + (idx + 1) + '</b></div>'
      + '<div class="res-body">'
      + '<div class="res-title">' + esc(x.t) + '</div>'
      + '<div class="res-meta"><span class="res-tag ' + (GCLS[x.g] || '') + '">' + esc(x.g || '') + '</span>'
      + '<span><b>' + esc(x.a) + '</b></span>'
      + '<span>▶ <b>' + fmtN(x.p) + '</b></span>'
      + '<span>⏱ ' + esc(x.d || '') + '</span>'
      + offTag
      + '<span style="color:var(--dim2)">' + esc(x.b) + '</span></div>'
      + '</div>'
      + '<div class="res-acts">'
      + mainBtn
      + '<button class="res-btn" data-act="copy">复制</button>'
      + '<button class="res-btn" data-act="watch">' + (watched[x.b] ? '已看' : '○ 未看') + '</button>'
      + '<button class="res-btn" data-act="fav">' + (favs[x.b] ? '已藏' : '收藏') + '</button>'
      + '</div>'
      + '</div>';
  }

  function tabsHtml() {
    var cnt = { all: ITEMS.length };
    ['装机', '计算机', '编译原理', '进阶', '机房', '锐捷云平台'].forEach(function (g) {
      cnt[g] = ITEMS.filter(function (x) { return x.g === g; }).length;
    });
    var defs = [['all', '全部'], ['装机', '装机'], ['计算机', '计算机'], ['编译原理', '编译原理'], ['进阶', '进阶'], ['机房', '机房管理'], ['锐捷云平台', '锐捷云平台'], ['extra', '平台·开源']];
    return defs.map(function (d) {
      var n = '';
      if (d[0] !== 'extra') n = ' <small style="opacity:.7">' + (cnt[d[0]] || 0) + '</small>';
      return '<button class="res-tab' + (st.tab === d[0] ? ' on' : '') + '" data-rtab="' + d[0] + '">' + d[1] + n + '</button>';
    }).join('');
  }

  function extraHtml() {
    var h = '';
    function linkBtn(l, hot) {
      return '<a class="res-link' + (hot ? ' hot' : '') + '" data-resurl="' + esc(l.u) + '">' + esc(l.t) + '</a>';
    }
    h += '<div class="res-plat"><h4>全网自学平台 · 直达搜索</h4>'
      + '<p>B站覆盖最全、最接地气的自制教程；系统化课程看慕课/大学公开课；遇到概念卡壳用知乎/Bing 搜索补课。<b>点击后若停留在应用内网页</b>，可长按链接用系统浏览器打开。</p>';
    h += (EXTRA.platforms || []).map(function (p) {
      return '<div class="res-sec">▍' + esc(p.name) + ' <span style="font-weight:400;color:var(--dim2)">' + esc(p.desc || '') + '</span></div>'
        + '<div class="res-links">' + (p.links || []).map(function (l) { return linkBtn(l, p.hot); }).join('') + '</div>';
    }).join('');
    h += '</div>';

    h += '<div class="res-plat"><h4>开源项目与经典教材（全部免费合法）</h4>';
    h += (EXTRA.projects || []).map(function (p) {
      return '<div class="res-sec">▍' + esc(p.name) + '</div><p style="margin:0 0 6px">' + esc(p.desc || '') + '</p>'
        + '<div class="res-links">' + linkBtn({ t: '打开 →', u: p.u }, true) + '</div>';
    }).join('');
    h += '</div>';

    h += '<div class="res-plat"><h4>装机 & 维护工具箱（真装机必备）</h4>';
    h += (EXTRA.toolbox || []).map(function (p) {
      return '<div class="res-sec">▍' + esc(p.name) + '</div><p style="margin:0 0 6px">' + esc(p.desc || '') + '</p>'
        + '<div class="res-links">' + linkBtn({ t: '了解/下载 →', u: p.u }, true) + '</div>';
    }).join('');
    h += '</div>';

    h += '<div class="res-plat"><h4>建议学习顺序</h4><p style="line-height:1.9">'
      + '① <b>装机篇</b>：先看教程第 18 章《装机从零到极致》，再挑装机区 2-3 个完整装机实录视频跟看一遍（不用真买硬件，先把流程刻进脑子）；'
      + '② <b>计算机篇</b>：配合计算机组成原理 / 操作系统视频，按「先建立全景、再抠细节」节奏看；'
      + '③ <b>编译原理篇</b>：先看教程第 19 章，再看速成视频建立框架，最后跟《Crafting Interpreters》动手写一个解释器；'
      + '④ <b>动手</b>：看完必写笔记 + 在实训室（首页→模拟实训室）打一遍对应场景。</p></div>';
    return h;
  }

  function listHtml() {
    if (st.tab === 'extra') return extraHtml();
    var arr = pool();
    var shown = arr.slice(0, st.limit);
    var h = '';
    if (!shown.length) h = '<div class="res-empty">没有匹配的内容' + (st.q ? '（换个关键词试试）' : '') + '</div>';
    else h = shown.map(function (x, i) { return itemHtml(x, i); }).join('');
    return h;
  }

  function barHtml() {
    if (st.tab === 'extra') return '';
    var arr = pool();
    var uw = arr.filter(function (x) { return !watched[x.b]; }).length;
    return '<span>共 <b>' + arr.length + '</b> 条 · 已看 <b>' + (arr.length - uw) + '</b> 条</span><span class="sp"></span>'
      + '<button class="res-sort' + (st.sort === 'play' ? ' on' : '') + '" data-rsort="play">播放</button>'
      + '<button class="res-sort' + (st.sort === 'new' ? ' on' : '') + '" data-rsort="new">最新</button>'
      + '<button class="res-sort' + (st.hideW ? ' on' : '') + '" data-rhide="1">隐藏已看</button>'
      + '<button class="res-sort' + (st.showFav ? ' on' : '') + '" data-rfav="1">收藏夹</button>'
      + '<button class="res-sort' + (st.onlyOff ? ' on' : '') + '" data-roff="1">已离线</button>';
  }

  function listFootHtml() {
    if (st.tab === 'extra') return '';
    var arr = pool();
    if (arr.length <= st.limit) return '<div class="res-foot">— 已经到底了。= 已下载到手机（离线看）；其余点「▶ 在线」直接播放（' + esc(D.gen || '') + '）。—</div>';
    return '<button class="res-more" data-rmore="1">加载更多（还有 ' + (arr.length - st.limit) + ' 条）</button>';
  }

  function render() {
    var el = document.getElementById('resView');
    if (!el) return;
    el.innerHTML =
      '<div class="res-head">'
      + '<div class="res-top"><h2>全网学习资源库</h2><button class="res-x" data-resclose="1"></button></div>'
      + '<div class="res-sub">装机 · 计算机 · 编译原理 · 进阶 · 机房管理 · 锐捷云平台 —— B站全网检索 · <b>离线已下载 · ▶ 在线直接播放（不跳转）</b></div>'
      + '<div class="res-search"><input id="resQ" placeholder="搜索标题 / UP主…" value="' + esc(st.q) + '"></div>'
      + '</div>'
      + '<div class="res-tabs">' + tabsHtml() + '</div>'
      + (barHtml() ? '<div class="res-bar">' + barHtml() + '</div>' : '')
      + '<div class="res-list" id="resList">' + listHtml() + listFootHtml() + '</div>';
  }

  function refreshList() {
    var l = document.getElementById('resList');
    if (!l) return;
    l.innerHTML = listHtml() + listFootHtml();
  }
  function refreshAll() { render(); }
  function refreshBar() {
    var b = document.querySelector('.res-bar');
    if (!b) return;
    var h = barHtml();
    b.innerHTML = h;
    b.style.display = h ? '' : 'none';
  }

  function bind() {
    if (window._resBound) return;
    window._resBound = true;
    document.addEventListener('click', function (e) {
      var t = e.target;
      var b = t.closest ? t.closest('[data-resb]') : null;
      var btn = t.closest ? t.closest('[data-act]') : null;
      if (btn && b) {
        var act = btn.getAttribute('data-act');
        var bv = b.getAttribute('data-resb');
        e.stopPropagation(); e.preventDefault();
        if (act === 'playlocal') openPlayer(bv);
        else if (act === 'online') openOnline(bv);
        else if (act === 'open') openUrl('https://www.bilibili.com/video/' + bv);
        else if (act === 'copy') copyText('https://www.bilibili.com/video/' + bv);
        else if (act === 'watch') {
          if (watched[bv]) delete watched[bv]; else watched[bv] = 1;
          saveW(); refreshList(); refreshBar();
        } else if (act === 'fav') {
          if (favs[bv]) delete favs[bv]; else favs[bv] = 1;
          saveF(); refreshList();
        }
        return;
      }
      if (b && !btn) {
        var bv2 = b.getAttribute('data-resb');
        if (OFFLINE[bv2]) openPlayer(bv2);
        else openOnline(bv2);
        return;
      }
      var tab = t.closest ? t.closest('[data-rtab]') : null;
      if (tab) { st.tab = tab.getAttribute('data-rtab'); st.limit = 60; refreshAll(); return; }
      var so = t.closest ? t.closest('[data-rsort]') : null;
      if (so) { st.sort = so.getAttribute('data-rsort'); refreshList(); refreshBar(); return; }
      if (t.closest && t.closest('[data-rhide]')) { st.hideW = !st.hideW; refreshList(); refreshBar(); return; }
      if (t.closest && t.closest('[data-rfav]')) { st.showFav = !st.showFav; refreshList(); refreshBar(); return; }
      if (t.closest && t.closest('[data-roff]')) { st.onlyOff = !st.onlyOff; refreshList(); refreshBar(); return; }
      if (t.closest && t.closest('[data-rmore]')) { st.limit += 80; refreshList(); return; }
      var ru = t.closest ? t.closest('[data-resurl]') : null;
      if (ru) { openUrl(ru.getAttribute('data-resurl')); return; }
    }, true);
    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'resQ') {
        st.q = e.target.value.trim(); st.limit = 60; refreshList(); refreshBar();
      }
    }, true);
    document.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-resopen]') : null;
      if (b) { e.preventDefault(); openResLib(); }
      if (e.target.closest && e.target.closest('[data-resclose]')) closeResLib();
    });
  }

  /* ===== 本地播放器（离线视频） ===== */
  var BASE_PATH = 'file:///sdcard/Android/media/com.cloudstudy.app/bsvideos/';
  var curBv = null, curIdx = 0, curFile = null;

  function savePos() {
    try {
      var v = document.getElementById('resPlayerV');
      if (!v || !curFile) return;
      var m = {};
      try { m = JSON.parse(localStorage.getItem('wg.rpos') || '{}'); } catch (e) {}
      m[curFile] = Math.round(v.currentTime || 0);
      localStorage.setItem('wg.rpos', JSON.stringify(m));
    } catch (e) {}
  }

  function ensurePlayer() {
    if (document.getElementById('resPlayer')) return;
    var d = document.createElement('div');
    d.id = 'resPlayer';
    d.innerHTML = '<div class="resP-head"><b id="resPTitle">播放</b>'
      + '<button data-rpx="1"></button></div>'
      + '<video id="resPlayerV" controls playsinline preload="metadata"></video>'
      + '<div id="resPlayerF" style="display:none;flex:1;min-height:0;background:#000"><iframe id="resPlayerIf" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture" style="width:100%;height:100%;border:0;display:block"></iframe></div>'
      + '<div class="resP-list" id="resPEps"></div>';
    document.body.appendChild(d);
    d.addEventListener('click', function (e) {
      var t2 = e.target;
      if (t2.closest && t2.closest('[data-rpx]')) { closePlayer(); return; }
      if (t2.closest && t2.closest('[data-rpo]')) { if (curBv) openUrl('https://www.bilibili.com/video/' + curBv); return; }
      var eb = t2.closest ? t2.closest('[data-rep]') : null;
      if (eb) playItem(curBv, +eb.getAttribute('data-rep'));
    });
    var v = document.getElementById('resPlayerV');
    v.addEventListener('ended', function () {
      var off = OFFLINE[curBv];
      if (off && curIdx + 1 < off.items.length) playItem(curBv, curIdx + 1);
    });
    v.addEventListener('timeupdate', function () {
      if (v._ls && Date.now() - v._ls < 5000) return;
      v._ls = Date.now();
      savePos();
    });
    v.addEventListener('pause', function () { savePos(); });
  }
  function openOnline(bv) {
    ensurePlayer();
    savePos();
    curBv = bv; curIdx = 0; curFile = null;
    var el = document.getElementById('resPlayer');
    var v = document.getElementById('resPlayerV');
    var fw = document.getElementById('resPlayerF');
    var ifr = document.getElementById('resPlayerIf');
    var eps = document.getElementById('resPEps');
    try { v.pause(); } catch (e) {}
    v.style.display = 'none';
    v.removeAttribute('src');
    try { v.load(); } catch (e) {}
    fw.style.display = 'flex';
    var t = bv;
    try {
      for (var i = 0; i < ITEMS.length; i++) { if (ITEMS[i].b === bv) { t = ITEMS[i].t; break; } }
    } catch (e) {}
    document.getElementById('resPTitle').textContent = '' + t;
    ifr.src = 'https://player.bilibili.com/player.html?bvid=' + bv + '&autoplay=0&high_quality=1';
    var ob = document.getElementById('resPOpenB');
    if (ob) ob.style.display = '';
    if (eps) { eps.innerHTML = ''; eps.style.display = 'none'; }
    el.classList.add('on');
  }
  function openPlayer(bv) {
    var off = OFFLINE[bv];
    if (!off) return;
    ensurePlayer();
    var fw = document.getElementById('resPlayerF');
    if (fw) { fw.style.display = 'none'; var ifr = document.getElementById('resPlayerIf'); if (ifr) ifr.removeAttribute('src'); }
    var v0 = document.getElementById('resPlayerV');
    if (v0) v0.style.display = '';
    var ob = document.getElementById('resPOpenB');
    if (ob) ob.style.display = 'none';
    curBv = bv; curIdx = 0;
    var eps = document.getElementById('resPEps');
    if (off.items.length > 1) {
      eps.style.display = '';
      eps.innerHTML = off.items.map(function (it, i) {
        return '<button class="resP-ep' + (i === 0 ? ' on' : '') + '" data-rep="' + i + '">P' + it.i + '</button>';
      }).join('');
    } else { eps.innerHTML = ''; eps.style.display = 'none'; }
    document.getElementById('resPlayer').classList.add('on');
    playItem(bv, 0);
  }
  function playItem(bv, idx) {
    var off = OFFLINE[bv];
    if (!off || !off.items[idx]) return;
    savePos();
    curIdx = idx;
    var it = off.items[idx];
    var v = document.getElementById('resPlayerV');
    v.src = BASE_PATH + it.f;
    curFile = it.f;
    try {
      var m = JSON.parse(localStorage.getItem('wg.rpos') || '{}');
      var p = +m[it.f] || 0;
      if (p > 5) {
        var onceFn = function () {
          try { v.currentTime = p; } catch (e) {}
          v.removeEventListener('loadedmetadata', onceFn);
        };
        v.addEventListener('loadedmetadata', onceFn);
      }
    } catch (e) {}
    try { v.play(); } catch (e) {}
    document.getElementById('resPTitle').textContent = (off.t || bv) + ' · P' + it.i;
    var eps = document.getElementById('resPEps');
    var btns = eps.querySelectorAll('.resP-ep');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', i === idx);
    var cur = eps.querySelector('.resP-ep.on');
    if (cur) { try { cur.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
  }
  function closePlayer() {
    savePos();
    var v = document.getElementById('resPlayerV');
    if (v) { try { v.pause(); } catch (e) {} v.removeAttribute('src'); try { v.load(); } catch (e) {} }
    var ifr = document.getElementById('resPlayerIf');
    if (ifr) ifr.removeAttribute('src');
    var el = document.getElementById('resPlayer');
    if (el) el.classList.remove('on');
  }

  window.openResLib = function () {
    bind();
    var el = document.getElementById('resView');
    if (!el) return;
    el.classList.add('on');
    refreshAll();
  };
  window.closeResLib = function () {
    var el = document.getElementById('resView');
    if (el) el.classList.remove('on');
    closePlayer();
  };

  /* 启动即挂载事件委托。
     修复：bind() 此前只在 openResLib() 内部调用，而打开资源库的唯一入口
     又依赖 bind() 挂载的 [data-resopen] 监听 → 首页卡片首次点击无监听器
     响应（表现为「点不开」）。在脚本加载完毕时直接挂载即可闭环。 */
  bind();
})();

/* ================================================================
   知识公社 · 自主学习引擎数据（learn-data.js）
   LN_TRACKS   —— 学习地图：四条主线的阶段架构
   LN_INSIGHTS —— 深度洞察：每章 2 条独特见解 + 1 道思考题
   ================================================================ */

window.LN_TRACKS = [
  { icon:'', color:'#1a6fe8', name:'保姆级主线 · 从零到云',
    desc:'21 章的完整课程体系：启蒙 → 筑基 → 中坚 → 云原生 → 融会 → 巅峰实战。按顺序走，每一章都建立在前一章之上。',

/* ================= 保姆级主线 ================= */
"tutorial_00": { think:'如果只能保留一个命令来解决「服务打不开」，你选哪个？为什么？', ins:[
  ['先学「最小闭环」，再补全地图','新手最大的坑是一头扎进原理细节。正确顺序：先能登录一台服务器、跑起一个网站（闭环），再回头补 DNS、HTTP、进程这些零件。有了闭环，每个知识点都有挂钩的地方，学得快 3 倍。'],
  ['把「收藏」变成「输出」','收藏 100 篇教程 ≠ 学会。每学完一节，用自己的话讲一遍（费曼技巧）——讲不顺的地方，就是你真正的漏洞所在。']]},

"tutorial_01": { think:'为什么服务器普遍用命令行而不是图形界面？列出你能想到的 3 个原因。', ins:[
  ['「一切皆文件」是 Linux 的世界观','键盘、硬盘、进程、网卡……在 Linux 里都是文件。理解这一点，就明白为什么 `cat /proc/cpuinfo` 能看 CPU、为什么 `>` 能写文件——一套心智模型通吃整个系统。'],
  ['命令不是背的，是「查」出来的','资深工程师也记不住全部参数。真正的基本功是 man、--help、tldr。背命令的走不远，会查命令的走得远。']]},

"tutorial_02": { think:'127.0.0.1、192.168.x.x、公网 IP——服务分别监听在这三个地址上，各意味着什么？', ins:[
  ['排错口诀：先问「通不通」，再问「认不认得」','ping IP 通、域名不通 = DNS 问题；ping IP 也不通 = 链路或防火墙问题。一层层往外剥，比瞎试快 10 倍。'],
  ['私有 IP + NAT = 地址不够用时的天才补丁','IPv4 只有 43 亿个地址，现在有 300 亿设备在线，靠的就是 NAT：家里几十台设备共用一个公网 IP。理解 NAT，就理解了「为什么外网访问不了我家电脑」。']]},

"tutorial_03": { think:'nginx -t 通过但网站还是打不开，下一步你会查哪三个地方？', ins:[
  ['服务的三件套：装、开、验','任何服务落地都是同一个套路：装包 → 启服务 → 验证（ss 看端口、curl 看响应）。学会这个套路，80% 的新服务你都能自己部署起来。'],
  ['改配置前先备份：0.1 秒省 2 小时','老手的肌肉记忆：`cp nginx.conf nginx.conf.bak` 只用 0.1 秒，却能在改坏配置时救你 2 小时。生产事故里「没备份就改配置」永远占大头。']]},

"tutorial_04": { think:'为什么自签证书会弹「不安全」警告，而花钱买的证书不会？', ins:[
  ['HTTPS 的本质是「怎么安全地交换钥匙」','对称加密快但没法安全传钥匙，非对称加密安全但慢——HTTPS 用非对称换一次钥匙，再用对称加密跑全程。所有握手细节都在服务这一个目标。'],
  ['证书不是「加密」，是「身份证」','HTTPS = 加密（别人看不懂）+ 身份（确认对面是本人）。钓鱼网站也有 HTTPS，所以浏览器还要核对证书上的域名对不对。']]},

"tutorial_05": { think:'dnsmasq 为什么在学校和企业内网里几乎无处不在？它到底解决了什么问题？', ins:[
  ['DNS 是互联网的「通讯录」，也是最快的排错入口','访问慢、间歇性打不开、换个网络就正常——先换个 DNS 查一下。大量「玄学故障」其实是 DNS 缓存或解析线路问题。'],
  ['TTL 是 DNS 改动的「生效倒计时」','改完解析有人说好了有人说没变？那是各地缓存还没到期。提前把 TTL 调小（比如 60 秒），下次切换就能秒级生效——这是运维的基本操作。']]},

"tutorial_06": { think:'四层（L4）和七层（L7）负载均衡，各自的优势与代价是什么？', ins:[
  ['负载均衡不只是「分流」，更是「故障隔离」','一台挂了大不了慢一点，全挂了才是事故。健康检查把死掉的节点踢出去，剩下的撑着——高可用的本质永远是：冗余 + 探测 + 切换。'],
  ['会话保持是甜蜜的陷阱','让用户固定打同一台机器（会话保持）最简单，但那台挂了体验就崩。更好的是把状态外置（Redis 共享 Session），让任何一台都能服务任何人。']]},

"tutorial_07": { think:'磁盘 100% 满会导致哪些看起来毫不相关的故障？举三个例子。', ins:[
  ['先止损，后根因','线上挂了先恢复服务（重启、切流量），再慢慢查为什么。顺序反了，事故时长会翻倍——用户只关心你到底恢复了没有。'],
  ['排查的尽头是「分层」：网络 → 服务 → 资源 → 日志','逐层砍掉不可能的范围：ping 通吗？端口在吗？CPU/内存/磁盘满吗？日志报什么错？剩下的就是答案。']]},

"tutorial_08": { think:'为什么考试和企业的自动化运维，都要求「能用命令行的就用命令行」？', ins:[
  ['Windows 的「服务」思维和 Linux 是通的','服务管理器 ↔ systemctl，事件查看器 ↔ journalctl，IIS ↔ nginx。概念框架学会一个，另一个只是换皮。'],
  ['GUI 和 PowerShell 都要会，但自动化只信命令行','界面操作不可审计、不可复现。批量运维和自动化判分都走命令行——这一条就筛掉了只会点鼠标的人。']]},

"tutorial_09": { think:'如果脚本要在凌晨 3 点的生产服务器上无人值守运行，你会额外加哪些保护？', ins:[
  ['脚本的第一价值是「可重复」','同样的操作做第二遍时就该写脚本。人的记忆会出错，脚本不会。运维自动化的起点，永远是「第三次手敲」。'],
  ['set -euo pipefail 是脚本的安全带','默认情况下命令报错脚本会继续往下跑，边跑边搞破坏。加上这三条，任何环节出错立刻停车——事故率立降。']]},

"tutorial_10": { think:'为什么说 Docker 把「环境问题」变成了「镜像问题」？各举一个例子。', ins:[
  ['容器 = 用「打包」终结「在我电脑上能跑」','镜像把代码 + 依赖 + 配置冻成一个快照，到哪台机器都一模一样。它不是虚拟机——共享内核、进程级隔离，所以秒起秒停。'],
  ['数据放进卷，别放进容器','容器的哲学是「随时可删、随时重建」。数据库文件如果留在容器里，删容器 = 删库。记住：容器无状态，数据放 volume。']]},

"tutorial_11": { think:'「期望状态 vs 实际状态」这个模型，还能解释生活里的哪些系统？', ins:[
  ['K8s 是「声明式」革命：说要什么，而不是怎么做','你提交「我要 3 个副本」，它自己算怎么调度、怎么重启、怎么扩容。从命令式到声明式，是云原生最大的思维跳跃。'],
  ['自愈是 K8s 的底色','它每时每刻对比「期望状态」与「实际状态」，不一致就动手修：Pod 死了拉起来、机器挂了把 Pod 迁走。理解了这条，大半 API 都能自己推理出来。']]},

"tutorial_12": { think:'同一个业务，自建机房与公有云的成本拐点大概在哪个体量上？', ins:[
  ['云的核心不是「租服务器」，而是「按需 + 弹性」','半夜没人访问就不用为闲置付费；大促来了点几下就能从 10 台扩到 1000 台。会算弹性账和成本账，才叫会用云。'],
  ['云上最大的坑是账单和权限','忘了关机、桶权限开成公开、IAM 给大了——技术问题都有文档，账单问题和安全问题都是真金白银。先把 S3 桶策略和成本告警学会。']]},

"tutorial_13": { think:'哪些操作「绝不能」自动化？为什么？', ins:[
  ['自动化不是炫技，是消灭重复与人为失误','凡是做过 3 遍以上的操作，就该进流水线。机器执行 100% 一致，人执行总有第 100 次出错。'],
  ['幂等：跑一次和跑一百次结果相同','好的自动化脚本可以放心重跑——这是它和「一次性脚本」的分水岭。每次写完先自问：我再跑一遍会出事吗？']]},

"tutorial_14": { think:'黄金四指标（流量/错误/延迟/饱和度）各自最能暴露什么问题？', ins:[
  ['监控的终点是「在用户报警之前先知道」','好监控不是挂了才响，而是提前看到趋势：磁盘 7 天后满、内存缓慢泄漏。用预测性告警把事故消灭在发生之前。'],
  ['日志三要素：时间、来源、上下文','排查最绝望的莫过于「日志没说清谁在什么时候干了什么」。结构化日志（JSON）能让机器帮你查——写日志和打日志同样重要。']]},

"tutorial_15": { think:'一台暴露在公网的服务器，最先要关掉的三个东西是什么？', ins:[
  ['安全是「成本 vs 收益」的连续博弈','没有绝对安全的系统。加固的思路是：把攻击成本抬高到攻击者觉得不划算。改端口、禁 root 登录、上密钥——每步都很便宜，组合起来就很贵。'],
  ['最小权限：出了事，损失被关在最小的盒子里','每个服务独立账号、只给必需权限、只开必需端口。就算一个点被攻破，也不会整条船沦陷。']]},

"tutorial_16": { think:'复盘一道你做错的真题：错在知识，还是错在「没按题目要求做」？', ins:[
  ['真题是最好的老师：它告诉你考什么、怎么算对','别到处找新资料——吃透历年真题，重复考点就是拿分点。做题 → 对答案 → 回教材，三遍循环胜过泛读十本书。'],
  ['判分脚本会「读」你的操作，中间步骤要留痕','很多题不只看最终效果，还看配置文件写法、服务名、路径。按题目要求的姿势做，别自创流派。']]},

"tutorial_17": { think:'学校机房的还原卡，和企业的标准化镜像，解决的是同一个问题吗？', ins:[
  ['机房管理的本质是一张「风险清单」','电、网、冷、火、人——五类风险各有标准动作（UPS、双链路、精密空调、气体消防、门禁）。把清单逐条打勾，你就超过了 90% 的人。'],
  ['一切都要有「第二套」','双电、双网、双机、备份。单点 = 迟早出事的点。评估一个机房，先问：哪个环节只有一套？']]},

"tutorial_18": { think:'UEFI 与 Legacy BIOS 装机流程的差异，会带来哪些实际麻烦？', ins:[
  ['装机是一次「全栈复习」','从 U 盘引导、分区、装系统、驱动，到加入网络——每一步都是前面章节的实战验收。亲手装一遍，胜过看十遍。'],
  ['量产装机靠「模板」，不靠手感','做一台完美样机 → 封装成镜像 → 批量分发。学校机房和企业桌面的共同真相：先做好一台，再复制 100 台。']]},

"tutorial_19": { think:'为什么几乎每本编译原理教材都要从「计算器」开始写编译器？', ins:[
  ['编译器把「魔法」变成「流水线」','你写的代码能被跑起来，是因为有个忠实的分阶段工厂：扫描 → 解析 → 生成。每阶段只干一件事，阶段之间接口清晰——这是软件工程「关注点分离」的最高样板。'],
  ['能写一个小编译器，比背一百个术语更接近「懂」','词法 30 行、语法 100 行、求值 50 行，就能跑加减乘除。亲手实现一遍，递归下降、AST 这些词就永远长在你身上了。']]},

"tutorial_19a": { think:'把你写的小编译器改造成支持「变量赋值」，需要动哪几个阶段？', ins:[
  ['完整代码是给「卡住的人」的参考答案','不要一上来就抄。自己写到卡住，再对照这份代码看你卡在哪一步——那时的收获是抄十遍都换不来的。']]},

"tutorial_20": { think:'如果考试让你复述操作过程，你能把 4核/4G/60G、adminjf、.100 这些参数全说对吗？', ins:[
  ['实训平台的分数，藏在「细节参数」里','IP 末位、主机名、座位名前缀、扣分规则——这类实训题 80% 的分靠「一个都没写错」。动手前先把参数抄在纸上。'],
  ['做完 ≠ 完成：验收动作本身就是考点','文件分发、屏幕广播——题目说验收什么，你最后就必须演示什么。做题时预留 2 分钟执行验收动作。']]},

/* ================= 机房管理修炼线 ================= */
"room_00": { think:'用「故障-特征-处置」场景卡格式，复盘你们机房最近一次真实故障。', ins:[
  ['机房是「会出物理故障的计算机」','软件故障重启，硬件故障换件，电力故障只能靠自己兜住。机房人的价值 = 让物理层面的意外不变成业务事故。'],
  ['从「会用」到「会修」，隔着一百张场景卡','老工程师脑子里都有一本「故障-特征-处置」对照表。你可以现在开始写它，每遇到一个新场景就补一行。']]},

"room_01": { think:'把你现在的真实水平定级，并写下升到下一级的三个具体动作。', ins:[
  ['自测分数不重要，「卡在哪一级」才重要','阶梯自测是用来定位你的真实水平，不是用来较劲的。卡在 L2 就补 L2 的课，别跳过去啃 L5。'],
  ['每一级都有它的「验收动作」','会说不等于会做。L1 会巡检、L2 会换件、L3 会排障——用动手任务验收每一级，把「我觉得我会」变成「我做过」。']]},

"room_02": { think:'单机柜 5kW 和 20kW，散热方案会差在哪一级？', ins:[
  ['UPS 的关键数不是「多大」，是「撑多久」','先算负载功率（W），再定续航目标（分钟），最后才选型。不会算容量的人买 UPS 只能靠猜。'],
  ['风是机房的第二生命线','冷热通道、封盲板、合理回风——气流组织不好，空调再贵也白搭。看一个机房专不专业，先看「风怎么走」。']]},

"room_03": { think:'为什么大容量场景越来越推荐 RAID 6 甚至 RAID 10，而不是 RAID 5？', ins:[
  ['RAID 不是备份，只是「减少停机」','RAID 5 扛得住一块盘坏，扛不住误删、勒索病毒和双盘齐坏。真正的数据安全 = RAID + 离线备份 + 异地副本。'],
  ['SMART 是硬盘的体检报告，要会读','05 重映射、C5 待映射等关键项持续增长 = 硬盘在道别。换盘的最佳时机永远是「它还能用、但已经在报警」的时候。']]},

"room_04": { think:'PXE 装机失败时，你会按什么顺序排查 DHCP、TFTP、HTTP 三个环节？', ins:[
  ['PXE 是「把装机变成广播」的技术','DHCP 指路 + TFTP 递引导 + HTTP 发系统——三件套。理解每个环节的职责，任何一步出错都能秒定位。'],
  ['无人值守 = 一份「装机的标准答案」','把分区、软件包、用户密码写成答案文件，装机从 40 分钟手点变成 5 分钟自动。考场和工地都靠它。']]},

"room_05": { think:'如果只能保留三个监控指标，你选哪三个？为什么？', ins:[

/* ---------------- 系统自检 ---------------- */
var _vidsCache=null;
function collectVideos(){
  if(_vidsCache && window.__kcAllLoaded) return _vidsCache;
  var out=[], ks=Object.keys(DOCS||{});
  for(var i=0;i<ks.length;i++){
    var d=DOCS[ks[i]];
    if(!d || !d.html || d.html.indexOf('<video')<0) continue;
    var re=/<video[^>]*?src="([^"]+)"/g, m;
    while((m=re.exec(d.html))){ out.push({doc:ks[i], src:m[1]}); }
  }
  _vidsCache=out; return out;
}
function row(title, cls, sub){
  var ic = cls==='ok' ? '' : (cls==='warn' ? '' : '');
  return '<div class="ln-row '+cls+'"><div class="ic">'+ic+'</div><div class="tx"><b>'+title+'</b><span>'+sub+'</span></div></div>';
}

function renderCheck(){

  var qks=Object.keys(QUIZ_BANK||{}), qn=0;
  qks.forEach(function(k){ qn+=((QUIZ_BANK[k].q)||[]).length; });
  var vids=collectVideos();
  var sa=srsAll(), due=srsDue().length;
  var rn=Object.keys(readMap()).length, qz=Object.keys(quizScores()).length;
  var lsOK=true; try{ localStorage.setItem('wg._lnT','1'); localStorage.removeItem('wg._lnT'); }catch(e){ lsOK=false; }
  var h='<div class="ln-banner ok" id="lnCheckBanner">自检进行中…</div>';
  h+=row('文档引擎', docsN>=3000?'ok':'warn', '已装载 <b>'+docsN+'</b> 篇文档 · '+groupsN+' 个导航分组'+(docsN>=3000?' · 完整':' · 数量偏少'));
  h+=row('题库系统', (qks.length>=50&&qn>=200)?'ok':'warn', '<b>'+qks.length+'</b> 组测验 · <b>'+qn+'</b> 道题 · 考试中心可用');
  h+='<div class="ln-row" id="lnVidRowWrap"><div class="ic"></div><div class="tx"><b>视频资源</b><span id="lnVidRow">检测中…（共 '+vids.length+' 个引用）</span></div></div>';
  h+=row('复习引擎', 'ok', '卡片 <b>'+Object.keys(sa).length+'</b> 张 · 今日到期 <b>'+due+'</b> 题');
  h+=row('学习数据', 'ok', '已读 <b>'+rn+'</b> 篇 · 测验记录 <b>'+qz+'</b> 章 · 全部存于手机本地');
  h+=row('本地存储', lsOK?'ok':'bad', lsOK?'读写正常 · 学习进度断电不丢':'不可用！进度将无法保存');
  h+='<div class="ln-row" id="lnStorRowWrap"><div class="ic"></div><div class="tx"><b>存储空间</b><span id="lnStorRow">检测中…</span></div></div>';
  h+='<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">'
   +'<button class="ln-go" data-lnact="recheck">重新自检</button>'
   +'<button class="ln-chip" data-lnact="map">学习地图</button></div>';
  h+='<p style="color:var(--dim2);font-size:11.5px;margin-top:14px">报告生成于 '+new Date().toLocaleString()+' · 全部通过 = App 处于满血离线状态</p>';
  body.innerHTML=h;
  testVideos(vids);
  try{
    if(navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(function(est){
        var el=$('lnStorRow'); if(!el) return;
        if(!est.usage){ el.innerHTML='浏览器未提供容量数据（不影响使用）· 课程视频打包在 APK 资源内'; return; }
        var used=Math.round(est.usage/1048576);
        el.innerHTML='浏览器已用约 <b>'+used+' MB</b>'+(est.quota?(' · 配额约 '+Math.round(est.quota/1048576)+' MB'):'')+' · 课程视频打包在 APK 资源内';
      }).catch(function(){});
    } else { var el2=$('lnStorRow'); if(el2) el2.textContent='此环境不支持容量估量（不影响使用）'; }
  }catch(e){}
}
function updVidRow(html, cls){
  var el=$('lnVidRow'); if(el) el.innerHTML=html;
  var w=$('lnVidRowWrap'); if(w) w.className='ln-row '+(cls||'ok');
  var b=$('lnCheckBanner');
  if(b){
    if(cls==='bad'){ b.className='ln-banner warn'; b.innerHTML='有项目需要注意 —— 详情见下方清单'; }
    else if(cls==='ok'){ b.className='ln-banner ok'; b.innerHTML='全部系统正常 · 文档 / 题库 / 视频 / 复习 / 存储 全项通过'; }
  }
}
function testVideos(vids){
  var picks=[], seen={};
  ['/course/','/ext/','videos/ep'].forEach(function(pat){
    for(var i=0;i<vids.length;i++){
      if(vids[i].src.indexOf(pat)>=0 && !seen[vids[i].src]){ seen[vids[i].src]=1; picks.push(vids[i].src); break; }
    }
  });
  if(!picks.length){ updVidRow('<b>0</b> 个内嵌视频（本页可能未打包视频）','warn'); return; }
  var done=0, ok=0, names=[];
  picks.forEach(function(src){
    var ve=document.createElement('video');
    ve.preload='metadata'; ve.muted=true;
    ve.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0';
    var finished=false;
    var to=setTimeout(function(){ fin(false); }, 6000);
    function fin(good){
      if(finished) return; finished=true;
      clearTimeout(to); done++; if(good) ok++;
      names.push((good?'':'')+shortName(src));
      if(done===picks.length){
        updVidRow('共 <b>'+vids.length+'</b> 个引用 · 抽样 '+ok+'/'+picks.length+' 可直接播放 '+(ok===picks.length?'':'')
          +'<br>'+names.join('　'), ok===picks.length?'ok':'bad');
      }
      setTimeout(function(){ try{ ve.pause(); ve.remove(); }catch(e){} }, 300);
    }
    ve.onloadedmetadata=function(){ fin(true); };
    ve.onerror=function(){ fin(false); };
    ve.src=src;
    document.body.appendChild(ve);
  });
}

function ensureViews(){

   +'<div id="mapView">'

function doAct(a, arg){
  if(!a) return;
  if(a==='map'){ openMap(); }
  else if(a==='closeMap'){ closeMap(); }
  else if(a==='check'){ openCheck(); }
  else if(a==='closeCheck'){ closeCheck(); }
  else if(a==='go'){ closeMap(); closeCheck(); if(DOCS[arg]) show(arg); }
  else if(a==='setmode'){ setMode(arg==='fast'?'fast':'slow', current); }
  else if(a==='setfast'){ setMode('fast', current); } /* 兼容别名 */
  else if(a==='setslow'){ setMode('slow', current); }
  else if(a==='drill'){ if(!drill(arg)) toast('题库未就绪'); }
  else if(a==='review'){
    if(!startReview(false) && !startReview(true))
      toast('还没有复习卡片：先做一章的测验，错题会自动排进复习队列');
  }
  else if(a==='jump'){ var el=_heads[+arg]; if(el && el.scrollIntoView){ try{ el.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){ el.scrollIntoView(); } } }
  else if(a==='recheck'){ renderCheck(); }
}
/* 事件委托（click + touch 双通道，带防抖，兼容 WebView 动画期丢点击） */
var _lx=0,_ly=0,_lt=0,_lLast=0;
function lnHit(e){
  var el=(e.target && e.target.closest) ? e.target.closest('[data-lnact]') : null;
  if(!el) return false;
  if(Date.now()-_lLast<600) return true;
  _lLast=Date.now();
  doAct(el.getAttribute('data-lnact'), el.getAttribute('data-lnarg')||'');
  return true;
}
document.addEventListener('touchstart', function(e){ var t=e.touches&&e.touches[0]; if(t){ _lx=t.clientX; _ly=t.clientY; _lt=Date.now(); } }, {passive:true});
document.addEventListener('touchend', function(e){
  var t=e.changedTouches&&e.changedTouches[0]; if(!t) return;
  if(Math.abs(t.clientX-_lx)>14 || Math.abs(t.clientY-_ly)>14) return;
  if(Date.now()-_lt>900) return;
  if(lnHit(e)){ try{ e.preventDefault(); }catch(err){} }
}, {passive:false});
document.addEventListener('click', function(e){ if(lnHit(e)){ e.preventDefault(); } });

/* ---------------- 返回键总控（Android Back → 关闭最上层，返回 false 交给系统） ---------------- */
window.__bk=function(){
  try{
    function on(id){ var el=document.getElementById(id); return el&&el.classList.contains('on'); }
    function tap(id){ var el=document.getElementById(id); if(el&&el.click){ el.click(); return true; } return false; }
    if(on('rkModal')){ document.getElementById('rkModal').classList.remove('on'); return true; }
    if(on('tvConfirm')){ return tap('tvConfirmNo')||true; }
    if(on('tvEdit')){ return tap('tvEditClose')||true; }
    if(on('termView')){ return tap('tvBack')||true; }
    if(on('restView')){ if(window.stopRest){ stopRest(); return true; } }
    if(on('rankView')){ if(window.Rank&&Rank.act){ Rank.act('close'); return true; } }
    if(on('labView')){ if(window.closeLab){ closeLab(); return true; } }
    if(on('quizView')){ if(window.closeQuiz){ closeQuiz(); return true; } }
    if(on('checkView')){ if(window.Learn){ Learn.closeCheck(); return true; } }
    if(on('mapView')){ if(window.Learn){ Learn.closeMap(); return true; } }
    if(on('resView')){ if(window.closeResLib){ closeResLib(); return true; } }
    var tp=document.getElementById('tocPanel');
    if(tp && tp.style.display==='block'){ tp.style.display='none'; return true; }
    var rb=document.getElementById('results');
    if(rb && rb.style.display==='block'){ rb.style.display='none'; return true; }
    var side=document.getElementById('side');
    if(side && side.classList.contains('open')){ if(window.closeDrawer){ closeDrawer(); return true; } }
    if(typeof current!=='undefined' && current && current!=='__home__'){ if(window.show){ show('__home__'); return true; } }
  }catch(e){}
  return false;
};
