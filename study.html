<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<title>知识公社 · 从零到精通</title>
<style>
/* ================================================================
   知识公社 · 视觉系统 v3
   扁平简约 · 白卡片 · 分区导航 · 沉浸阅读
   ================================================================ */
:root {
  --bg:#f4f6fa;
  --text:#182338;
  --dim:#5b6b85;
  --dim2:#8a97ad;
  --glass:#f6f8fb;
  --glass2:#eef2f8;
  --line:#dfe6f0;
  --line2:#e9eef6;
  --hl:rgba(43,92,217,.22);
  --blue:#2b5cd9;
  --blue-deep:#2450c0;
  --blue-tint:#edf2fd;
  --red:#cf3830;
  --green:#0f9d6c;
  --gold:#b07d10;
  --radius:10px;
  --fs:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC",sans-serif;
  font-size:var(--fs); line-height:1.8;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* 极光背景永久停用（本视觉为纯色底） */
.aurora{display:none !important}

/* ---------- 基础交互 ---------- */
button,.nav-item,.group-head,.home-card,.dn-btn,.sr-item,.tool-btn,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tool-btn:active{transform:scale(.94);background:var(--glass2);transition-duration:.05s}
.group-head:active{background:var(--glass)}
.sr-item:active{background:var(--glass2)}
#toTop:active,#tocBtn:active{transform:scale(.94)}
#toTop,#tocBtn{transition:transform .15s ease,opacity .2s}
.glass{
  background:#ffffff;
  border:1px solid var(--line);
  box-shadow:none;
}

/* ---------- 布局 ---------- */
.app{position:relative;display:flex;min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;width:296px;flex:0 0 296px;
  padding:0;display:flex;flex-direction:column;gap:0;
  background:#ffffff;border-right:1px solid var(--line);
  transition:none;
}
.side .panel{border-radius:0;flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:#ffffff;border:none;box-shadow:none;position:relative}
.brand{padding:16px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2)}
.brand .logo{width:36px;height:36px;border-radius:9px;flex:0 0 36px;
  background:var(--blue);box-shadow:none;position:relative}
.brand .logo::before{content:'云';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:18px;font-family:"Source Han Sans SC","Noto Sans SC",sans-serif}
.brand h1{font-size:15.5px;margin:0;font-weight:800;letter-spacing:.5px;color:var(--text)}
.brand p{margin:1px 0 0;font-size:10.5px;color:var(--dim2);letter-spacing:.3px}

.search{margin:10px 14px 6px;display:flex;align-items:center;gap:8px;
  background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:8px 12px;transition:border-color .2s}
.search:focus-within{border-color:var(--blue);background:#fff}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13.5px}
.search input::placeholder{color:var(--dim2)}
.search svg{width:15px;height:15px;color:var(--dim2);flex:0 0 15px}

.nav{overflow-y:auto;padding:2px 12px 18px;flex:1;overscroll-behavior:contain}
.nav::-webkit-scrollbar{width:5px}
.nav::-webkit-scrollbar-thumb{background:#d7dfec;border-radius:3px}
.nav-group{margin-bottom:2px}
.group-head{width:100%;display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--dim);
  font-size:12px;font-weight:700;letter-spacing:.5px;padding:10px 8px;cursor:pointer;border-radius:8px}
.group-head:hover{background:var(--glass)}
.g-dot{width:8px;height:8px;border-radius:2px;box-shadow:none}
.chev{width:14px;height:14px;margin-left:6px;transition:transform .25s}
.nav-group.closed .chev{transform:rotate(-90deg)}
.nav-group.closed .group-body{display:none}
.nav-item{width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;color:var(--dim);
  font-size:13.5px;text-align:left;padding:8px 10px 8px 12px;border-radius:8px;cursor:pointer;
  position:relative;overflow:hidden;}
.nav-item .dot{width:6px;height:6px;border-radius:2px;flex:0 0 6px;opacity:.9}
.nav-item em{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--dim2);flex:0 0 auto}
.nav-item:hover{background:var(--glass);color:var(--text);transform:none}
.nav-item.active{background:var(--blue-tint);
  color:var(--blue);box-shadow:inset 3px 0 0 var(--blue);
  border:none;}
.nav-item.active em{color:rgba(43,92,217,.4)}
.nav-item.hidden{display:none}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;padding:0 14px 90px;max-width:1020px;margin:0 auto;width:100%}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  border-radius:0;padding:11px 6px;margin-bottom:14px;
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:saturate(150%) blur(8px);backdrop-filter:saturate(150%) blur(8px);
  border:none;border-bottom:1px solid var(--line);
  box-shadow:none;}
.menu-btn{display:none;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;z-index:70;
  width:42px;height:42px;border-radius:10px;border:1px solid var(--line);
  background:#ffffff;color:var(--text);cursor:pointer;align-items:center;justify-content:center;
  transition:transform .15s ease,background .2s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  box-shadow:0 1px 4px rgba(24,35,56,.08)}
body.drawer-open .menu-btn{background:var(--glass)}
/* 抽屉打开时：关闭按钮占据 Logo 位，避免重叠 */
body.drawer-open .brand .logo{visibility:hidden}
.menu-btn:active{transform:scale(.94);background:var(--glass);transition-duration:.05s}
.bars{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
.bars i{display:block;width:18px;height:2px;border-radius:0;background:currentColor;
  transition:transform .3s cubic-bezier(.22,.61,.36,1),opacity .18s;transform-origin:center}
body.drawer-open .menu-btn .bars i:nth-child(1){transform:translateY(6px) rotate(45deg)}
body.drawer-open .menu-btn .bars i:nth-child(2){opacity:0}
body.drawer-open .menu-btn .bars i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.crumb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.crumb b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span{font-size:11px;color:var(--dim2)}
.tools{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.tool-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#ffffff;
  color:var(--text);cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  transition:transform .15s ease, background .2s, border-color .2s}
.tool-btn:hover{background:var(--glass);border-color:#ccd6e8}
.tool-btn:active{transform:scale(.94)}
.pill{font-size:11px;color:var(--dim);padding:4px 10px;border-radius:6px;border:1px solid var(--line);
  background:#ffffff;white-space:nowrap}

.progress-track{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;background:transparent;pointer-events:none}
.progress-bar{height:100%;width:0;background:var(--blue);border-radius:0 2px 2px 0;
  box-shadow:none;transition:width .1s linear}

.card{border-radius:12px;padding:26px 26px 34px;position:relative;max-width:100%;overflow:hidden;
  margin-top:14px;
  background:#ffffff;
  border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(24,35,56,.04);}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.card-head .hbar{width:4px;height:20px;border-radius:1px;background:var(--vc,#2b5cd9);box-shadow:none}
.card-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px;color:var(--text)}
.card-head .meta{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.card-in{animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 正文 markdown ---------- */
.md h1{font-size:26px;font-weight:800;letter-spacing:.3px;margin:8px 0 18px;line-height:1.35;color:var(--text)}
.md h2{font-size:19.5px;font-weight:750;margin:34px 0 12px;color:var(--text);line-height:1.4;
  padding-left:12px;border-left:4px solid var(--vc,#2b5cd9)}
.md h3{font-size:16.5px;font-weight:700;margin:24px 0 8px;color:var(--blue)}
.md h4{font-size:15px;font-weight:700;margin:18px 0 6px;color:var(--dim)}
.md p{margin:12px 0}
.md p,.md li,.md td,.md th,.md h1,.md h2,.md h3,.md h4,.md blockquote,.md summary,.md a{overflow-wrap:anywhere;word-break:break-word}
.md a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(43,92,217,.35);cursor:pointer}
.md a.deadlink{color:var(--dim2);border-bottom:1px dashed var(--line);cursor:not-allowed}
.md a.inlink{color:var(--blue)}
.md a.inlink::after{content:" ↗";font-size:.8em;opacity:.7}
.md strong{color:#0f172b}
.md code{font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--blue-tint);border:1px solid #d8e2f8;
  padding:1.5px 6px;border-radius:5px;font-size:.86em;color:var(--blue-deep)}
.md pre{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;overflow-x:auto;margin:14px 0;max-width:100%;
  box-shadow:none}
.md pre code{background:none;border:none;padding:0;color:#1c2a44;font-size:13px;line-height:1.75}
.doc-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:10px 0 8px}
.doc-gallery img{width:100%;border-radius:8px;border:1px solid var(--line2)}
.md table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;display:block;overflow-x:auto;
  border:1px solid var(--line);border-radius:8px;margin:14px 0}
.md th,.md td{border-bottom:1px solid var(--line2);padding:9px 13px;text-align:left;white-space:nowrap}
.md th{background:var(--glass);font-weight:700}
.md tr:last-child td{border-bottom:none}
.md blockquote{margin:14px 0;padding:12px 18px;border-left:4px solid var(--vc,#2b5cd9);
  background:var(--blue-tint);border-radius:0 8px 8px 0;color:#31519e}
.md ul,.md ol{padding-left:22px;margin:10px 0}
.md li{margin:6px 0}
.md hr{border:none;border-top:1px solid var(--line2);margin:30px 0}
.md input[type=checkbox]{margin-right:7px;accent-color:var(--blue);transform:translateY(1px)}
.md details{background:var(--glass);border:1px solid var(--line2);border-radius:8px;padding:10px 16px;margin:12px 0}
.md summary{cursor:pointer;font-weight:700;color:var(--blue)}
.md img{max-width:100%;border-radius:10px}
.rawtext{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.7;color:var(--blue-deep);margin:0;max-width:100%}
.nav-group .group-head .cnt{margin-left:auto;font-size:10px;color:var(--dim2);background:var(--glass2);padding:1px 7px;border-radius:4px}
.results{display:none;margin:0 14px 8px;max-height:46vh;overflow-y:auto;background:#ffffff;border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 4px 14px rgba(24,35,56,.08)}
.sr-item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);font-size:13px;padding:8px 10px;border-radius:6px;cursor:pointer}
.sr-item em{display:block;font-style:normal;font-size:10.5px;color:var(--dim2);margin-top:1px}
.sr-item:hover{background:var(--glass)}
.sr-empty{padding:10px;color:var(--dim2);font-size:12.5px}

/* ---------- 首页卡片体系（白卡片+色彩分区） ---------- */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46%,1fr));gap:10px;margin:16px 0}
.home-card{position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:#ffffff;
  border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--text);font-size:13.5px;cursor:pointer;text-align:left;
  transition:transform .2s ease,border-color .2s,box-shadow .2s;overflow:hidden;box-shadow:0 1px 2px rgba(24,35,56,.03)}
.home-card:hover{transform:translateY(-2px);border-color:rgba(43,92,217,.45);box-shadow:0 3px 10px rgba(24,35,56,.07)}
.home-card:active{transform:scale(.98)}
.home-card b{font-size:13.5px;font-weight:700;line-height:1.4}
.home-card .hc-dot{width:9px;height:9px;border-radius:2px;box-shadow:none;flex:0 0 9px}
.home-card .hc-count{font-size:11px;color:var(--dim2)}
.home-card.small{flex-direction:row;align-items:center;gap:8px;padding:12px 14px;font-size:13px}
.home-quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
#continue-slot{margin:14px 0 12px}
#continue-slot .home-card{border-color:rgba(43,92,217,.4)}
#toTop{position:fixed;right:16px;bottom:22px;width:auto;min-width:44px;max-width:120px;height:44px;padding:0 14px;border-radius:22px;display:none;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;background:#ffffff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(24,35,56,.1);z-index:50;white-space:nowrap}

.overlay{position:fixed;inset:0;background:rgba(24,35,56,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}

@media (max-width:900px) {
  .menu-btn{display:flex}
  .topbar{padding-left:64px}
  .side{position:fixed;left:-360px;top:0;z-index:60;width:min(84vw,320px);flex-basis:auto;border-right:1px solid var(--line)}
  .side .panel{background:#ffffff}
  .menu-btn{display:flex}
  .main{padding:0 10px 80px}
  .card{padding:18px 16px 30px;border-radius:10px;margin-top:12px}
  .topbar{padding-top:9px;padding-bottom:9px}
  .md h1{font-size:22px}
  .md h2{font-size:17.5px}
}
.foot{text-align:center;color:var(--dim2);font-size:11.5px;padding:26px 0 10px;border-top:1px solid var(--line2);margin-top:30px}
/* ===== 段位体系容器（细节由 nation-fix 与 app/rank.css 共同决定） ===== */
.celebrate-card{background:#ffffff;border:1px solid rgba(176,125,16,.4);border-radius:12px;padding:28px 40px;text-align:center;box-shadow:none}
.celebrate-card .big{font-size:42px}
.celebrate-card h3{color:var(--gold);margin:10px 0 4px;font-size:17px}
.celebrate-card p{color:var(--dim);margin:4px 0 0;font-size:13px}
/* ===== 测验中心 ===== */
#quizView{position:fixed;inset:0;z-index:160;background:var(--bg);display:none;flex-direction:column}
#quizView.on{display:flex}
.quiz-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:#ffffff}
.quiz-body{flex:1;overflow-y:auto;padding:18px 16px 70px;max-width:640px;margin:0 auto;width:100%}
.qz-item{background:#ffffff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.qz-item h4{margin:0 0 6px;font-size:15px;line-height:1.6}
.qz-opt{display:block;width:100%;text-align:left;background:#ffffff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0;color:var(--text);font-size:14px;cursor:pointer;transition:border-color .15s,background .15s}
.qz-opt:hover{border-color:rgba(43,92,217,.5)}
.qz-opt.right{background:#eaf7f1;border-color:var(--green)}
.qz-opt.wrong{background:#fdeeed;border-color:var(--red)}
.qz-exp{font-size:12.5px;color:var(--dim);margin-top:8px;display:none;line-height:1.7}
.qz-btn{display:inline-block;background:var(--blue);border:none;border-radius:8px;color:#fff;font-size:13.5px;font-weight:700;padding:11px 18px;margin-top:10px;cursor:pointer}
.qz-btn.sm{padding:7px 14px;font-size:12.5px;margin:0}
.qz-btn:active{transform:scale(.97);background:var(--blue-deep)}
/* ===== 实训室卡片 ===== */
.lab-card{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;cursor:pointer}
.lab-card.labdone{background:#eaf7f1;border-color:rgba(15,157,108,.45)}
#restView{position:fixed;inset:0;z-index:170;display:none;align-items:center;justify-content:center;background:rgba(24,35,56,.45)}
#restView.on{display:flex}
#boot{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);transition:opacity .45s}
#boot p{margin:0;color:var(--dim);font-size:14px}
#boot small{color:var(--dim2);font-size:11.5px}
.boot-ring{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.docnav{display:flex;gap:8px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line2)}
.dn-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#ffffff;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:12.5px;padding:11px 10px;cursor:pointer;transition:border-color .2s,background .2s;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;text-align:center}
.dn-btn:hover{border-color:rgba(43,92,217,.5);background:var(--blue-tint)}
.dn-btn:active{transform:scale(.98)}
.dn-btn.home{flex:0 0 54px}
#tocBtn{position:fixed;right:16px;bottom:84px;width:auto;min-width:44px;max-width:120px;height:44px;padding:0 14px;border-radius:22px;display:none;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;background:#ffffff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(24,35,56,.1);z-index:50;white-space:nowrap}
#tocPanel{position:fixed;right:16px;bottom:140px;width:min(78vw,320px);max-height:56vh;overflow-y:auto;display:none;z-index:51;border-radius:10px;padding:10px;background:#ffffff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(24,35,56,.12)}
#tocPanel button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);font-size:12.5px;padding:7px 9px;border-radius:6px;cursor:pointer}
#tocPanel button:hover{background:var(--glass)}
#tocPanel button.lv3{padding-left:22px;color:var(--dim);font-size:12px}
#results mark{background:rgba(255,214,10,.45);color:#5f4b00;border-radius:3px;padding:0 2px}
.nav-item.read::after{content:'';font-size:10px;color:var(--green);margin-left:5px;flex:0 0 auto}

/* ================================================================
   V3 首页驾驶舱 · 侧栏分区 · 沉浸阅读 · 章节条
   ================================================================ */
/* ---- 首页：分区标题（政务风：粗标题+细说明+底部细线） ---- */
.hsec{display:flex;align-items:baseline;gap:9px;margin:26px 0 4px;flex-wrap:wrap;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.hsec b{font-size:16px;font-weight:800;letter-spacing:.3px;color:var(--text)}
.hsec span{font-size:11.5px;color:var(--dim2)}
.home-lead{color:var(--dim);font-size:13px;margin:2px 0 6px;line-height:1.85}
/* ---- 首页：继续学习（国家平台式深蓝横幅，纯色扁平） ---- */
#continue-slot{margin:14px 0 12px}
.hero-card{display:block;width:100%;text-align:left;cursor:pointer;border:none;
  border-radius:12px;padding:18px 18px 15px;
  background:var(--blue);color:#fff;box-shadow:0 2px 10px rgba(43,92,217,.28)}
.hero-card:active{transform:scale(.99)}
.hero-top{display:flex;align-items:center;gap:12px}
.hero-play{flex:0 0 46px;width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;padding-left:3px;
  box-shadow:none}
.hero-tt{flex:1;min-width:0}
.hero-tt b{display:block;font-size:11px;color:rgba(255,255,255,.75);letter-spacing:2px;margin-bottom:3px}
.hero-tt span{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}

   app/rank.css · 「进阶之路」段位体系样式
   （App 主页面浅色主题：卡片 / 段位卡 / 阶梯 / 晋级考核 / 晋升证书 / 提示条）

/* ---------- 首页 段位卡 ---------- */
.rk-card{background:linear-gradient(150deg,rgba(26,111,232,.08),rgba(26,111,232,.02));border:1px solid rgba(26,111,232,.28);border-radius:20px;padding:16px 18px;margin:14px 0;cursor:pointer}

.rk-top{display:flex;align-items:center;gap:10px}
.rk-pill{display:inline-block;background:linear-gradient(150deg,#1a6fe8,#1557b0);color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.5px;flex:0 0 auto}
.rk-pill.dim{background:rgba(0,0,0,.12);color:var(--dim)}
.rk-name,.rk-t{font-size:17px;font-weight:800}
.rk-cta{margin-left:auto;font-size:12.5px;color:var(--dim2);flex:0 0 auto}
.rk-cap{color:var(--dim);font-size:12.5px;margin:7px 0 0;line-height:1.65}
.rk-bar{height:8px;border-radius:5px;background:rgba(0,0,0,.06);margin:11px 0 6px;overflow:hidden}
.rk-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#1a6fe8,#8944d6);transition:width .5s ease;width:0}
.rk-card.ready .rk-bar i{background:linear-gradient(90deg,#e0a800,#c99700)}
.rk-meta{font-size:11.5px;color:var(--dim2)}
.rk-ready{display:block;width:100%;margin-top:11px;background:rgba(255,214,10,.18);border:1px solid rgba(255,214,10,.55);color:#8a6a00;font-weight:800;font-size:13px;border-radius:12px;padding:11px;text-align:center;cursor:pointer;font-family:inherit}
.rk-ready:active{transform:scale(.97)}

/* ---------- 进阶之路 全屏页 ---------- */
#rankView{position:fixed;inset:0;z-index:160;background:#f7f7f5;display:none;flex-direction:column}
#rankView.on{display:flex}
.rk-now .rk-nowtop{display:flex;align-items:center;gap:10px}

.rk-req{display:flex;align-items:baseline;gap:8px;padding:8px 0 2px;font-size:13px}
.rk-req .ic{width:16px;flex:0 0 auto;font-weight:800;color:var(--dim2)}

.rk-mini{height:5px;border-radius:3px;background:rgba(0,0,0,.05);overflow:hidden;margin:2px 0 4px}

/* 阶梯 */
.rk-lvrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line2);font-size:13.5px}

<script>
/* kc 懒加载 loader（tools/split_study.py 生成） */
(function(){
var M=window.__KC_MANIFEST,D=window.DOCS;
var pend={},loaded=M.loaded={};
window.__kcAllLoaded=false;
window.__kcChunk=function(name,obj){
  loaded[name]=1;
  for(var id in obj){ var d=D[id]; if(d) d.html=obj[id]; }
  var q=pend[name]; delete pend[name];
  if(q) for(var i=0;i<q.length;i++){ try{q[i]();}catch(e){} }
};
function load(name){
  if(loaded[name]) return Promise.resolve();
  if(pend[name]) return pend[name];
  return pend[name]=new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src=M.base+M.chunks[name].u;
    s.onload=function(){ if(!loaded[name]){ delete pend[name]; } res(); };
    s.onerror=function(){ delete pend[name]; rej(new Error('chunk '+name)); };
    document.head.appendChild(s);
  });
}
window.__kcEnsure=function(d){ return (d && d._ck && !d.html) ? load(d._ck) : Promise.resolve(); };
var last=null;
try{ last=D[localStorage.getItem('wg.lastDoc')]||null; }catch(e){}
var order=[],i;
if(last&&last._ck) order.push(last._ck);
for(i in M.chunks) if(order.indexOf(i)<0) order.push(i);
var p=0;
function step(){
  if(p>=order.length){ window.__kcAllLoaded=true; return; }
  load(order[p++]).then(function(){ setTimeout(step,120); },function(){ setTimeout(step,400); });
}
if((location.search||'').indexOf('noprefetch')<0) setTimeout(step,2500);
})();
</script>

tutorial_13: {t:'第13章 · 自动化运维', q:[
  {q:'Ansible 管理远程机器靠什么？（无 Agent）',o:['SSH','安装客户端软件','U 盘','远程桌面'],a:0,e:'Ansible 只靠 SSH 就能管上千台机器——这是它火的原因。'},
  {q:'terraform plan 的作用是？',o:['真的创建资源','预演：显示将要发生的变化（不执行）','删除所有资源','联网下载'],a:1,e:'plan=先看要变什么，apply=真执行。先 plan 再 apply 是铁律。'},
  {q:'Terraform 的 state（状态文件）记录了什么？',o:['用户的密码','已创建资源与现实世界的映射账本','代码历史','网络流量'],a:1,e:'state 让 Terraform 知道"哪些资源是我造的"——丢了它管理就断线。'},
  {q:'CI/CD 中 CI 指？',o:['持续集成：提交代码后自动测试/构建','公司保险','中央情报','控制面板'],a:0,e:'CI=持续集成（自动测试构建），CD=持续部署（自动发布上线）。'}
]},
tutorial_14: {t:'第14章 · 监控与日志', q:[
  {q:'Prometheus 采集指标的方式是？',o:['被动等上报','主动去目标拉取（pull）','人工填报','购买数据'],a:1,e:'Prometheus 每隔 15 秒主动抓取各目标的 /metrics 页面。'},
  {q:'Grafana 的主要用途是？',o:['把监控指标画成仪表盘','写代码','杀毒','发邮件'],a:0,e:'Grafana 连接 Prometheus 等数据源，做出漂亮的监控大盘。'},
  {q:'实时跟踪日志文件（新内容自动滚动）用？',o:['cat 文件','tail -f 文件','head 文件','grep 文件'],a:1,e:'tail -f 就像日志直播；Ctrl+C 退出。'},
  {q:'告警规则里 for: 5m 的目的是？',o:['防抖动：持续 5 分钟才告警','延迟 5 分钟发送','5 分钟后自动修复','测试用'],a:0,e:'瞬时波动不告警，持续异常才叫人——避免"狼来了"式告警疲劳。'}
]},
tutorial_15: {t:'第15章 · 安全加固', q:[
  {q:'禁止 root 用户直接 SSH 登录要改哪个配置？',o:['PermitRootLogin no','AllowRoot false','NoRoot yes','RootLogin off'],a:0,e:'/etc/ssh/sshd_config 中 PermitRootLogin no + 只认密钥登录。'},
  {q:'fail2ban 的作用是？',o:['自动封禁暴力破解的 IP','杀毒','备份文件','加速网络'],a:0,e:'盯着登录日志，同一 IP 连续失败多次就自动封它。'},
  {q:'WAF 部署在什么位置？',o:['网站前面，拦截 SQL 注入/XSS 等攻击流量','服务器内部','数据库里','邮件系统'],a:0,e:'WAF=Web 应用防火墙，站在网站门口的安检门（比赛里用无 UA 请求测试它）。'},
  {q:'代码里写死数据库密码的主要问题是？',o:['运行慢','泄漏即失守，且无法轮换','占内存','没人能看见'],a:1,e:'正确做法：Secrets Manager/环境变量注入——代码里永远不写密码。'}
]},
tutorial_16: {t:'第16章 · 真题实战', q:[
  {q:'世界技能大赛的评分方式是？',o:['评委肉眼看看','评分脚本逐项实测功能','选手自评','抽签'],a:1,e:'评分脚本检查"能不能工作"（能登录吗？证书对吗？）——功能实测为准。'},
  {q:'比赛时间紧张时的正确策略是？',o:['死磕一道难题','先快速拿走所有"安全分"，再回头攻坚','提前交卷','放弃'],a:1,e:'按分数/耗时比排序，先保底再冲锋——所有金牌选手的共识。'},
  {q:'韩国赛选手题解里大量使用的自动化工具是？',o:['Terraform + Makefile','Photoshop','Excel','记事本'],a:0,e:'make up 一键部署是韩国选手的标配工程化习惯，值得学习。'},
  {q:'比赛题面与评分标准有冲突时，以哪个为准？',o:['题面','评分标准','自己的直觉','问旁边的'],a:1,e:'韩国题面明文规定：以评分标准为准——它决定你的分数。'}
]},
tutorial_17: {t:'第17章 · 机房管理', q:[
  {q:'UPS 在机房里扮演的角色是？',o:['替代市电长期供电','停电时提供缓冲时间（从容关机/等发电机），保证零中断切换','给服务器提速','省电费'],a:1,e:'UPS 顶 10-30 分钟，是"缓冲"不是"替代"；机房标准配双变换在线式（0ms 切换）。'},
  {q:'机房推荐的温湿度区间是？',o:['10-15°C，越干越好','18-27°C、湿度 40-60%','30°C 以上没事','只看温度不看湿度'],a:1,e:'太干起静电、太湿会结露，温度每升 10°C 元件寿命减半——温湿度是一对指标。'},
  {q:'RAID 5 最少要几块盘、能容错几块？',o:['2 块，容错 1','3 块，容错 1','4 块，容错 2','1 块，无容错'],a:1,e:'RAID5=至少 3 盘+1 份分散校验，坏 1 块可恢复；换盘后重建期间若再坏一块就全灭，所以要尽快换。'},
  {q:'服务器「带外管理」（IPMI/iDRAC/iLO）的最大价值是？',o:['让网速更快','系统宕机/关机时仍能远程开关机、看屏幕、装系统、读温度','省电','给服务器加密'],a:1,e:'只要插着电就能管理——机房远程运维 80% 靠它；它的网口必须隔离在独立管理 VLAN。'},
  {q:'PXE 批量装机时，客户端从哪里获得引导文件和系统镜像？',o:['U 盘','装机服务器：DHCP 发 IP+引导地址，TFTP 传引导程序，HTTP/NFS 传镜像','互联网','打印机'],a:1,e:'配好 Kickstart/preseed 应答文件后全自动无人值守——30 台机器约 40 分钟装完。'},
  {q:'学校机房要统一更新系统（装新软件），正确顺序是？',o:['直接装完事','解除还原保护→装好验证→重新上保护→抽一台重启复核','关掉还原功能不管了','全部重装'],a:1,e:'顺序反了一宿白干；每次更新都要留一台没动的机器做对照，防止批量事故。'}
]},
tutorial_18: {t:'第18章 · 装机从零到极致', q:[
  {q:'装机前最不能搞错的"第一条兼容性红线"是？',o:['CPU 插槽/代数与主板一致','内存容量够大','机箱颜色好看','键盘接口类型'],a:0,e:'LGA1700 装不进 AM5 主板——插槽错了后面全白搭，下单前第一项检查。'},
  {q:'两条内存组建双通道，应该插主板的哪两个槽？',o:['1、2 槽','2、4 槽（A2/B2）','1、3 槽','随便插哪都行'],a:1,e:'优先第 2、4 槽（主板标注 A2/B2），双通道带宽提升对核显和游戏都很明显。'},
  {q:'估算整机电源功率的正确姿势是？',o:['看机箱大小选','CPU 功耗 + 显卡功耗 + 100W 余量，再留 30% 冗余','按页面上最大的数字买最贵的','350W 万能'],a:1,e:'整机峰值会顶上去，冗余是保命的；电源是最不能省的部件，炸电源经常带走主板显卡。'},
  {q:'机箱前面板 F_PANEL 里，哪组线不分正负随便插？',o:['开机键 PWR_SW','电源灯 PWR_LED','硬盘灯 HDD_LED','全部都分正负'],a:0,e:'开关本质是短接一下，两针不分方向；LED 分正负，接反了不亮（但不会烧）。'},
  {q:'装完机验收时，BIOS 里最容易忘记但必须打开的是？',o:['屏保','内存的 XMP/EXPO','跑马灯','蓝牙'],a:1,e:'不开 XMP，6000MHz 内存会按 4800 保守跑——花钱买的高频全白费。'},
  {q:'给 CPU 涂硅脂的正确方式是？',o:['越多越好，抹厚厚一层','薄薄一层/中间一点，压上去自然铺开','涂满 CPU 四周边缘','不需要硅脂'],a:1,e:'硅脂只负责填补金属表面的微观缝隙，太多反而降低导热还会挤出污染插槽。'}
]},
tutorial_19: {t:'第19章 · 编译原理', q:[
  {q:'编译器的"前端"通常包括哪几个阶段？',o:['词法 / 语法 / 语义分析','优化 / 代码生成 / 链接','只有词法分析','加载和执行'],a:0,e:'前端跟着源语言走（词/句/义），后端跟着目标机器走——LLVM 让多语言共享后端就是靠这个分层。'},
  {q:'词法分析的输出是什么？',o:['语法树','token 流','机器码','可执行文件'],a:1,e:'字符流 → token 流；语法分析再把 token 流组装成 AST（语法树）。'},
  {q:'递归下降语法分析器的核心思想是？',o:['每条文法规则写成一个函数','递归到死循环为止','随机试错','查表拼字符串'],a:0,e:'每个非终结符对应一个函数，看到什么 token 就调什么函数——实战中最常用的手写解析套路。'},
  {q:'"2+3*4" 里乘法先算，在文法里靠什么体现？',o:['运行时再判断','文法层次：乘法的规则嵌套在加法的规则内部','编译器的默认设置','随机顺序'],a:1,e:'运算优先级 = 文法层次。低优先级规则（add）包含高优先级规则（mul），树自然长得对。'},
  {q:'字节码虚拟机（如 JVM）最典型的执行模型是？',o:['栈式机器','磁芯存储模型','打孔卡片模型','纯正则匹配'],a:0,e:'操作数压栈出栈：LOAD/PUSH 压栈，ADD 弹出两个、相加后把结果压回去。'},
  {q:'把 if 编译成跳转指令时，"先占位、编译完再填真实地址"的技术叫？',o:['回填（backpatching）','压缩','加密','内存拷贝'],a:0,e:'生成 JZ 时还不知道 else 的地址，先留空占位，分支编译完后回填——本章代码里能直接看到这一手。'}
]},
tutorial_20: {t:'第20章 · 锐捷云平台基础', q:[
  {q:'B7《锐捷云平台基础》试题A 中，镜像名称和教室名称要求填什么？',o:['任意英文名','你的汉语姓名','学号','班级名'],a:1,e:'试卷原文：都填「名字（汉语）」——就是你自己的中文姓名。'},
  {q:'试题要求的操作系统是什么？',o:['Windows 11 家庭版','Windows 10 22H2 专业版','Windows Server 2022','Windows 7'],a:1,e:'原文：要求系统使用 Windows 10 22H2 专业版——版本和专业版都不能错。'},
  {q:'镜像配置要求是（处理器 / 内存 / 系统盘）？',o:['2核 / 2G / 40G','4核 / 4G / 60G','8核 / 8G / 100G','4核 / 8G / 60G'],a:1,e:'处理器 4、内存 4、系统盘 60；资源要「合理分配不超标」——多给也算错。'},
  {q:'镜像的「操作系统名」（账户）要求是？',o:['admin','adminjf','Administrator','student'],a:1,e:'试卷原文：操作系统名 adminjf——建镜像时按平台字段照填。'},
  {q:'镜像里必须安装的程序是？',o:['Office','VS','微信','Photoshop'],a:1,e:'「安装 VS 程序」——装进镜像里，再批量下发给学生机。'},
  {q:'教师端和学生端的磁盘策略分别是？',o:['都有数据盘','教师无数据盘；学生无数据盘 + 无个性化','学生要数据盘','教师无数据盘；学生要个性化'],a:1,e:'原文：教师无数据盘需求；学生无个性化无数据盘需求。学生每次还原。'},
  {q:'教室网络资源 IP 第 4 位怎么分配？',o:['教师端 1、学生端 2 起','教师端 100、学生端 101 起顺延','随机分配','教师端 100、学生端也 100'],a:1,e:'原文：教师端第 4 位 100；学生端 = 教师 +1 起——即 .101、.102 逐台顺延。'},
  {q:'「学生端：教师+1 起」的正确理解是？',o:['所有学生都用 .101','从 .101 开始逐台 +1 顺延','学生从 .1 开始','学生用 .99 起'],a:1,e:'第一个学生 .101、第二个 .102……顺着排下去。'},
  {q:'教师机主机名要求是？',o:['teacher','gyjsjs','jsj01','admin'],a:1,e:'一字不差：gyjsjs。'},
  {q:'座位名前缀（含特殊符号）是？',o:['gyjszw','gyjszw-','gyjswz-','gyjs-zw'],a:1,e:'gyjszw-，注意带半角连字符「-」——特殊符号别漏。'},
  {q:'最终验收「师生信息交互」要看哪两项？',o:['聊天 + 上网','文件分发 + 屏幕广播','打印 + 扫描','关机 + 重启'],a:1,e:'教师端发文件 / 广播，学生端要收到、要画面同步——两项都通才算过。'},
  {q:'锐捷云后台报错的扣分规则是？',o:['每次扣 1 分','报错超过 2 次及以上，每次扣 10 分','不扣分','第一次仅警告'],a:1,e:'报错最贵！所以「不抢步、不多点」比什么都重要。'},
  {q:'关于考试时间，哪个说法正确？',o:['所有操作都计时','镜像批量下发学生机时间不计入','超时直接零分','不限时'],a:1,e:'原文：时间不包含镜像批量下发学生机时间——下发慢不用慌，更不能中途强操作。'},
  {q:'操作顺序正确的是？',o:['先建教室再制作镜像','先做出可用镜像 → 再建教室填网络 / 命名 → 下发 → 验证互动','先验证互动再建教室','顺序无所谓'],a:1,e:'没有可用镜像就建教室必报错；先镜像后教室，再下发、再验证。'},
  {q:'操作中拿不准某个字段怎么填，正确做法是？',o:['随便填试试','先问统计员再填，不猜不试','填了再说','跳过不填'],a:1,e:'报错才扣分、问人不扣——不确定先问统计员，最终以统计员为准。'}
]},
mastery_00: {t:'精通·00 像说话一样掌握云计算', q:[
  {q:'「像说话一样掌握云计算」最终要达成什么状态？',o:['背下所有命令','不假思索地调出知识（母语级直觉）','考最多证书','收藏最多教程'],a:1,e:'母语的特征是不经过思考就能用——专业知识练到本能反应，才是真掌握。'},
  {q:'大多数人学云计算卡在什么状态？',o:['完全没入门','「认识但用不出来」的半哑巴状态','学得太多','证书太少'],a:1,e:'看得懂、考得过，但一动手就卡壳——这是「半个哑巴」：输入很多，输出太少。'},
  {q:'摆脱「半哑巴」的核心方法是什么？',o:['再多看 100 个视频','输出倒逼输入：讲出来、做出来才算会','买新教材','报更贵的课'],a:1,e:'能讲明白、能做出来的知识才真正属于你——输出是检验输入的唯一标准。'},
  {q:'五级能力阶梯的顶端（L5）是什么样的人？',o:['能跟着教程做','能创造、能教学、能解决任何新问题','考过认证','能背出文档'],a:1,e:'L5 是母语级：不但自己会，还能教别人、能应对没见过的新问题。'}
]},
mastery_01: {t:'精通·01 疆域全景图', q:[
  {q:'云计算世界的整体结构按什么层次组织？',o:['平台层 → 服务域层 → 横切能力层','硬件 → 软件','入门 → 高级','理论 → 实践'],a:0,e:'先看 6 大云平台（舞台），再看 16 个服务域（角色），最后是安全、自动化等横向贯穿能力。'},
  {q:'所谓「6 大云家族」一般指？',o:['6 种编程语言','AWS/Azure/GCP/阿里云/华为云/腾讯云等主流云平台','6 种数据库','6 个 Linux 发行版'],a:1,e:'全球 + 国内六大主流平台——你的技能最终要能跨这些平台迁移。'},
  {q:'「横切能力层」（如安全、自动化）为什么叫横切？',o:['它们要切开东西','它们贯穿所有服务域，不是单独一个领域','它们最难学','它们是选修的'],a:1,e:'安全、自动化、可观测等能力不专属某个域，而是贯穿每一层——是「贯穿思维」。'},
  {q:'为什么要把疆域全景图放在学习的第一章？',o:['凑章节数','先有地图再走路：知道结构才不会迷路','考试要考','好看'],a:1,e:'先建立全局坐标，后面每个知识点都知道「挂在哪」，学习效率完全不同。'}
]},
mastery_02: {t:'精通·02 精通阶梯与自测', q:[
  {q:'L1「使用者」的典型特征是什么？',o:['能跟着教程一步步做出来','能独立设计系统','能发明新方案','能教学'],a:0,e:'L1 是「会照着做」——教程是拐杖，做完了但换个场景就慌。'},
  {q:'L2「操作者」与 L1 的核心差别？',o:['打字更快','不依赖教程也能完成标准任务','会写代码','有证书'],a:1,e:'L2 的标志是「脱稿」：没有教程也能把标准场景做出来。'},
  {q:'L3「设计者」会做什么？',o:['照抄网上的方案','白手起家：从需求出发设计出可行方案','背别人的架构','只会一种做法'],a:1,e:'能设计意味着你理解了「为什么」——方案是你推出来的，不是抄来的。'},
  {q:'做「精通阶梯自测」的最大意义是什么？',o:['给自己打分玩','找到真实层级，针对性向上突破','炫耀','完成作业'],a:1,e:'最大的浪费是在错误的层级练习——自测让你知道下一步该练什么。'}
]},
mastery_03: {t:'精通·03 领域深度修炼', q:[
  {q:'计算（Compute）领域修炼的终点方向是？',o:['会开机','从「会开机」到「编排地球」——规模与自动化的极致','会装系统','会重启'],a:1,e:'计算的修炼层级：单机 → 集群 → 自动化编排 → 全球规模。'},
  {q:'存储（Storage）修炼要抵达的角色是？',o:['会复制粘贴文件','数据生命周期建筑师','会插硬盘','会删文件'],a:1,e:'从会存会取，到设计数据从产生到销毁的完整体面。'},
  {q:'网络（Networking）修炼的进阶路径是？',o:['会插网线 → 网络空间建筑师','会 ping','会连 WiFi','会看 IP'],a:0,e:'从会设安全组到设计混合云网络、跨区域架构——网络是云架构的物理底座。'},
  {q:'数据库修炼的终点描述是？',o:['会写 SELECT','数据架构之魂：理解数据如何流动与守护','会装 MySQL','会备份'],a:1,e:'数据是系统的灵魂——从写单表查询到设计高可用、分布式、生命周期治理。'}
]},
mastery_04: {t:'精通·04 架构模式手册', q:[
  {q:'架构模式手册按哪四组组织？',o:['前端/后端/数据库/网络','伸缩与性能 / 解耦与集成 / 可靠性与容灾 / 发布与运维','简单/中等/困难/地狱','读写删改'],a:1,e:'四组模式覆盖了架构设计的四个核心关切——记住分组，临场就不会乱。'},
  {q:'「解耦」最典型的手段是什么？',o:['消息队列','加服务器','多买硬盘','更快的 CPU'],a:0,e:'队列让生产者和消费者不必同时在线——系统从「手拉手」变成「松开手也不散」。'},
  {q:'「可靠性与容灾」组的关键词是？',o:['更快更高','多可用区/故障转移/备份恢复','省钱省力','好看好用'],a:1,e:'可靠性的本质是冗余与切换：任何单点都要有备胎，且切换要能自动。'},
  {q:'为什么要「背」架构模式（而不是现查）？',o:['显得专业','临场设计时要能瞬间调取——背下来才能组合创新','考试要默写','老师要求的'],a:1,e:'模式是架构师的「词汇量」：词汇不够，句子就造不出来。先存进脑子，再谈创造。'}
]},
mastery_05: {t:'精通·05 全平台地图', q:[
  {q:'「核心服务超级对照表」背横向的作用是什么？',o:['炫耀记忆','实现跨云迁移：知道 A 云的服务对应 B 云的什么','参加比赛背题','没作用'],a:1,e:'横向对照一背，学新云就是「换名字」——这是跨云能力的杠杆。'},
  {q:'「两周学会一朵新云」靠的是什么方法？',o:['从零死磕每个细节','核心服务映射 + 玩转方法论（先骨架后细节）','报最贵的课','抄别人的笔记'],a:1,e:'云平台同构性极高：先映射核心服务，再用两周集中实战，就能上手。'},
  {q:'学新云前要先破除的心理障碍是？',o:['「我太笨」','「又要从零开始」——其实大部分知识可以迁移','「云太贵」','「学了没用」'],a:1,e:'你已有的知识 70% 可迁移，新云只是换了一套 API 和名字。'},
  {q:'全平台地图的终极价值是？',o:['收藏夹 +1','一处通、处处通——能力不绑死在单一平台','面试吹牛','省流量'],a:1,e:'平台会变、服务名字会变，但你脑子里的「概念骨架」稳定——这才是职业安全。'}
]},
mastery_06: {t:'精通·06 365 天训练系统', q:[
  {q:'365 天训练系统的每日功课怎么设计？',o:['每天必须学 8 小时','20-45 分钟，按当天时间选档','想学才学','周末补一切'],a:1,e:'低门槛 + 高频率：每天都能做到的小剂量，远胜过偶尔的暴学。'},
  {q:'每周功课一般安排在什么时间？',o:['工作时间','周日 2 小时（复盘 + 实战）','半夜','随机'],a:1,e:'每周固定复盘与实战，把碎片知识点缝成体系。'},
  {q:'每月功课的规模建议是？',o:['10 分钟','每月最后一周周末，半天（深度项目）','一年一次','不需要'],a:1,e:'月度深度时间做「完整项目」——这是把 L2 推向 L3 的关键动作。'},
  {q:'这个训练系统的设计哲学是什么？',o:['突击速成','可持续的节奏胜过一切：能坚持 365 天才有可能精通','比谁学得快','少学多玩'],a:1,e:'精通是时间的函数。系统设计的唯一目标就是：让你「明天还想继续」。'}
]},
mastery_07: {t:'精通·07 双精通时间线', q:[
  {q:'「双精通」指的是哪两条线？',o:['云计算 + 计算机科学','英语 + 数学','编程 + 运维','硬件 + 软件'],a:0,e:'云计算是职业战场，计算机科学是底层内功——两条线互相供养。'},
  {q:'「分开学 vs 合并学」的结论是？',o:['分开学更高效','合并学：两条线互为支撑，同时推进反而更快','只学一个就行','看心情'],a:1,e:'学 K8s 时顺手理解操作系统调度，学网络时联系 CS 协议栈——合并让每份时间产出两份理解。'},
  {q:'让 24 个月计划「变成可能」的保障是什么？',o:['运气','六条纪律（固定节奏、输出优先等）','花钱','天赋'],a:1,e:'时间线再美，落地全靠纪律——计划是纸，纪律是钢。'},
  {q:'关于 L5 母语级的时间轴，诚实的说法是？',o:['3 个月速成','比想的长：以年为单位积累，但每一步都算数','永远达不到','看天赋'],a:1,e:'诚实面对时间尺度，反而能安心：因为你知道每一年都在逼近，而不是焦虑「怎么还没到」。'}
]},
cs_00: {t:'CS·00 五书共生体系', q:[
  {q:'五书共生体系的「核心洞察」是什么？',o:['书要买五本','同一知识出现三次，就会变成母语','一本书读五遍','五个人的笔记'],a:1,e:'知识在不同书里以不同角度重逢——重逢三次，就在你脑里长成了本能。'},
  {q:'为什么这五本书「必须一起学」？',o:['打折便宜','它们互为上下文：拆开来谁都学不通、学不深','书单好看','图书馆要求'],a:1,e:'理论书需要工程书来落地，工程书需要认知书来提速——单独看，每本都少一条腿。'},
  {q:'「把五本书放到同一张图上」的意义是什么？',o:['做思维导图交作业','构建知识网络：每个概念都知道其他书里谁在呼应它','好看','没意义'],a:1,e:'孤立的知识点会忘记，织进网络的知识点会被反复激活——这就是长期记忆的秘密。'},
  {q:'五书共生的学习原理接近哪种科学结论？',o:['多角度编码 + 间隔重逢 = 长期记忆','睡前背书','大声朗读五遍','抄写 100 次'],a:0,e:'同一概念在多个语境下反复出现，是记忆科学里最强效的编码方式。'}
]},
cs_01: {t:'CS·01 五书拆解地图', q:[
  {q:'《计算机系统要素》（Nand2Tetris）带你从哪造到哪？',o:['从网页到数据库','从与非门一路造到可以跑程序的计算机','从 CPU 到操作系统','从 0 到 1 写文档'],a:1,e:'Nand2Tetris：从逻辑门开始，一路造出 ALU、CPU、汇编器、编译器、操作系统——完整理解「计算机如何工作」。'},
  {q:'《C Primer Plus》在体系里承担什么角色？',o:['语言教材 + 工程肌肉的起点','算法大全','网络手册','面试宝典'],a:0,e:'C 是操作系统与云基础设施的母语——学它让你看懂内核、网络栈和一切底层系统代码。'},
  {q:'《思考，快与慢》为学习体系提供什么？',o:['心理学八卦','系统 1 / 系统 2 的认知框架：理解「为什么学了会忘」','数学公式','成功学'],a:1,e:'用系统 1（快、自动）和系统 2（慢、费力）解释学习：把知识从系统 2 训练成系统 1，就是「母语化」。'},
  {q:'「拆解地图」这一章最实际的价值是什么？',o:['知道每本书讲什么、各承担哪条能力线，从而安排学习顺序','背书名','凑字数','出版信息'],a:0,e:'地图在手，你不会再问「下一本读什么」——你知道每本书补的是哪块肌肉。'}
]},
cs_02: {t:'CS·02 24 个月整合计划', q:[
  {q:'24 个月计划把整个旅程分为几个阶段？',o:['三个阶段','五个阶段（从点火到精通）','十个阶段','没有分阶段'],a:1,e:'五个阶段像五段楼梯：每段都有明确的「毕业标准」，踩实了再往上。'},
  {q:'「阶段 0 · 点火」的任务是什么？',o:['学最高深的内容','第 1 个月：搭环境、定节奏、建立学习习惯','考认证','买设备'],a:1,e:'点火期不追求深度，只追求「跑起来」——习惯一旦建立，后面才是加速阶段。'},
  {q:'每周课表模板的设计原则是？',o:['每天都排满','有骨架不排死：固定主线 + 弹性补课','随机安排','只排工作日'],a:1,e:'模板给的是节奏感，不是牢笼——留出弹性才能长期坚持。'},
  {q:'一个 24 个月计划能成功的关键是什么？',o:['计划本身完美','小步快跑 + 固定节奏 + 定期检视调整','一次学完','天赋异禀'],a:1,e:'完美计划死在第一天，可调整的计划活到最后——迭代能力比计划精度重要。'}
]},
cs_03: {t:'CS·03 认知引擎', q:[
  {q:'「系统 1」与「系统 2」分别指？',o:['两台电脑','快思考（直觉自动）/ 慢思考（费力理性）','两个操作系统','左右脑'],a:1,e:'系统 1 快捷省力但会出错，系统 2 精确但耗能——学习就是让系统 2 的技巧沉淀为系统 1 的本能。'},
  {q:'学习技能的终极目标是什么？',o:['永远用系统 2 硬算','把知识从系统 2 练成系统 1：不假思索就能调出来','不用脑子','背下来就行'],a:1,e:'高手的秘密：核心技能已「系统 1 化」——省下的脑力全用来思考战略。'},
  {q:'以下哪项属于学习科学的有效武器？',o:['反复重读划重点','主动回忆 + 间隔重复 + 交错练习','抄写','听课听到睡着'],a:1,e:'科学验证的最强组合：合上书回忆、隔几天再测、不同主题穿插练。'},
  {q:'为什么每本书都要做「系统 1 化训练」？',o:['仪式感','技能自动化后，你才有余力应对真实场景的复杂性','书要求','凑时间'],a:1,e:'真实战场上没有时间慢慢推理——自动化不是选项，是入场券。'}
]},
cs_04: {t:'CS·04 项目实战清单', q:[
  {q:'Nand2Tetris 线包含多少个项目？',o:['5 个','12 个','50 个','3 个'],a:1,e:'12 个项目从逻辑门到操作系统，是「从晶体管到软件」的完整征途。'},
  {q:'项目体系分哪三条线？',o:['Nand2Tetris 主线 / C 工程线 / 编译器理论线','前端/后端/全栈','简单/中等/困难','读书/考试/比赛'],a:0,e:'三条线互相喂养：硬件理解喂养 C，C 喂养编译器，编译器理解反哺所有。'},
  {q:'「作品集」在职业竞争中的意义是？',o:['占硬盘','项目证明能力——比证书更硬的证据','装样子','没意义'],a:1,e:'面试官看代码仓库 5 分钟，胜过看简历 5 页——作品是最诚实的学历。'},
  {q:'C 项目线主要练什么？',o:['网页设计','工程肌肉：指针、内存管理、调试、构建','Excel 表格','打字速度'],a:1,e:'C 逼你直面内存与指针——这些肌肉让你之后学任何语言都快。'}
]},
know_01: {t:'知识·01 Linux 与操作系统', q:[
  {q:'进程和线程最本质的区别是什么？',o:['进程快线程慢','进程是资源分配单位，线程是调度单位','线程更贵','没区别'],a:1,e:'进程拥有独立内存空间等资源；线程共享进程资源，切换更轻——这决定了并发模型的选型。'},
  {q:'「Linux 一切皆文件」的意思是什么？',o:['只能存文件','设备、管道等都被抽象成文件来读写','不能写程序','文件最大'],a:1,e:'/dev/sda、/proc/cpuinfo 都能像文件一样读写——统一的 IO 抽象是 Linux 设计的灵魂。'},
  {q:'虚拟内存的核心作用是？',o:['让硬盘变大','给每个进程独立的地址空间，并支持超出物理内存使用','省电','加速打字'],a:1,e:'虚拟地址让进程互不干扰，swap 让小内存跑大程序——代价是页错误时的性能抖动。'},
  {q:'Linux 权限模型 rwx 中「x」对目录意味着什么？',o:['不能读','能否进入该目录（cd 进去）','能否删除自己','没意义'],a:1,e:'目录的 x 是「通行证」——没有 x，目录里的文件你连碰都碰不到。'}
]},
know_02: {t:'知识·02 网络工程', q:[
  {q:'TCP 三次握手的目的之一是？',o:['加密数据','双方确认彼此的收发能力都正常','压缩流量','省时间'],a:1,e:'SYN → SYN-ACK → ACK：三次交互让双方都确认「我能发能收」——可靠传输的起点。'},
  {q:'子网掩码 255.255.255.0（/24）表示什么？',o:['网速上限','前 24 位是网络号：同网段可容纳 254 台主机','加密位数','带宽'],a:1,e:'/24 切出 256 个地址（首尾保留），跨网段要经网关——划分子网就是在切广播域。'},
  {q:'路由器转发时「最长前缀匹配」的意思是？',o:['随便选一条','越精确（前缀越长）的路由越优先被采用','按时间先后','按长度排序'],a:1,e:'去同一个目的地有多条路时，路由表选最精确那条——这是路由查找的基本规则。'},
  {q:'网络排障的标准顺序是？',o:['从应用层往下','从底层往上：链路 → IP → DNS → 端口/服务','随机猜','只看日志'],a:1,e:'ping 网关（链路/IP）→ ping 8.8.8.8（公网）→ dig 域名（DNS）→ curl 端口（服务）——一层层往上，5 分钟定位。'}
]},
know_03: {t:'知识·03 企业服务全栈', q:[
  {q:'企业内网 DNS 与公网 DNS 的核心差别是？',o:['没有差别','内网 DNS 解析内部域名（不对外），并可转发外部查询','内网更快','内网免费'],a:1,e:'企业用内部域（如 corp.local）管理内网资源，外部域名转发给公网 DNS——双轨制。'},
  {q:'反向代理与正向代理的区别是？',o:['方向不一样：反向代理代表服务器收请求，正向代理代表客户端发请求','都是转发','反向的贵','正向的慢'],a:0,e:'Nginx 反代站在服务器前面（用户不知道背后有多少台）；翻墙代理是正向代理（代表你出去）。'},
  {q:'Active Directory 和 OpenLDAP 共同提供的服务是？',o:['网页服务','目录服务：统一管理用户/组/权限','邮件','杀毒'],a:1,e:'目录服务是企业 IT 的中枢：一处建号，处处可用；一处禁用，处处失效。'},
  {q:'邮件系统里 SMTP 和 IMAP 的分工是？',o:['都发邮件','SMTP 负责发送，IMAP 负责收件箱同步','SMTP 收 IMAP 发','都是网页'],a:1,e:'SMTP 是邮局（发信投递），IMAP 是信箱（多设备同步阅读）——各司其职。'}
]},
know_04: {t:'知识·04 虚拟化与私有云', q:[
  {q:'Type 1（裸金属）Hypervisor 与 Type 2 的区别是？',o:['颜色不同','Type 1 直接跑在硬件上（ESXi/KVM），Type 2 跑在操作系统上（VirtualBox）','Type 1 更慢','没区别'],a:1,e:'生产环境几乎都用 Type 1：少一层操作系统，性能与稳定性更好。'},
  {q:'OpenStack 中 Nova 组件负责什么？',o:['网络','计算：管理虚拟机的生命周期','存储','数据库'],a:1,e:'Nova=计算、Neutron=网络、Cinder=块存储、Keystone=认证——私有云的积木。'},
  {q:'虚拟机「快照」和「备份」的区别是？',o:['都是复制','快照是瞬时状态点（依赖原盘、适合回滚），备份是独立副本（适合灾难恢复）','快照更安全','备份更快'],a:1,e:'快照不是备份！原盘损坏快照一起完蛋——生产系统必须做真正独立的备份。'},
  {q:'企业选择私有云（而非公有云）的核心动机通常是？',o:['更便宜','数据可控/合规/安全要求','更快','更酷'],a:1,e:'金融、政务等数据敏感行业：合规与可控性是第一优先级——私有云是必然选择。'}
]},
know_05: {t:'知识·05 公有云核心 AWS', q:[
  {q:'EC2 与 EBS 的关系类似什么？',o:['浏览器与网页','电脑主机与它的硬盘','键盘与鼠标','邮件与附件'],a:1,e:'EC2=虚拟机本体，EBS=挂载的块存储盘——关机保留数据靠 EBS，实例本身可以随时销毁。'},
  {q:'S3 最典型的使用场景是？',o:['跑数据库','对象存储：文件/备份/静态网站/数据湖','做 CPU 计算','当内存用'],a:1,e:'S3 存「对象」（文件+元数据），几乎无限容量——是云上数据的默认终点。'},
  {q:'VPC 中「私有子网」访问公网的正确方式是？',o:['直接连 IGW','经 NAT 网关出去（外面进不来）','不需要访问','桥接网卡'],a:1,e:'NAT 让私有子网「能出不能进」——配合安全组实现最小暴露面。'},
  {q:'IAM「角色（Role）」比「用户密钥」更推荐的原因是？',o:['名字好听','临时凭证自动轮换，无需在代码里存长期密钥','更便宜','更快'],a:1,e:'角色给 EC2/服务发放自动过期的临时凭证——密钥泄漏风险直接归零。'}
]},
know_06: {t:'知识·06 容器与编排', q:[
  {q:'容器与虚拟机的本质区别是？',o:['容器共享宿主内核（进程级隔离），虚拟机有独立内核（硬件级隔离）','容器更贵','虚拟机更快','没区别'],a:0,e:'容器轻在不用虚拟硬件和内核——秒级启动，代价是隔离性弱于虚拟机。'},
  {q:'Docker 镜像「分层」设计的价值是？',o:['好看','层可复用：多个镜像共享基础层，节省空间和下载时间','加密','防病毒'],a:1,e:'每层只记录变化，改一行代码只重建最上层——这是容器分发的速度之源。'},
  {q:'Kubernetes 的「声明式」是什么意思？',o:['写脚本一步步执行','你声明「期望状态」，系统自动对账到那个状态','命令行操作','图形界面'],a:1,e:'你写「要 3 个副本」，K8s 就持续工作直到现实=期望——自愈、滚动更新全靠这个模型。'},
  {q:'K8s 编排解决的核心问题不包括？',o:['调度（放哪台机器跑）','自愈（挂了自动重启）','扩展（按需增减副本）','帮你写业务代码'],a:3,e:'编排管的是「怎么跑」，不是「写什么」——业务逻辑永远是开发者的事。'}
]},
know_07: {t:'知识·07 自动化与 IaC', q:[
  {q:'Terraform 的核心工作模式是？',o:['命令式：一步步告诉它怎么做','声明式：描述想要的基础设施，它算出差量并执行','图形拖拽','人工审批'],a:1,e:'plan 展示差量、apply 执行——「声明目标，自动算路」是现代 IaC 的范式。'},
  {q:'Ansible 与其他配置管理工具（如 Puppet）的关键区别是？',o:['无 Agent：只靠 SSH 推送，不用在被管机器装客户端','更贵','不能并行','只支持 Windows'],a:0,e:'无 Agent 意味着零侵入——新机器不用做任何预安装就能被管理。'},
  {q:'GitOps 的核心原则是？',o:['代码放 GitHub 就行','Git 仓库是所有环境的唯一事实源，变更走 PR，系统自动同步','用 Git 命令部署','每天 commit'],a:1,e:'想改生产环境？先改 Git 再合并——审计、回滚、协作全部由 Git 天然满足。'},
  {q:'自动化脚本「幂等」的重要性是？',o:['跑一次就废','重复执行结果一致：失败重试、例行巡检都安全','更快','省内存'],a:1,e:'幂等让自动化可反复执行——这是它敢「无人值守」的底线保障。'}
]},
know_08: {t:'知识·08 可观测性与性能工程', q:[
  {q:'可观测性的三大支柱是？',o:['CPU/内存/磁盘','Metrics（指标）/ Logs（日志）/ Traces（链路追踪）','读/写/删','快/中/慢'],a:1,e:'指标告诉你「出没出问题」，日志告诉你「出了什么」，链路告诉你「卡在哪一跳」。'},
  {q:'SLO 与 SLI 的关系是？',o:['SLO 是目标值，SLI 是实际测量值','SLI 是目标','一样','无关'],a:0,e:'SLI 是实时指标（如可用率 99.95%），SLO 是承诺目标（99.9%）——用数据管理可靠性。'},
  {q:'「黄金四大信号」指哪四个？',o:['金木水火','延迟 / 流量 / 错误 / 饱和度','读/写/查/删','上/下/左/右'],a:1,e:'Google SRE 总结的监控铁四角：四个信号一盯，服务健康尽收眼底。'},
  {q:'性能优化的第一原则是？',o:['先优化再说','先测量后优化：拿数据说话，拒绝猜测','全都要快','增加资源'],a:1,e:'没有测量的优化都是赌博——瓶颈可能在你想不到的角落。'}
]},
know_09: {t:'知识·09 安全与韧性', q:[
  {q:'「纵深防御」的核心思想是？',o:['买最贵的防火墙','多层防线：任何一层被突破，下一层仍能拦截','只防外网','定期杀毒'],a:1,e:'防火墙→WAF→最小权限→加密→监控——没有单点，就没有单点失守。'},
  {q:'备份的「3-2-1 原则」指？',o:['3 份数据、2 种介质、1 份异地','3 天 2 次 1 年','3 个人管 2 台机器','随便'],a:0,e:'任何单一存储都可能同时覆灭（勒索病毒专杀备份）——异地独立副本是最后底线。'},
  {q:'RTO 与 RPO 分别指？',o:['恢复所需时间 / 可容忍的数据丢失量','运行时间','成本','速率'],a:0,e:'RTO 是「坏多久必须修好」，RPO 是「最多丢多少数据」——灾难恢复方案的两个靶心。'},
  {q:'「零信任」安全模型的核心原则是？',o:['内网可信外网不可信','永不默认信任：每次访问都要验证（身份+设备+上下文）','不装杀毒','断网最安全'],a:1,e:'边界已经消失（云+远程办公），「先验证再放行」成为唯一稳妥的姿态。'}
]},
know_10: {t:'知识·10 前沿与超越', q:[
  {q:'「AI 云服务化」的典型形态是？',o:['卖显卡','托管大模型 API：按 token 计费的智能即服务','卖软件','培训课'],a:1,e:'从 IaaS/PaaS 到 AIaaS：模型能力被封装成 API——云竞争的新战场。'},
  {q:'可持续性云架构（WSOS 2026 新增章节）关注什么？',o:['省钱','碳足迹与能效：选址绿电、弹性调度、资源效率','性能','安全'],a:1,e:'数据中心能耗已是全球议题——「绿色云」从加分项变成了比赛正式考点。'},
  {q:'平台工程（Platform Engineering）要解决什么痛点？',o:['运维太闲','开发者自助：把基础设施能力做成内部平台，减少等待和扯皮','监控','测试'],a:1,e:'「你要的环境自己申请」——平台工程是 DevOps 的下一站，也是职业新风口。'},
  {q:'云原生高级形态包括哪些方向？',o:['Serverless / 边缘计算 / Wasm 等','只做容器','只做虚拟机','没有方向'],a:0,e:'函数计算、边缘节点、WebAssembly——计算形态持续演化，但概念骨架相通。'}
]},
know_11: {t:'知识·11 竞赛实战指南', q:[
  {q:'世界技能大赛云计算的评分特征是什么？',o:['看报告质量','脚本实测：所有评分点都要「能工作」','印象分','看速度'],a:1,e:'评分脚本不关心你多辛苦——它只 curl、dig、verify：能跑=得分，跑不了=0 分。'},
  {q:'比赛现场的「保底策略」指？',o:['放弃难题','先快速做完所有确定会做的题，再回头攻坚','交卷走人','抄旁边的'],a:1,e:'每个模块先扫一遍拿「安全分」，把有限时间投在收益最高的地方——这是金牌选手的共识。'},
  {q:'12 周冲刺训练计划的设计要点是？',o:['每周一套真题 + 复盘失分表','前 11 周休息最后 1 周冲刺','只做理论题','只练打字'],a:0,e:'真题 + 失分表 + 针对补强，循环 12 周——比赛是练出来的，不是讲出来的。'},
  {q:'真题最有效的用法是？',o:['当阅读材料','限时裸做 → 对照评分标准自评 → 失分清零重做','收藏','转让给别人'],a:1,e:'限时压力下的裸做暴露出真实水平，失分表就是你的私人训练大纲。'}
]},
know_12: {t:'知识·12 认证与职业发展', q:[
  {q:'认证路线应该按什么逻辑排？',o:['哪个热门考哪个','按体系层级由低到高：匹配能力成长节奏','越贵越好','快速全考'],a:1,e:'认证是能力的路标而非目标——按成长节奏分批考，才不至于「证到用时方恨虚」。'},
  {q:'比赛获奖与认证的关系是？',o:['互相冲突','互相加成：比赛练真功夫，认证给行业标准背书','比赛更牛','认证更牛'],a:1,e:'面试官眼里：比赛证明你能实战，认证证明你系统学过——双证合璧最可信。'},
  {q:'从运维出发的典型职业路径是？',o:['运维 → 云工程师 → 架构师/专家','永远做运维','转销售','考公'],a:0,e:'技术纵深（云专家/架构师）或横向拓展（DevOps/SRE/安全）——路线不同，底层能力通用。'},
  {q:'国内对世赛选手的政策支持包括？',o:['没有任何政策','职业资格/升学/就业等多维度支持（各地细化）','只发奖状','只在校内'],a:1,e:'多地把世赛成绩与技能等级、职称、升学通道挂钩——信息差就是机会差，选手应主动了解本地细则。'}
]},
room_00: {t:'机房·00 总纲（从零到极致）', q:[
  {q:'机房管理者的决策优先级（任何时刻）是？',o:['设备 > 数据 > 人','人 > 数据 > 设备 > 面子','数据 > 人 > 设备','谁贵保谁'],a:1,e:'先保人（撤离/断电），再保数据，最后设备——应急第一性原则。'},
  {q:'"极致"级机房管理者的核心能力是什么？',o:['背下全部设备参数','面对任何新系统都能快速判断它会在哪里坏、该怎么办','修得最快','认识最多厂商'],a:1,e:'判断力来自大量真实事故 + 深度复盘 + 系统思考——这比记忆值钱。'},
  {q:'"成本意识"心法的正确理解是？',o:['尽量不花钱','花得值——但安全冗余是底线不能省','越便宜越好','把预算花完'],a:1,e:'省的是"浪费"，保的是"底线"——PUE、生命周期、维保策略都要算清楚。'},
  {q:'学习这套体系最重要的铁律是？',o:['全部背下来','不动手 = 没学，每篇都要练一遍','收藏即掌握','只看理论部分'],a:1,e:'机房管理是"手上的知识"：算一遍、做一遍、讲一遍，才算真的会。'}
]},
room_01: {t:'机房·01 阶梯与自测', q:[
  {q:'能力定级的原则是？',o:['有多少证书','"独立"负责能力——有人带着能做的不算','工龄长短','面试表现'],a:1,e:'级别 = 你能独立对什么规模的系统负责。'},
  {q:'L3（高级运维）的标志性能力是？',o:['会换硬盘','能设计系统：搭 PXE/监控/备份体系，管容量、带值班','会背手册','能加班'],a:1,e:'从执行者变成设计者，是 L2→L3 的门槛。'},
  {q:'自测中 A、B、C 三组全部通过，大致对应哪一级？',o:['L1','L2','L3','L5'],a:2,e:'A=L1 门槛、B=L2、C=L3；D 组全过则接近 L4。'},
  {q:'某级"基本达标"的判定线是？',o:['能力清单完成 50%','能力清单 80% 以上做到且能独立完成','会一项就行','感觉良好'],a:1,e:'80% 达标后，剩下 20% 就是下一阶段的练习目标。'}
]},
room_02: {t:'机房·02 基础设施修炼', q:[
  {q:'机房负载 27kW、功率因数 0.9，UPS 容量至少约选？',o:['27kVA','30kVA 起（再留余量就近选 40kVA 档）','60kVA','10kVA'],a:1,e:'27÷0.9=30kVA 是下限；实际再乘余量、就近选大。'},
  {q:'PUE 的计算方式是？',o:['IT 能耗 ÷ 总能耗','总能耗 ÷ IT 设备能耗','电费 ÷ 服务器台数','冷量 ÷ 电量'],a:1,e:'PUE 越接近 1 越高效；传统机房 1.8-2.5，优秀 1.2-1.4。'},
  {q:'把冷通道温度从 20°C 提到 24°C（仍在合规范围），主要收益是？',o:['越冷越好','显著节能——减少过度制冷是降 PUE 的常用第一招','没有区别','会损坏设备'],a:1,e:'18-27°C 均合规；合适范围内"不过冷"，一年电费差很实在。'},
  {q:'气体灭火警报响起（尚未喷放）时应该？',o:['先关完设备再撤','立即撤离——喷放会置换氧气，人在里面会窒息','屏住呼吸继续操作','躲到机柜后面'],a:1,e:'人永远第一；设备等你在安全的地方再想办法。'}
]},
room_03: {t:'机房·03 服务器与存储修炼', q:[
  {q:'RAID 5 的一次随机写会带来多少次实际磁盘 IO？',o:['1 次','2 次','4 次（读旧数据+读旧校验+写新+写新校验）','6 次'],a:2,e:'这就是数据库更爱 RAID10 的数学原因；RAID6 为 6 次。'},
  {q:'为什么大容量盘（8TB 级）慎用 RAID 5？',o:['太贵','重建时要全盘读取，URE 概率可到约 15-20%——重建中再翻车就全灭','速度慢','费电'],a:1,e:'结论：大容量盘用 RAID6（双校验）或 RAID10。'},
  {q:'某盘 SMART 显示 C5（待处理扇区）非零，系统仍正常，正确动作是？',o:['等它坏了再说','立即确认备份完好 + 安排更换——不等它坏','反复重启试试','低格修复'],a:1,e:'SMART 告警是"未病"：预防性更换才是专业操作。'},
  {q:'服务器带外管理网口的安全要求是？',o:['和业务网共用即可','独立 VLAN、只允许管理终端访问、永不暴露公网','方便就好','不设密码更快'],a:1,e:'带外口被攻破 = 攻击者能"物理接触"服务器，是最坏情况。'}
]},
room_04: {t:'机房·04 部署与自动化修炼', q:[
  {q:'UEFI 环境下 PXE 引导文件应指向？',o:['pxelinux.0','grubx64.efi 等 .efi 文件','boot.img','无需引导文件'],a:1,e:'PXE 引导分 Legacy BIOS（pxelinux.0）和 UEFI（.efi）两条链，新采购设备基本都是 UEFI。'},
  {q:'应答文件（Kickstart）里 root 密码为什么要写哈希？',o:['好看','明文会出现在日志/进程列表里，明文即泄露','省空间','系统要求'],a:1,e:'配置即代码、密码即密钥——永远不让明文离开你的密码管理器。'},
  {q:'克隆出 30 台"一模一样"的机器后，上电前必须处理什么？',o:['什么都不用','主机名/IP/机器 ID/SSH 密钥等身份信息','重装系统','换硬盘'],a:1,e:'否则网络冲突（IP 重复）与管理混乱（全叫同一个名字）。'},
  {q:'VDI 云桌面的"启动风暴"（全班同时开机）常用解法是？',o:['多买服务器','链接克隆分摊存储 IO + 开机限流/错峰 + 缓存预热','禁用开机','换成 PC'],a:1,e:'启动风暴是 VDI 的经典工程问题——用"分摊+限流+预热"三招化解。'}
]},
room_05: {t:'机房·05 运维与监控修炼', q:[
  {q:'监控五层模型中，机房管理者直接负责的是哪几层？',o:['第 5 层业务','第 1-3 层（设施/硬件/系统），并理解 4-5 层的关联','只有第 4 层','全部五层都要亲自做'],a:1,e:'打好 1-3 层地基，同时能向"业务影响"方向思考——这是 L3+ 的思维。'},
  {q:'RPO 的含义是？',o:['系统可用率','最多容忍丢失多少数据（决定备份频率）','恢复要多久','每秒请求数'],a:1,e:'RPO 管"丢多少"，RTO 管"停多久"——灾难恢复方案的两个靶心。'},
  {q:'"没恢复过的备份，不算备份"——这句的意思是？',o:['备份不重要','备份的价值只有在恢复那一刻才被验证，必须定期演练','不用备份','备份越多越好'],a:1,e:'每月/每季抽一个对象实际恢复一次，才敢说"我们有备份"。'},
  {q:'容量管理的四维水位是？',o:['电/水/风/火','电力、空间、网络、算力','CPU/内存/磁盘/网络','人/财/物/时'],a:1,e:'四维都画趋势线，70% 警戒、80% 触发扩容规划。'}
]},
room_06: {t:'机房·06 安全与合规修炼', q:[
  {q:'物理安全五层模型中，最内层（第 5 层）是？',o:['园区周界','机房门口','设备层（带外网隔离/BIOS 密码/机箱锁）','机柜层'],a:2,e:'最内层保护的是"设备本身"——假设前四层都已被突破时的最后防线。'},

let QZ=null;
function startQuiz(id){
  let qs, title;
  if(id==='__all__'){
    const all=[];
    const ks=Object.keys(QUIZ_BANK);
    for(let x=0;x<ks.length;x++){
      const arr=QUIZ_BANK[ks[x]].q;
      for(let y=0;y<arr.length;y++){ all.push(Object.assign({},arr[y],{__quiz:'__all__'})); }
    }
    for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=all[i]; all[i]=all[j]; all[j]=t; }
    qs=all.slice(0,20);
    title='综合大考（'+qs.length+' 题）';
  } else {
    const b=QUIZ_BANK[id]; if(!b) return;
    qs=b.q.map(function(q){ return Object.assign({},q,{__quiz:id}); });
    title=''+b.t;
  }
  QZ={id:id,title:title,qs:qs,i:0,correct:0,answers:[],answered:false};
  const v=document.getElementById('quizView'); if(v) v.classList.add('on');
  renderQuizQ();
}
function renderQuizQ(){
  if(!QZ) return;
  if(QZ.i>=QZ.qs.length){ renderQuizResult(); return; }
  const q=QZ.qs[QZ.i];
  document.getElementById('quizTitle').textContent=QZ.title;
  document.getElementById('quizProgress').textContent=(QZ.i+1)+' / '+QZ.qs.length;
  let h='<div class="qz-item"><h4>Q'+(QZ.i+1)+'. '+q.q+'</h4>';
  for(let x=0;x<q.o.length;x++){
    h+='<button class="qz-opt" id="qo'+x+'" data-qi="'+x+'">'+String.fromCharCode(65+x)+'. '+q.o[x]+'</button>';
  }
  h+='<div class="qz-exp" id="qzExp">'+q.e+'</div>';
  h+='<button class="qz-btn" id="qzNext" style="display:none" data-qnext="1">'+(QZ.i===QZ.qs.length-1?'查看结果 →':'下一题 →')+'</button>';
  h+='</div>';
  document.getElementById('quizBody').innerHTML=h;
  QZ.answered=false;
}
function answerQuiz(idx){
  if(!QZ || QZ.answered) return;
  QZ.answered=true;
  const q=QZ.qs[QZ.i];
  const ok=idx===q.a;
  if(ok) QZ.correct++;
  QZ.answers.push({idx:idx,ok:ok});
  for(let i=0;i<q.o.length;i++){
    const el=document.getElementById('qo'+i); if(!el) continue;
    if(i===q.a) el.classList.add('right');
    else if(i===idx && !ok) el.classList.add('wrong');
  }
  document.getElementById('qzExp').style.display='block';
  document.getElementById('qzNext').style.display='inline-block';
  if(ok && navigator.vibrate){ try{navigator.vibrate(15);}catch(e){} }
}

let SIM=null;
function fmtT(sec){ const m=Math.floor(sec/60), s2=sec%60; return (m<10?'0':'')+m+':'+(s2<10?'0':'')+s2; }
function startSim(id){
  let s=null;
  for(let i=0;i<SIMS.length;i++){ if(SIMS[i].id===id) s=SIMS[i]; }
  if(!s) return;
  SIM={id:id,t:s.t,dur:s.dur,tasks:s.tasks,done:{},left:s.dur*60,timer:null};
  document.getElementById('labTitle').textContent=''+s.t;
  renderSimRun();
  if(SIM.timer) clearInterval(SIM.timer);
  SIM.timer=setInterval(function(){
    if(!SIM) return;
    SIM.left--;
    const el=document.getElementById('simClock');
    if(el) el.textContent=fmtT(Math.max(0,SIM.left));
    if(SIM.left<=0){ clearInterval(SIM.timer); SIM.timer=null; finishSim(true); }
  },1000);
  if(navigator.vibrate){ try{navigator.vibrate(20);}catch(e){} }
}

function pkgInstall(vm, name){
  if(vm.pkgs[name]) return {already:true};
  if(!CATALOG[name]) return {notfound:true};
  vm.pkgs[name]={v:CATALOG[name].v};
  if(CATALOG[name].svc){ var s=vm.svc(CATALOG[name].svc,true); s.installed=true; }
  if(INSTALL_FX[name]) INSTALL_FX[name](vm);
  vm.log('apt','Installed package '+name);
  return {ok:true};
}
function pkgRemove(vm, name, purge){
  if(!vm.pkgs[name]) return {notfound:true};
  delete vm.pkgs[name];
  var meta=CATALOG[name];
  if(meta && meta.svc && vm.svcs[meta.svc]){ vm.svcs[meta.svc].installed=false; vm.svcs[meta.svc].running=false; }
  if(purge && INSTALL_FX_SRC[name]){ /* 简化：不清文件，留个提示 */ }
  vm.log('apt','Removed package '+name);
  return {ok:true};
}
var INSTALL_FX_SRC = INSTALL_FX;

/* =====================================================================
   二、配置解析器：nginx / dnsmasq / haproxy / sshd
   ===================================================================== */
var NGX_SERVER_DIRECTIVES = ['listen','server_name','root','index','location','return','rewrite',
  'ssl_certificate','ssl_certificate_key','error_page','access_log','error_log','add_header',
  'try_files','include','client_max_body_size','autoindex','alias','proxy_pass','ssl_protocols'];
var NGX_LOCATION_DIRECTIVES = ['root','index','try_files','alias','proxy_pass','return','rewrite',
  'add_header','autoindex','error_page','include','client_max_body_size','proxy_set_header',
  'proxy_http_version','error_log','access_log','fastcgi_pass','ssl_certificate'];

function ngxExpandIncludes(vm, text, depth){
  if(depth>2) return text;
  var lines=text.split('\n'), out=[];
  for(var i=0;i<lines.length;i++){
    var m=lines[i].match(/^\s*include\s+([^;]+);/);
    if(!m){ out.push(lines[i]); continue; }
    var spec=m[1].trim().replace(/^["']|["']$/g,'');
    var files=[];
    if(spec.indexOf('*')>=0){
      var dir=parentOf('/'+spec.replace(/^\//,'')), suf=baseOf(spec).replace('*','');
      if(vm.isDir(dir)){
        var kids=vm.children(dir);
        for(var k=0;k<kids.length;k++){ if(kids[k].slice(-suf.length)===suf || !suf) files.push(dir+'/'+kids[k]); }
      }
    } else if(vm.exists(spec)) files=[spec];
    if(files.length){
      for(var f=0;f<files.length;f++){
        var c=vm.read(files[f]);
        if(c!==null) out.push(ngxExpandIncludes(vm, c, depth+1));
      }
    }
  }
  return out.join('\n');
}
function parseNginx(vm, text){
  var res={ok:true, err:null, servers:[]};
  text = ngxExpandIncludes(vm, text, 0);
  var lines=text.split('\n'), i=0, lineNo=0;
  function unknownDirective(tok, lno, scope){
    res.ok=false; res.err='nginx: [emerg] unknown directive "'+tok+'" in /etc/nginx/nginx.conf:'+lno;
  }
  function notTerminated(tok, lno){
    res.ok=false; res.err='nginx: [emerg] directive "'+tok+'" is not terminated by ";" in /etc/nginx/nginx.conf:'+lno;
  }
  /* 提取所有 server{} 块 */
  var serverBlocks=[]; /* {text, startLine} */
  var depth=0, cur=null, curDepth=0;
  for(i=0;i<lines.length;i++){
    var raw=lines[i], t=raw.trim(), lno=i+1;
    var noComment = raw.replace(/#.*$/,'');
    var opens=(noComment.match(/\{/g)||[]).length, closes=(noComment.match(/\}/g)||[]).length;
    if(cur){ cur.lines.push(noComment); curDepth+=opens-closes; if(curDepth<=0){ serverBlocks.push(cur); cur=null; } continue; }
    if(/^\s*server\s*\{\s*$/.test(noComment) || /^\s*server\s*\{/.test(noComment)){
      cur={lines:[noComment], startLine:lno}; curDepth=opens-closes;
      if(curDepth<=0) { serverBlocks.push(cur); cur=null; }
      continue;
    }
  }
  /* 校验 server 块内指令 */
  if(res.ok){
    for(var b=0;b<serverBlocks.length;b++){
      var blk=serverBlocks[b], d=0, ln=blk.startLine;
      for(var j=0;j<blk.lines.length;j++){
        var line=blk.lines[j].trim(); ln++;
        if(!line || line[0]==='#') continue;
        var before=d;
        var op=(line.match(/\{/g)||[]).length, cl=(line.match(/\}/g)||[]).length;
        if(before<=2 && line!=='}'){
          var mm=line.match(/^([a-zA-Z_][a-zA-Z0-9_]*)/);
          if(mm){
            var tok=mm[1];
            var known = before<=1 ? (NGX_SERVER_DIRECTIVES.indexOf(tok)>=0) : (NGX_LOCATION_DIRECTIVES.indexOf(tok)>=0);
            var isLoc = /^location\b/.test(line);
            if(!known && !isLoc && tok!=='server'){ unknownDirective(tok, ln); break; }
            if(!/[{;]\s*$/.test(line) && tok!=='location' && tok!=='server'){ notTerminated(tok, ln); break; }
          }
        }
        d += op - cl;
      }
      if(!res.ok) break;
    }
  }
  if(!res.ok) return res;
  /* 解析 server 块 */
  for(var s=0;s<serverBlocks.length;s++){
    var bt=serverBlocks[s].lines.join('\n');
    var sv={listens:[], names:[], root:null, index:['index.html'], sslcert:null, sslkey:null, ret:null, locations:[]};
    var m;
    var lre=/(?:^|\n)\s*listen\s+([^;]+);/g;
    while((m=lre.exec(bt))){
      var spec=m[1].trim(), toks=spec.split(/\s+/), port=null, ssl=false, def=false;
      for(var x=0;x<toks.length;x++){
        var tk=toks[x];
        if(tk==='ssl') { ssl=true; continue; }
        if(tk==='default_server'||tk==='default') { def=true; continue; }
        var pm=tk.match(/(?:^|:)(\d+)$/); if(pm) port=parseInt(pm[1],10);
      }
      if(port===null) port=80;
      sv.listens.push({port:port, ssl:ssl, def:def});
    }
    m=bt.match(/server_name\s+([^;]+);/); if(m) sv.names=m[1].trim().split(/\s+/);
    m=bt.match(/(?:^|\n)\s*root\s+([^;]+);/); if(m) sv.root=m[1].trim();
    m=bt.match(/index\s+([^;]+);/); if(m) sv.index=m[1].trim().split(/\s+/);
    m=bt.match(/ssl_certificate\s+([^;]+);/); if(m) sv.sslcert=m[1].trim();
    m=bt.match(/ssl_certificate_key\s+([^;]+);/); if(m) sv.sslkey=m[1].trim();
    m=bt.match(/(?:^|\n)\s*return\s+(\d{3})\s*([^;]*);/); if(m) sv.ret={code:parseInt(m[1],10), url:(m[2]||'').trim()};
    /* locations */
    var lbody=serverBlocks[s].lines.join('\n');
    var li=0;
    while(true){
      var lm=lbody.slice(li).match(/location\s+([^{]*?)\s*\{/);
      if(!lm) break;
      var start=li+lbody.slice(li).indexOf(lm[0])+lm[0].length-1;
      var dd=0, k=start;
      for(;k<lbody.length;k++){ if(lbody[k]==='{')dd++; else if(lbody[k]==='}'){dd--; if(dd===0) break;} }
      var block=lbody.slice(start+1,k);
      var loc={spec:lm[1].trim(), body:block, ret:null, proxy:null, root:null, try_files:null, exact:false, regex:null};
      if(loc.spec[0]==='='){ loc.exact=true; loc.spec=loc.spec.slice(1).trim(); }
      else if(loc.spec.indexOf('~')===0){ loc.regex=loc.spec.replace(/^~\*?/,'').trim(); }
      else if(loc.spec.indexOf('^~')===0){ loc.spec=loc.spec.slice(2).trim(); }
      var rm=block.match(/return\s+(\d{3})\s*([^;]*);/); if(rm) loc.ret={code:parseInt(rm[1],10), url:(rm[2]||'').trim()};
      var pm2=block.match(/proxy_pass\s+([^;]+);/); if(pm2) loc.proxy=pm2[1].trim();
      var rt2=block.match(/(?:^|\n)\s*root\s+([^;]+);/); if(rt2) loc.root=rt2[1].trim();
      var tf=block.match(/try_files\s+([^;]+);/); if(tf) loc.try_files=tf[1].trim().split(/\s+/);
      sv.locations.push(loc);
      li=k+1;
    }
    res.servers.push(sv);
  }
  return res;
}

var DNSMASQ_KEYS=['address','host-record','addn-hosts','local','server','domain','domain-needed','bogus-priv',
 'dhcp-range','dhcp-host','dhcp-boot','dhcp-option','dhcp-option-force','enable-tftp','tftp-root','tftp-secure',
 'ptr-record','resolv-file','no-resolv','no-hosts','log-queries','log-dhcp','port','interface','listen-address',
 'bind-interfaces','expand-hosts','cache-size','conf-dir','conf-file','except-interface','no-dhcp-interface',
 'dhcp-authoritative','dhcp-leasefile','dns-forward-max','min-cache-ttl','max-cache-ttl','strict-order','no-poll',
 'all-servers','filterwin2k','stop-dns-rebind','rebind-localhost-ok','domain-needed','synth-domain'];
function parseDnsmasq(vm, text){
  var res={ok:true, err:null, A:{}, PTR:{}, dhcp:{range:null, boot:null, options:[], authoritative:false}, tftp:{enabled:false, root:null}, localZones:[]};
  var lines=text.split('\n');
  for(var i=0;i<lines.length;i++){
    var t=lines[i].replace(/#.*$/,'').trim(); if(!t) continue;
    var eq=t.indexOf('='), key=(eq<0?t:t.slice(0,eq)).trim(), val=(eq<0?'':t.slice(eq+1)).trim();
    if(DNSMASQ_KEYS.indexOf(key)<0){ res.ok=false; res.err='dnsmasq: bad option at line '+(i+1)+'.'; return res; }
    if(key==='address'){
      var parts=val.split('/').filter(function(x){ return x!==''; });
      if(parts.length>=2){ var ip=parts[parts.length-1];
        for(var a=0;a<parts.length-1;a++) res.A[parts[a].replace(/^\.*/,'')]=ip;
      }
    } else if(key==='host-record'){
      var pr=val.split(',');
      for(var h=0;h+1<pr.length;h+=2){ res.A[pr[h].trim()]=pr[h+1].trim(); res.PTR[pr[h+1].trim()]=pr[h].trim(); }
    } else if(key==='addn-hosts'){
      var hc=vm.read(val); if(hc!==null){
        var hl=hc.split('\n');
        for(var q=0;q<hl.length;q++){ var x=hl[q].replace(/#.*$/,'').trim(); if(!x) continue;
          var tk=x.split(/\s+/), ip2=tk[0]; for(var n=1;n<tk.length;n++){ res.A[tk[n]]=ip2; if(!res.PTR[ip2]) res.PTR[ip2]=tk[n]; }
        }
      }
    } else if(key==='ptr-record'){ var pp=val.split(','); if(pp.length>=2) res.PTR[pp[0].replace(/^\.*/,'')]=pp[1]; }
    else if(key==='dhcp-range'){ res.dhcp.range=val; }
    else if(key==='dhcp-boot'){ res.dhcp.boot=val; }
    else if(key==='dhcp-option'){ res.dhcp.options.push(val); }
    else if(key==='enable-tftp'){ res.tftp.enabled=true; }
    else if(key==='tftp-root'){ res.tftp.root=val; }
    else if(key==='local'){ var lz=val.split('/').filter(function(x){return x!=='';}); for(var z=0;z<lz.length;z++) res.localZones.push(lz[z]); }
    else if(key==='dhcp-authoritative'){ res.dhcp.authoritative=true; }
  }
  return res;
}

var HAPROXY_KEYS=['global','defaults','frontend','backend','listen','bind','default_backend','mode','balance',
 'server','option','timeout','stats','acl','use_backend','http-request','http-response','redirect','monitor-uri',
 'retries','maxconn','description','default-server','log','daemon','chroot','user','group','pidfile','nbproc','ulimit-n','tune.ssl.default-dh-param','errorfile','errorloc','capture','compression'];
function parseHaproxy(vm, text){
  var res={ok:true, err:null, frontends:[], backends:{}, global:[], defaults:[]};
  var lines=text.split('\n'), section=null, cur=null;
  for(var i=0;i<lines.length;i++){
    var raw=lines[i].replace(/#.*$/,'').replace(/\s+$/,''); var t=raw.trim();
    if(!t) continue;
    var m=t.match(/^(global|defaults|frontend\s+(\S+)|backend\s+(\S+)|listen\s+(\S+))\s*$/);
    if(m){ var kw=m[1].split(/\s+/)[0];
      if(kw==='global'){ section='global'; cur=res.global; }
      else if(kw==='defaults'){ section='defaults'; cur=res.defaults; }
      else if(kw==='frontend'){ section='frontend'; cur={name:m[2], bind:null, defaultBackend:null, binds:[]}; res.frontends.push(cur); }
      else if(kw==='backend'){ section='backend'; cur={name:m[3], balance:null, servers:[]}; res.backends[m[3]]=cur; }
      else if(kw==='listen'){ section='listen'; cur={name:m[4], bind:null, binds:[], servers:[]}; res.frontends.push(cur); res.backends[m[4]]=cur; }
      continue;
    }
    var tok=t.split(/\s+/)[0].toLowerCase();
    if(HAPROXY_KEYS.indexOf(tok)<0){ res.ok=false; res.err='[ALERT] ('+i+') : config parsing error at line '+(i+1)+' : unknown keyword "'+tok+'"'; return res; }
    if(section==='frontend'||section==='listen'){
      if(/^bind\s/.test(t)){ var bs=t.split(/\s+/)[1]||''; var bm=bs.match(/(?:^|:)(\d+)$/); if(bm){ cur.bind=parseInt(bm[1],10); cur.binds.push(parseInt(bm[1],10)); } }
      if(/^default_backend\s/.test(t)) cur.defaultBackend=t.split(/\s+/)[1];
    }
    if(section==='backend'||section==='listen'){
      if(/^balance\s/.test(t)) cur.balance=t.split(/\s+/)[1];
      if(/^server\s/.test(t)){ var st=t.split(/\s+/), name=st[1], addr=st[2]||'', port=null;
        var am=addr.match(/(\d+)$/); if(am) port=parseInt(am[1],10);
        var check=false; for(var x=3;x<st.length;x++) if(st[x]==='check') check=true;
        cur.servers.push({name:name, addr:addr, port:port, check:check});
      }
    }
  }
  return res;
}

function sshdPort(vm){
  var c=vm.read('/etc/ssh/sshd_config')||'';
  var m=c.match(/^\s*Port\s+(\d+)/m);
  return m?parseInt(m[1],10):22;
}

   三、服务控制（systemd 模拟）
   ===================================================================== */
function svcParseConf(vm, name){
  /* 返回 {ok, err, rt} —— 当前配置文件解析结果 */
  var info=SVCINFO[name]; if(!info||!info.conf) return {ok:true, rt:null};
  var text=vm.read(info.conf);
  if(text===null) return {ok:false, err:'open() "'+info.conf+'" failed (2: No such file or directory)'};
  if(name==='nginx')  { var r=parseNginx(vm, text);   return r.ok?{ok:true, rt:r, text:text}:{ok:false, err:r.err}; }
  if(name==='dnsmasq'){ var d=parseDnsmasq(vm,text);  return d.ok?{ok:true, rt:d, text:text}:{ok:false, err:d.err}; }
  if(name==='haproxy'){ var h=parseHaproxy(vm,text);  return h.ok?{ok:true, rt:h, text:text}:{ok:false, err:h.err}; }
  return {ok:true, rt:null, text:text};
}
function svcStart(vm, name, quiet){
  var s=vm.svc(name, true);
  var out=[];
  if(!s.installed) return {ok:false, code:5, lines:[C('Failed to start '+name+'.service: Unit '+name+'.service not found.','err')]};
  if(s.running) return {ok:true, code:0, lines:[C('（'+name+' 已在运行中）','dim')]};
  var pre=svcParseConf(vm, name);
  if(!pre.ok){
    s.running=false; s.failed=true;
    vm.log(name, 'Failed to start: '+pre.err);
    out.push(C('Job for '+name+'.service failed because the control process exited with error code.','err'));
    out.push(C('See "systemctl status '+name+'.service" and "journalctl -xeu '+name+'.service" for details.','dim'));
    if(pre.err) out.push(C(''+pre.err,'err'));
    if(name==='nginx') out.push(C('提示：用 nginx -t 可以看到配置错误详情','hint'));
    return {ok:false, code:1, lines:out};
  }
  s.running=true; s.failed=false; s.snap=pre.text; s.rt=pre.rt||null;
  if(name==='dnsmasq') s.rt2=pre.rt;
  vm.log(name, 'Started '+name+'.service');
  return {ok:true, code:0, lines:[C('Started '+name+'.service.','ok')]};
}
function svcStop(vm, name){
  var s=vm.svcs[name];
  if(!s||!s.running) return {ok:true, code:0, lines:[C('（'+name+' 本来就没在运行）','dim')]};
  s.running=false;
  vm.log(name, 'Stopped '+name+'.service');
  return {ok:true, code:0, lines:[C('Stopped '+name+'.service.','ok')]};
}
function svcRestart(vm, name, reload){
  var s=vm.svc(name,true);
  if(reload && s.running){
    var pre=svcParseConf(vm, name);
    if(!pre.ok){ return {ok:false, code:1, lines:[C('nginx: [emerg] reload failed: '+pre.err,'err')]}; }
    s.snap=pre.text; s.rt=pre.rt||null;
    vm.log(name,'Reloaded configuration');
    return {ok:true, code:0, lines:[C('Reloaded '+name+'.service.','ok')]};
  }
  if(s.running){ s.running=false; vm.log(name,'Stopped'); }
  var r=svcStart(vm, name);
  return r;
}
function svcStale(vm, name){
  var info=SVCINFO[name]; if(!info||!info.conf) return false;
  var s=vm.svcs[name]; if(!s||!s.running||s.snap===null||s.snap===undefined) return false;
  var cur=vm.read(info.conf);
  return cur!==null && cur!==s.snap;
}
function svcStatusText(vm, name){
  var s=vm.svcs[name], info=SVCINFO[name]||{desc:name};
  var l=[];
  var act = s&&s.running ? 'active (running)' : (s&&s.failed?'failed':'inactive (dead)');

function dnsLookup(vm, name, type){

function sqlTableBox(cols, rows){
  var w=cols.map(function(c){ return c.length; });
  for(var i=0;i<rows.length;i++) for(var j=0;j<cols.length;j++){ var v=rows[i][j]===null?'NULL':String(rows[i][j]); w[j]=Math.max(w[j],v.length); }
  var sep='+'+w.map(function(x){ return Array(x+3).join('-'); }).join('+')+'+';
  var out=[sep];
  out.push('|'+cols.map(function(c,j){ return ' '+c+Array(w[j]-c.length+2).join(' '); }).join('|')+'|');
  out.push(sep);
  for(var r=0;r<rows.length;r++){
    out.push('|'+cols.map(function(c,j){ var v=rows[r][j]===null?'NULL':String(rows[r][j]); return ' '+v+Array(w[j]-v.length+2).join(' '); }).join('|')+'|');
  }
  out.push(sep);
  return out;
}
function sqlSplit(text){
  var out=[], cur='', q=null;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){ cur+=ch; if(ch===q) q=null; continue; }
    if(ch==="'"||ch==='"'){ q=ch; cur+=ch; continue; }
    if(ch===';'){ if(cur.trim()) out.push(cur.trim()); cur=''; continue; }
    cur+=ch;
  }
  if(cur.trim()) out.push(cur.trim());
  return out;
}

var ANSIBLE_MODULES=['apt','package','yum','service','systemd','copy','file','lineinfile','command','shell','debug','user','group','cron'];
function ansibleParse(text){
  /* 支持子集：
     - hosts: all
       tasks:
         - name: Install nginx
           apt: name=nginx state=present        # 内联 k=v
         - name: Start service
           service:
             name: nginx                        # 嵌套 k: v
             state: started
  */
  var raw=text.split('\n').map(function(l){ return l.replace(/#.*$/,'').replace(/\s+$/,''); });
  var plays=[], play=null, task=null, tasksIndent=-1, taskItemIndent=-1, moduleIndent=-1;
  function flushTask(){ if(task&&play){ play.tasks.push(task); } task=null; moduleIndent=-1; }
  function parseTaskRest(rest){
    task={name:null, module:null, rawArg:null, args:{}};
    var m=rest.match(/^(\w+)\s*:\s*(.*)$/);
    if(m){
      if(m[1]==='name'){ task.name=m[2].trim()||null; }
      else if(ANSIBLE_MODULES.indexOf(m[1])>=0){ task.module=m[1]; task.rawArg=m[2].trim()||null; }
      else if(m[1]==='debug'){ task.module='debug'; task.rawArg=m[2].trim()||null; }
    } else if(rest){ task.module='command'; task.rawArg=rest; }
  }
  for(var li=0;li<raw.length;li++){
    var line=raw[li]; if(!line.trim()) continue;
    var indent=line.match(/^\s*/)[0].length, t=line.replace(/^\s+/,'');
    var itemM=t.match(/^-\s+(.*)$/);
    if(itemM){
      var rest=itemM[1];
      if(/^hosts\s*:/.test(rest)){
        flushTask(); play={hosts:(rest.split(':')[1]||'all').trim(), tasks:[]}; plays.push(play);
        tasksIndent=-1; taskItemIndent=-1; continue;
      }
      if(play && tasksIndent>=0 && indent>tasksIndent){ flushTask(); parseTaskRest(rest); taskItemIndent=indent; continue; }
      continue;
    }
    if(/^tasks\s*:\s*$/.test(t)){ tasksIndent=indent; continue; }
    if(!play) continue;
    if(!task){
      /* 任务之外 play 级 key —— 忽略 */
      continue;
    }
    var mm=t.match(/^([\w.]+)\s*:\s*(.*)$/); if(!mm) continue;
    var key=mm[1].replace(/\./g,'_'), val=mm[2].trim();
    if(ANSIBLE_MODULES.indexOf(key)>=0){
      task.module=key; task.rawArg=val||null; moduleIndent=indent; continue;
    }
    if(['become','when','register','vars','ignore_errors','changed_when','delegate_to','tags','notify','loop'].indexOf(key)>=0) continue;
    if(key==='name'&&(!task.name||task.name===null)){ task.name=val; continue; }
    task.args[key]=val;
  }
  flushTask();
  return plays;
}

function ansibleRun(vm, text){

function ansibleModule(vm, task){

  if(mod==='apt'||mod==='package'||mod==='yum'){

    if(!names.length) return {failed:true, msg:"missing required arguments: name"};
    var changed=false, notfound=[];

        if(vm.pkgs[n]){ pkgRemove(vm,n,false); changed=true; }
      } else {
        if(vm.pkgs[n]){ if(a.state==='latest'){ /* 视为最新 */ } }

    return {changed:ch};

    if(state==='directory'){ if(!vm.isDir(path)){ vm.mkdirP(path); if(a.mode) vm.chmod(path,parseInt(a.mode,8)); return {changed:true}; } return {changed:false}; }

  }

    if(a.line && c2.split('\n').indexOf(a.line)<0){
      vm.write(p2, (c2.replace(/\n$/,'')+'\n'+a.line+'\n').replace(/^\n/,''));
      return {changed:true};
    }
    return {changed:false};
  }
  if(mod==='command'||mod==='shell'){
    var cmd=task.rawArg||a._||a.cmd||'';
    cmd=String(cmd).replace(/^["']|["']$/g,'');
    if(!cmd) return {failed:true, msg:'missing required arguments: _raw_params'};
    var r2=execLine(vm, cmd);
    if(r2.code!==0) return {failed:true, msg:'non-zero return code ('+r2.code+')'};

  }
  if(mod==='user'){
    if(!a.name) return {failed:true, msg:'missing required arguments: name'};
    if((a.state||'present')==='absent'){ if(vm.users[a.name]){ delete vm.users[a.name]; vm.syncPasswd(); return {changed:true}; } return {changed:false}; }
    if(vm.users[a.name]) return {changed:false};
    var r3=vm.addUser(a.name,{mkhome:a.create_home!=='no',groups:a.groups?a.groups.split(','):null});
    return {changed:r3.ok};
  }
  if(mod==='group'){ if(!a.name) return {failed:true, msg:'missing required arguments: name'}; var r4=vm.addGroup(a.name); return {changed:r4.ok}; }
  if(mod==='debug'){ return {changed:false, note:String(a.msg||a.var||'')}; }
  if(mod==='cron'){ return {changed:false}; }

}
function kvArgs(s){
  var out={}, toks=String(s).split(/\s+/), cur2='', q=null;
  toks=[];

    if(q){ if(ch===q) q=null; else cur2+=ch; continue; }
    if(ch==="'"||ch==='"'){ q=ch; continue; }
    if(ch===' '||ch==='\t'){ if(cur2){toks.push(cur2);cur2='';} continue; }
    cur2+=ch;
  }
  if(cur2) toks.push(cur2);
  for(var t=0;t<toks.length;t++){ var eq=toks[t].indexOf('='); if(eq>0) out[toks[t].slice(0,eq)]=toks[t].slice(eq+1); }

}

function ldapParse(text){
  var entries=[], cur=null;

  for(var i=0;i<lines.length;i++){
    var t=lines[i].replace(/\s+$/,'');
    if(!t.trim()){ if(cur){ entries.push(cur); cur=null; } continue; }
    if(t.trim().indexOf('#')===0) continue;
    if(t.indexOf(':')<0) continue;
    var k=t.slice(0,t.indexOf(':')).trim().toLowerCase(), v=t.slice(t.indexOf(':')+1).trim();

    if(k==='dn'){ cur.dn=v; }
    if(!cur.attrs[k]) cur.attrs[k]=[];
    cur.attrs[k].push(v);
  }
  if(cur) entries.push(cur);

function ldapSearch(vm, base, filter){

function ldapMatch(e, filter){

function tokenize(s){
  var out=[], cur='', q=null, i=0;
  while(i<s.length){
    var ch=s[i];
    if(q){ if(ch===q){ q=null; } else if(ch==='\\' && q==='"' && i+1<s.length){ cur+=s[++i]; } else cur+=ch; i++; continue; }
    if(ch==="'"||ch==='"'){ q=ch; i++; continue; }
    if(ch===' '||ch==='\t'){ if(cur!==''){ out.push(cur); cur=''; } i++; continue; }
    if(ch==='\\' && i+1<s.length){ cur+=s[++i]; i++; continue; }
    cur+=ch; i++;

  if(cur!=='') out.push(cur);
  return out;
}
function splitChain(line){
  var out=[], cur='', q=null, i=0, op='start';

    var ch=line[i];

    if(ch==="'"||ch==='"'){ q=ch; cur+=ch; i++; continue; }
    if(ch===';'||ch==='&'&&line[i+1]==='&'||ch==='|'&&line[i+1]==='|'){
      var thisOp=ch;
      if(ch==='&'||ch==='|') i++;

      op=(thisOp==='&'?'&&':(thisOp==='|'?'||':';'));
      cur=''; i++; continue;

function splitPipe(cmd){

    var ch=cmd[i];

    if(ch==="'"||ch==='"'){ q=ch; cur+=ch; i++; continue; }
    if(ch==='|'){ out.push(cur.trim()); cur=''; i++; continue; }
    cur+=ch; i++;

}
function findRedirect(cmd){
  var q=null, i=0;

    var ch=cmd[i];

    if(ch==="'"||ch==='"'){ q=ch; i++; continue; }
    if(ch==='>'){

  return fmt.replace(/%Y/g,base.slice(0,4)).replace(/%m/g,base.slice(5,7)).replace(/%d/g,base.slice(8,10))

function expandEnv(vm, s, code){

  while(i<s.length){
    var ch=s[i];
    if(ch==='$'&&s[i+1]==='('){ out+='$('; i+=2; continue; }
    if(ch==='$'){
      var m=s.slice(i).match(/^\$\{(\w+)\}/)||s.slice(i).match(/^\$(\w+)/);
      if(m){ var name=m[1];
        if(name==='?'){ out+=String(code||0); i+=m[0].length; continue; }

        out+= vm.env[name]!==undefined?vm.env[name]:'';
        i+=m[0].length; continue;

    }

}

function aptDo(vm,args,label){
  var sub=args[0], pkgs=args.slice(1).filter(function(a){return a[0]!=='-';});
  var lines=[];
  if(sub==='update'){
    lines.push('Hit:1 http://archive.ubuntu.com/ubuntu noble InRelease');
    lines.push('Hit:2 http://archive.ubuntu.com/ubuntu noble-updates InRelease');
    lines.push('Reading package lists... Done');
    lines.push('Building dependency tree... Done');
    lines.push('All packages are up to date.');
    return {lines:lines, code:0};
  }
  if(sub==='install'){
    if(!pkgs.length) return {lines:[C('apt: 请指定包名，如: apt install nginx','hint')], code:1};
    lines.push('Reading package lists... Done');
    lines.push('Building dependency tree... Done');
    var toInstall=[], notfound=[];
    for(var i=0;i<pkgs.length;i++){
      if(vm.pkgs[pkgs[i]]) continue;
      if(!CATALOG[pkgs[i]]){ notfound.push(pkgs[i]); continue; }
      toInstall.push(pkgs[i]);
    }
    for(var n=0;n<notfound.length;n++) lines.push(C("E: Unable to locate package "+notfound[n],'err'));
    if(toInstall.length){
      lines.push('The following NEW packages will be installed:');
      lines.push('  '+toInstall.join(' '));
      lines.push('0 upgraded, '+toInstall.length+' newly installed, 0 to remove and 0 not upgraded.');
      lines.push('Need to get 0 B/'+(toInstall.length)+',024 kB of archives.');
      for(var t=0;t<toInstall.length;t++){
        var r=pkgInstall(vm,toInstall[t]);
        lines.push('Setting up '+toInstall[t]+' ('+CATALOG[toInstall[t]].v+') ...');
      }
      lines.push(C('安装完成（默认配置文件已生成，可直接开始配置）','ok'));
    } else if(!notfound.length){
      for(var q=0;q<pkgs.length;q++) lines.push(pkgs[q]+' is already the newest version ('+((vm.pkgs[pkgs[q]]||{}).v||'')+').');
      lines.push('0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.');
    }
    return {lines:lines, code:notfound.length?100:0};
  }
  if(sub==='remove'||sub==='purge'){
    for(var r2=0;r2<pkgs.length;r2++){
      if(!vm.pkgs[pkgs[r2]]){ lines.push(C('E: 未安装: '+pkgs[r2],'err')); continue; }
      pkgRemove(vm,pkgs[r2],sub==='purge');
      lines.push('Removing '+pkgs[r2]+' ...');
    }
    return {lines:lines, code:0};
  }
  if(sub==='list'){ return {lines:Object.keys(vm.pkgs).map(function(k){return k+'/'+((vm.pkgs[k]||{}).v||'base')+' now';}), code:0}; }
  if(sub==='autoremove'){ return {lines:['0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.'], code:0}; }
  return {lines:[C('apt: 未知子命令 '+sub+'（模拟器支持 update/install/remove/list）','err')], code:1};
}

function listenEntries(vm){
  var out=[]; /* {port, proc, pid, family} */
  var ss=vm.svcs;
  if(ss['sshd']&&ss['sshd'].running) out.push({port:sshdPort(vm), proc:'sshd', pid:812});
  if(ss['nginx']&&ss['nginx'].running&&ss['nginx'].rt){
    var seen={};
    for(var i=0;i<ss['nginx'].rt.servers.length;i++){ var ls=ss['nginx'].rt.servers[i].listens;
      for(var j=0;j<ls.length;j++){ if(!seen[ls[j].port]){ seen[ls[j].port]=1; out.push({port:ls[j].port, proc:'nginx', pid:901}); } } }
  }
  if(ss['dnsmasq']&&ss['dnsmasq'].running) out.push({port:53, proc:'dnsmasq', pid:844});
  if(ss['mariadb']&&ss['mariadb'].running) out.push({port:3306, proc:'mariadbd', pid:1002});
  if(ss['haproxy']&&ss['haproxy'].running&&ss['haproxy'].rt){
    for(var f=0;f<ss['haproxy'].rt.frontends.length;f++){ var b=ss['haproxy'].rt.frontends[f].bind; if(b) out.push({port:b, proc:'haproxy', pid:1100}); }
  }
  if(ss['pyhttp']&&ss['pyhttp'].running) out.push({port:ss['pyhttp'].port, proc:'python3', pid:1234});
  for(var k in vm.docker.containers){ var c=vm.docker.containers[k];
    if(!c.running) continue;
    for(var p=0;p<(c.ports||[]).length;p++) out.push({port:c.ports[p].h, proc:'docker-proxy', pid:1410});
  }
  return out;
}

function curlOut(vm, r, opts){
  /* 生成 curl 的展示输出 */
  var out=[];
  var statusLine='HTTP/1.1 '+r.status+' '+({200:'OK',301:'Moved Permanently',302:'Found',403:'Forbidden',404:'Not Found',500:'Internal Server Error',502:'Bad Gateway',503:'Service Unavailable',508:'Loop Detected'}[r.status]||'');
  if(opts.verbose){ out.push(C('> '+(opts.method||'GET')+' '+opts.path+' HTTP/1.1','dim')); out.push(C('> Host: '+opts.host,'dim')); }
  if(opts.includeHeaders||opts.headOnly){
    out.push(statusLine);
    var hs=r.headers||{};
    out.push('Server: '+hs['Server']);
    out.push('Date: '+new Date().toUTCString());
    for(var k in hs){ if(k==='Server'||k==='Content-Length') continue; out.push(k+': '+hs[k]); }
    out.push('Content-Length: '+hs['Content-Length']);
    out.push('Connection: keep-alive');
    out.push('');
  }
  if(!opts.headOnly){ var bl=(r.body||'').replace(/\n$/,'').split('\n'); if(bl.length===1&&bl[0]==='') bl=[]; out=out.concat(bl); }
  return out;
}
CMDS['curl']=function(vm,args){

function mysqlAuth(vm, args){
  var user='root', pw=null, pwGiven=false, host='localhost', dbname=null, sql=null;
  for(var i=0;i<args.length;i++){ var a=args[i];
    if(a==='-u'){ user=args[++i]; continue; }
    if(a==='-p'){ pwGiven=true; if(args[i+1]&&args[i+1][0]!=='-'&&args[i].length===2){ pw=args[++i]; } continue; }
    if(a.indexOf('-p')===0&&a.length>2){ pwGiven=true; pw=a.slice(2); continue; }
    if(a==='--password'){ pwGiven=true; pw=args[++i]; continue; }
    if(a==='-h'){ host=args[++i]; continue; }
    if(a==='-e'||a==='--execute'){ sql=args[++i]; continue; }
    if(a==='-P'||a==='-S'||a==='--socket'){ args[++i]; continue; }
    if(a==='-D'||a==='--database'){ dbname=args[++i]; continue; }
    if(a[0]==='-') continue;
    if(dbname===null){ dbname=a; }
  }
  return {user:user, pw:pw, pwGiven:pwGiven, host:host, dbname:dbname, sql:sql};
}
CMDS['mysql']=function(vm,args,cc){
  if(!vm.pkgs['mariadb-server']&&!vm.pkgs['mariadb-client']) return notFound('mysql');

  var au=mysqlAuth(vm,args);
  if(au.host!=='localhost'&&au.host!=='127.0.0.1') return {lines:[C('ERROR 2003 (HY000): Can\'t connect to MySQL server on \''+au.host+'\' (111)','err')], code:1};
  if(au.user!=='root'){
    var u=vm.sql.u[au.user];
    if(!u) return {lines:[C("ERROR 1045 (28000): Access denied for user '"+au.user+"'@'localhost' (using password: "+(au.pwGiven?'YES':'NO')+')','err')], code:1};
    if(u.pw){
      if(!au.pwGiven) return {lines:[C("ERROR 1045 (28000): Access denied for user '"+au.user+"'@'localhost' (using password: NO)","err"), C('该用户有密码，请用 -p密码 形式（模拟器不支持交互式输入）','hint')], code:1};
      if(String(au.pw)!==String(u.pw)) return {lines:[C("ERROR 1045 (28000): Access denied for user '"+au.user+"'@'localhost' (using password: YES)","err")], code:1};
    }

  var script = au.sql!==null?au.sql:(cc.stdin?cc.stdin.map(textOf).join('\n'):null);
  if(script===null) return {lines:[C('（模拟器不做交互式 mysql；请用: mysql -e "SQL语句" 或 管道输入）','hint')], code:1};
  var r=sqlRun(vm, script, au.user, au.dbname||null);

  return {lines:lines, code:r.code};
};

function finishExam(timeout){

  var rows=[], sumG=0, sumT=0;
  for(var i=0;i<paper.ids.length;i++){
    var id=paper.ids[i], scn=E.SCENARIO_BY_ID[id];
    var vm=E.newVM('exam-'+id), saved=LS(sessKey(id),null), loaded=false;
    if(saved&&saved.vm){ try{ loaded=E.vmFromJSON(vm,saved.vm); }catch(e){ loaded=false; } }
    if(!loaded) E.scenarioNew(vm,id);
    var g=E.grade(vm,scn);
    rows.push({id:id,t:scn.title,pct:g.pct,got:g.got,total:g.total});
    sumG+=g.got; sumT+=g.total;
  }
  var total=sumT?Math.round(sumG/sumT*100):0;
  var rec={pid:paper.id,t:paper.t,pct:total,rows:rows,ts:Date.now()};
  var hist=LS('wg.exams',[]); hist.unshift(rec); LSset('wg.exams',hist.slice(0,12));

  /* 报告 */
