<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea">
<title>国学知识竞赛 · 刷题</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#f6f2ea;color:#26221c;font-size:16px;line-height:1.6;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
 padding-bottom:74px;
 background-image:radial-gradient(rgba(157,43,33,.035) 1px, transparent 1px);
 background-size:22px 22px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:9;background:rgba(246,242,234,.94);backdrop-filter:blur(8px);
 border-bottom:1px solid #e6ddcf;padding:11px 16px;display:flex;align-items:center;gap:10px}
.topbar .back{border:0;background:none;font-size:24px;line-height:1;color:#8a8175;padding:0 6px 2px 0;cursor:pointer;font-family:serif}
.topbar .ttl{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .cnt{font-size:13px;color:#8a8175;font-variant-numeric:tabular-nums}
.bar{height:3px;background:#e6ddcf}
.bar i{display:block;height:100%;background:#9d2b21;width:0;transition:width .25s}
/* 首页头部 */
.hero{padding:26px 0 6px;display:flex;align-items:flex-start;gap:14px}
.seal{width:52px;height:52px;flex:none;border-radius:9px;background:#9d2b21;color:#fff8ef;
 display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;line-height:1.1;
 font-family:"Songti SC","Noto Serif CJK SC",serif;letter-spacing:1px;box-shadow:0 4px 12px rgba(157,43,33,.22)}
h1{font-size:25px;margin:0 0 3px;font-family:"Songti SC","Noto Serif CJK SC",serif;letter-spacing:1px}
.sub{color:#8a8175;font-size:13px;margin:0}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.statgrid b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-family:"Songti SC",serif}
.statgrid span{font-size:11.5px;color:#8a8175}
.card{background:#fffdf8;border:1px solid #ece3d5;border-radius:14px;padding:16px;margin:14px 0;
 box-shadow:0 1px 2px rgba(74,60,38,.05)}
.sect{font-size:12.5px;color:#8a8175;margin:22px 0 10px;font-weight:600;letter-spacing:.06em;
 display:flex;align-items:center;gap:8px}
.sect:after{content:"";height:1px;flex:1;background:#e6ddcf}
/* 题库卡片 */
.bank{display:flex;align-items:center;gap:14px;width:100%;background:#fffdf8;border:1px solid #ece3d5;
 border-radius:14px;padding:15px 16px;margin-bottom:11px;text-align:left;font-family:inherit;cursor:pointer;
 transition:transform .07s,box-shadow .15s,border-color .15s}
.bank:active{transform:scale(.99);box-shadow:0 1px 2px rgba(74,60,38,.08)}
.bank .no{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid #d8c9b4;color:#9d2b21;
 display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:"Songti SC",serif}
.bank .tx{flex:1;min-width:0}
.bank .nm{font-size:16.5px;font-weight:600;font-family:"Songti SC","Noto Serif CJK SC",serif}
.bank .ds{display:block;font-size:12.5px;color:#8a8175;margin-top:1px}
.bank .n{font-size:12.5px;color:#9d2b21;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 按钮 */
.btn{display:block;width:100%;border:0;border-radius:12px;background:#9d2b21;color:#fff8ef;
 font-size:16px;font-weight:600;padding:15px 16px;margin-bottom:10px;text-align:left;
 font-family:inherit;cursor:pointer;transition:transform .06s,filter .15s}
.btn:active{transform:scale(.985);filter:brightness(.95)}
.btn.ghost{background:#fffdf8;color:#9d2b21;border:1px solid #ddc9b6}
.btn.jade{background:#2f6b5a}
.btn.dark{background:#3a332a}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn em{float:right;font-style:normal;font-weight:400;opacity:.75;font-size:13px}
/* 答题 */
.qtags{display:flex;gap:6px;margin:16px 0 2px;align-items:center}
.tag{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:#f3e7d7;color:#8a5a26}
.tag.idx{background:transparent;color:#a89c8b;margin-left:auto;font-weight:400}
.stem{font-size:18px;line-height:1.65;font-weight:500;margin:8px 0 18px;word-break:break-word;
 font-family:"Songti SC","Noto Serif CJK SC",serif}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;font-family:inherit;
 background:#fffdf8;border:1.5px solid #e9dfd0;border-radius:12px;padding:13px 15px;margin-bottom:9px;
 font-size:15.5px;color:#26221c;cursor:pointer;transition:border-color .12s,background .12s,transform .06s}
.opt:active{transform:scale(.99)}
.opt .k{font-weight:700;color:#a89c8b;min-width:19px;font-family:"Songti SC",serif}
.opt.sel{border-color:#9d2b21;background:#fdf4ee}
.opt.sel .k{color:#9d2b21}
.opt.ok{border-color:#2f6b5a;background:#f0f7f3}
.opt.ok .k{color:#2f6b5a}
.opt.bad{border-color:#b3392f;background:#fdf1ef}
.opt.bad .k{color:#b3392f}
.opt[disabled]{pointer-events:none}
.fb{border-radius:12px;padding:12px 15px;margin:14px 0 8px;font-size:15px;font-weight:600;line-height:1.6}
.fb.ok{background:#eef7f1;color:#1f5546;border:1px solid #bcd9ca}
.fb.bad{background:#fdf1ef;color:#8f2a21;border:1px solid #efc9c3}
.fb small{display:block;font-weight:400;font-size:13.5px;margin-top:4px;opacity:.95;color:#5c5245}
/* 结果 */
.hero-res{text-align:center;padding:26px 16px 8px}
.hero-res .pct{font-size:58px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
 font-family:"Songti SC","Noto Serif CJK SC",serif;color:#9d2b21}
.hero-res .lbl{color:#8a8175;font-size:13.5px;margin-top:8px}
.wrongitem{background:#fffdf8;border:1px solid #ece3d5;border-left:3px solid #b3392f;border-radius:0 12px 12px 0;
 padding:12px 14px;margin-bottom:10px}
.wrongitem .q{font-size:15px;font-weight:500;line-height:1.6;font-family:"Songti SC",serif}
.wrongitem .a{font-size:13.5px;color:#1f5546;margin-top:6px}
.wrongitem .y{font-size:13px;color:#a03a30;margin-top:3px}
.wrongitem .src{font-size:11.5px;color:#a89c8b;margin-top:4px}
.empty{color:#a89c8b;text-align:center;padding:26px 10px;font-size:14px}
/* 速记 / 诗词 */
.search{width:100%;border:1px solid #e6ddcf;background:#fffdf8;border-radius:11px;padding:11px 14px;
 font-size:14.5px;font-family:inherit;color:#26221c;outline:none;margin:14px 0 4px}
.search:focus{border-color:#c9b49c}
.segs{display:flex;gap:6px;margin:12px 0 2px;overflow-x:auto}
.seg{flex:none;border:1px solid #e6ddcf;background:#fffdf8;color:#6f6558;font-size:13.5px;
 padding:7px 15px;border-radius:999px;font-family:inherit;cursor:pointer}
.seg.on{background:#9d2b21;color:#fff8ef;border-color:#9d2b21}
.item{background:#fffdf8;border:1px solid #ece3d5;border-radius:12px;padding:13px 15px;margin-bottom:9px}
.item .h{font-size:15.5px;font-weight:600;font-family:"Songti SC",serif;line-height:1.55}
.item .h .n{color:#b8a68f;font-size:12.5px;margin-right:6px;font-family:-apple-system,sans-serif;font-weight:400}
.item .b{font-size:14.5px;color:#5c5245;margin-top:5px;line-height:1.7}
.item .badge{display:inline-block;vertical-align:1px;font-size:11.5px;padding:1px 8px;border-radius:999px;margin-right:7px;font-weight:600}
.badge.t{background:#eef7f1;color:#1f5546}
.badge.f{background:#fdf1ef;color:#8f2a21}
.poem{cursor:pointer}
.poem .b{display:none;white-space:pre-wrap;font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:15px;line-height:1.95}
.poem.open .b{display:block}
.poem .au{font-size:12.5px;color:#8a8175;margin-top:2px}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:16px 0 4px}
.pager button{border:1px solid #e6ddcf;background:#fffdf8;border-radius:10px;padding:8px 16px;
 font-size:14px;font-family:inherit;color:#5c5245;cursor:pointer}
.pager button[disabled]{opacity:.4;pointer-events:none}
.pager span{font-size:13px;color:#8a8175;font-variant-numeric:tabular-nums}
/* 底部导航 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(255,253,248,.97);
 backdrop-filter:blur(10px);border-top:1px solid #e6ddcf;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:none;font-family:inherit;font-size:11.5px;color:#a89c8b;
 display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;cursor:pointer}
.nav button .ic{font-size:17px;line-height:1;font-family:"Songti SC",serif}
.nav button.on{color:#9d2b21}
footer{text-align:center;color:#b8a68f;font-size:11.5px;padding:14px 0 6px;line-height:1.7}
@media (max-width:430px){
  .wrap{padding:0 13px}
  h1{font-size:22px}
  .hero{padding:18px 0 2px}
  .seal{width:46px;height:46px;font-size:17px}
  .stem{font-size:17px;margin:6px 0 15px}
  .opt{font-size:15px;padding:12px 13px}
  .btn{font-size:15.5px;padding:14px 15px}
  .statgrid b{font-size:18px}
  .hero-res .pct{font-size:50px}
}
</style>
</head>
<body>
<div class="topbar" id="topbar" style="display:none">
  <button class="back" id="tbBack" aria-label="退出答题">‹</button>
  <div class="ttl" id="tbTitle">刷题</div>
  <div class="cnt" id="tbCount"></div>
</div>
<div class="bar" id="bar" style="display:none"><i id="barFill"></i></div>
<div id="app"></div>
<div class="nav" id="nav">
  <button data-nav="home" class="on"><span class="ic">题</span>题库</button>
  <button data-nav="facts"><span class="ic">册</span>速记</button>
  <button data-nav="poems"><span class="ic">诗</span>诗词</button>
  <button data-nav="wrong"><span class="ic">错</span>错题</button>
</div>
<footer>题库源自《第十二届国学知识竞赛题库》 · 选项每次随机 · 记录只存本机</footer>

虚设。便纵有千种风情，更与何人说？"]],["永遇乐 京口北固亭怀古","宋 辛弃疾",["千古江山，英雄无觅，孙仲谋处。舞榭歌台，风流总被，雨打风吹去。斜阳草树，寻常巷陌，人道寄奴曾住。想当年，金戈铁马，气吞万里如虎。","元嘉草草，封狼居胥，赢得仓皇北顾。四十三年，望中犹记，烽火扬州路。可堪回首，佛狸祠下，一片神鸦社鼓。凭谁问：廉颇老矣，尚能饭否？"]],["声声慢","宋 李清照",["寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急！雁过也，正伤心，却是旧时相识。","满地黄花堆积，憔悴损，如今有谁堪摘？守着窗儿，独自怎生得黑？梧桐更兼细雨，到黄昏、点点滴滴。这次第，怎一个愁字了得！"]],["咏鹅","唐·骆宾王",["鹅鹅鹅，曲项向天歌，白毛浮绿水,红掌拨清波。"]],["春晓","唐·孟浩然",["春眠不觉晓,处处闻啼鸟。夜来风雨声,花落知多少。"]],["静夜思","唐·李白",["床前明月光,疑是地上霜。举头望明月,低头思故乡。"]],["风","唐·李峤",["解落三秋叶,能开二月花。过江千尺浪,入竹万竿斜。"]],["江南","汉乐府",["江南可采莲,莲叶何田田。鱼戏莲叶间。鱼戏莲叶东,","鱼戏莲叶西,鱼戏莲叶南,鱼戏莲叶北。"]],["咏柳","唐·贺知章",["碧玉妆成一树高,万条垂下绿丝绦。不知细叶谁裁出,二月春风似剪刀。"]],["长歌行","汉乐府",["青青园中葵,朝露待日晞。阳春布德泽,万物生光辉。","常恐秋节至,焜黄华叶衰。百川东到海,何时复西归。","少壮不努力,老大徒伤悲。"]],["登鹳雀楼","唐·王之涣",["白日依山尽,黄河入海流。欲穷千里目,更上一层楼。"]],["凉州词","唐·王翰",["葡萄美酒夜光杯,欲饮琵琶马上催。醉卧沙场君莫笑,古来征战几人回？"]],["出塞","唐·王昌龄",["秦时明月汉时关,万里长征人未还。但使龙城飞将在,不教胡马度阴山。"]],["芙蓉楼送辛渐","唐·王昌龄",["寒雨连江夜入吴,平明送客楚山孤。洛阳亲友如相间,一片冰心在玉壶。"]],["敕勒歌","北朝民歌",["敕勒川,阴山下。天似穹庐,笼盖四野。天苍苍,野茫茫,风吹草低见牛羊。"]],["回乡偶书","唐·贺知章",["少小离家老大回,乡音无改鬓毛衰。儿童相见不相识,笑问客从何处来。"]],["凉州词","唐·王之涣",["黄河远上白云间,一片孤城万仞山。羌笛何须怨杨柳,春风不度玉门关。"]],["鹿柴","唐·王维",["空山不见人,但闻人语响。返景人深林,复照青苔上。"]],["悯农(其一)","唐·李绅",["春种一粒粟,秋收万颗子。四海无闲田,农夫犹饿死。"]],["悯农(其二)","唐·李绅",["锄禾日当午,汗滴禾下土。谁知盘中餐,粒粒皆辛苦。"]],["送元二使安西","唐·王维",["渭城朝雨浥轻尘,客舍青青柳色新。劝君更尽一杯酒,西出阳关无故人。"]],["九月九日忆山东兄弟","唐·王维",["独在异乡为异客,每逢佳节倍思亲。遥知兄弟登高处,遍插茱萸少一人。"]],["古朗月行》(节选)","唐·李白",["小时不识月,呼作白玉盘。又疑瑶台镜,飞在青云端。","仙人垂两足,桂树何团团。白兔捣药成,问言与谁餐。"]],["望庐山瀑布","唐·李白",["日照香炉生紫烟,遥看瀑布挂前川。飞流直下三千尺,疑是银河落九天。"]],["赠汪伦","唐·李白",["李白乘舟将欲行,忽闻岸上踏歌声。桃花潭水深千尺,不及汪伦送我情。"]],["春夜喜雨","唐·杜甫",["好雨知时节,当春乃发生。随风潜入夜,润物细无声。","野径云俱黑,江船火独明。晓看红湿处,花重锦官城。"]],["绝句","唐·杜甫",["迟日江山丽,春风花草香。泥融飞燕子,沙暖睡鸳鸯。"]],["黄鹳楼送孟浩然之广陵","唐·李白",["故人西辞黄鹤楼,烟花三月下扬州。孤帆远影碧空尽,唯见长江天际流。"]],["早发白帝城","唐·李白",["朝辞白帝彩云间,千里江陵一日还。两岸猿声啼不住,轻舟已过万重山。"]],["望天门山","唐·李白",["天门中断楚江开,碧水东流至此回。两岸青山相对出,孤帆一片日边来。"]],["别董大","唐·高适",["千里黄云白日曛,北风吹雁雪纷纷。莫愁前路无知已,天下谁人不识君？"]],["绝句","唐·杜甫",["两个黄鹂鸣翠柳,一行白鹭上青天。窗含西岭千秋雪,门泊东吴万里船。"]],["江畔独步寻花》其六","唐·杜甫",["黄四娘家花满蹊,千朵万朵压枝低。留连戏蝶时时舞,自在娇莺恰恰啼。"]],["江雪","唐·柳宗元",["千山鸟飞绝,万径人踪灭。孤舟蓑笠翁,独钓寒江雪。"]],["游子吟","唐·孟郊",["慈母手中线,游子身上衣。临行密密缝,意恐迟迟归。谁言寸草心,报得三春晖。"]],["山行","唐·杜牧",["远上寒山石径斜,白云深处有人家。停车坐爱枫林晚,霜叶红于二月花。"]],["清明","唐·杜牧",["清明时节雨纷纷,路上行人欲断魂。借问酒家何处有,牧童遥指杏花村。"]],["早春呈水部张十八员外","唐·韩愈",["天街小雨润如酥,草色遥看近却无。最是一年春好处,绝胜烟柳满皇都。"]],["渔歌子","唐·张志和",["西塞山前白鹭飞,桃花流水鳜鱼肥。青箬笠,绿蓑衣,斜风细雨不须归。"]],["望洞庭","唐·刘禹锡",["湖光秋月两相和,潭面无风镜未磨。遥望洞庭山水色,白银盘里一青螺。"]],["枫桥夜泊","唐·张继",["月落乌啼霜满天,江枫渔火对愁眠。姑苏城外寒山寺,夜半钟声到客船。"]],["滁州西涧","唐·韦应物",["独怜幽草涧边生,上有黄鹂深树鸣。春潮带雨晚来急,野渡无人舟自横。"]],["塞下曲","唐·卢纶",["月黑雁飞高,单于夜遁逃。欲将轻骑逐,大雪满弓刀。"]],["赋得古原草送别","唐·白居易",["离离原上草,一岁一枯荣。野火烧不尽,春风吹又生。","远芳侵古道,晴翠接荒城。又送王孙去,萋萋满别情。"]],["池上","唐·白居易",["小娃撑小艇,偷采白莲回。不解藏踪迹,浮萍一道开。"]],["忆江南","唐·白居易",["江南好,风景旧曾谙。日出江花红胜火,春来江水绿如蓝,能不忆江南？"]],["小儿垂钓","唐·胡令能",["蓬头稚子学垂纶,侧坐莓苔草映身。路人借问遥招手,怕得鱼惊不应人。"]],["寻隐者不遇","唐·贾岛",["松下问童子,言师采药去。只在此山中,云深不知处。"]],["江南春","唐·杜牧",["千里莺啼绿映红,水村山郭酒旗风。南朝四百八十寺,多少楼台烟雨中。"]],["蜂","唐·罗隐",["不论平地与山尖,无限风光尽被占。采得百花成蜜后,为谁辛苦为谁甜。"]],["江上渔者","宋·范仲淹",["江上往来人,但爱鲈鱼美。君看一叶舟,出没风波里。"]],["夏日绝句","宋·李清照",["生当作人杰,死亦为鬼雄。至今思项羽,不肯过江东。"]],["元日","宋·王安石",["爆竹声中一岁除,春风送暖入屠苏。千门万户曈曈日,总把新桃换旧符。"]],["泊船瓜洲","宋·王安石",["京口瓜洲一水间,钟山只隔数重山。春风又绿江南岸,明月何时照我还。"]],["书湖阴先生壁","宋·王安石",["茅檐长扫净无苔,花木成畦手自栽。一水护田将绿绕,两山排闼送青来。"]],["饮湖上初睛后雨","宋·苏轼",["水光潋滟睛方好,山色空蒙雨亦奇。欲把西湖比西子,淡妆浓抹总相宜。"]],["惠崇春江晓景","宋·苏轼",["竹外桃花三两枝,春江水暖鸭先知。蒌蒿满地芦芽短,正是河豚欲上时。"]],["题西林壁","宋·苏轼",["横看成岭侧成峰,远近高低各不同。不识庐山真面目,只缘身在此山中。"]],["三衢道中","宋·曾几",["梅子黄时日日晴,小溪泛尽却山行。绿阴不减来时路,添得黄鹂四五声。"]],["示儿","宋·陆游",["死去元知万事空,但悲不见九州同。王师北定中原日,家祭无忘告乃翁。"]],["秋夜将晓篱门迎凉有感","宋·陆游",["三万里河东入海,五千仞岳上摩天。遗民泪尽胡尘里,南望王师又一年。"]],["四时田园杂兴(其一)","宋·范成大",["昼出耘田夜绩麻,村庄儿女各当家。童孙未解供耕织,也傍桑阴学种瓜。"]],["四时田园杂兴(其二)","宋·范成大",["梅子金黄杏子肥,麦花雪白菜花稀。日长篱落无人过,唯有蜻蜓蛱蝶飞。"]],["小池","宋·杨万里",["泉眼无声惜细流,树阴照水爱晴柔。小荷才露尖尖角,早有蜻蜓立上头。"]],["晓出净慈寺送林子方","宋·杨万里",["毕竟西湖六月中,风光不与四时同。接天莲叶无穷碧,映日荷花别样红。"]],["春日","宋·朱熹",["胜日寻芳泗水滨,无边光景一时新。等闲识得东风面,万紫千红总是春。"]],["题临安邸","宋·林升",["山外青山楼外楼,西湖歌舞几时休？暖风熏得游人醉,直把杭州作汴州。"]],["游园不值","宋·叶绍翁",["应怜屐齿印苍苔,小扣柴扉久不开。春色满园关不住,一枝红杏出墙来。"]],["观书有感","宋·朱熹",["半亩方塘一鉴开,天光云影共徘徊。问渠那得清如许？为有源头活水来。"]],["乡村四月","宋·翁卷",["绿遍山原白满川,子规声里雨如烟。乡村四月闲人少,才了蚕桑又插田。"]],["墨梅","元·王冕",["我家洗砚池头树,朵朵花开淡墨痕。要人夸好颜色,只留清气满乾坤。"]],["石灰吟","明·于谦",["千锤万凿出深山,烈火焚烧若等闲。粉身碎骨全不怕,要留清白在人间。"]],["己亥杂诗","清·龚自珍",["九州生气恃风雷,万马齐喑究可哀。我劝天公重抖擞,不拘一格降人才。"]],["村居","清·高鼎",["草长莺飞二月天,拂堤杨柳醉春烟。儿童散学归来早,忙趁东风放纸鸢。"]],["所见","清·袁枚",["牧童骑黄牛,歌声振林樾。意欲捕鸣蝉,忽然闭口立。"]],["竹石","清·郑燮",["咬定青山不放松,立根原在破岩中。千磨万击还坚劲,任尔东西南北风。"]],["关雎》(节选)","",["关关雎鸠,在河之洲。窈窕淑女,君子好逑。","参差荇菜,左右流之。窈窕淑女,寤寐求之。"]],["兼葭》(节选)","",["蒹葭苍苍,白露为霜。所谓伊人,在水一方。","溯洄从之,道阻且长。溯游从之,宛在水中央。"]],["观沧海","两汉·曹操",["东临碣石,以观沧海。水何澹澹,山岛竦峙。树木丛生,百草丰茂。","秋风萧瑟,洪波涌起。日月之行,若出其中；星汉灿烂,若出其里。","幸甚至哉,歌以咏志。"]],["饮酒","东晋·陶渊明",["结庐在人境,而无车马喧。问君何能尔？心远地自偏。采菊东篱下,悠然见南山。山气日夕佳,飞鸟相与还。此中有真意,欲辨已忘言。"]],["木兰辞》(节选)","",["问女何所思,问女何所忆。女亦无所思,女亦无所忆。","雄兔脚扑朔,雌兔眼迷离。双兔傍地走,安能辨我是雄雌。"]],["送杜少府之任蜀州","唐·王勃",["城阙辅三秦,风烟望五津。与君离别意,同是宦游人。","海内存知己,天涯若比邻。无为在歧路,儿女共沾巾。"]],["登幽州台歌","唐·陈子昂",["前不见古人,后不见来者。念天地之悠悠,独怆然而涕下。"]],["次北固山下","唐·王湾",["客路青山外,行舟绿水前。潮平两岸阔,风正一帆悬。","海日生残夜,江春入旧年。乡书何处达,归雁洛阳边。"]],["闻王昌龄左迁龙标遥有此寄","唐·李白",["杨花落尽子规啼,闻道龙标过五溪。我寄愁心与明月,随风直到夜郎西。"]],["使至塞上","唐·王维",["单车欲问边，属国过居延。征蓬出汉塞,归雁入胡天。","大漠孤烟直，长河落日圆。萧关逢候骑，都护在燕然。"]]]};

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  try{

}

function itemOf(bank, i){
  const d = DATA[bank][i];
  return {id: bank+':'+i, bank, q: d[0], opts: d[1], ans: LETTERS.indexOf(d[2]), e: d[3]||''};
}
function bankCount(bank){ return DATA[bank].length; }
function poolOf(bank){ return DATA[bank].map((_,i)=>itemOf(bank,i)); }

    </div>
    <div class="sect">题库</div>
    ${['classic','comp','patriot'].map(k=>`
      <button class="bank" data-act="bank" data-b="${k}">
        <span class="no">${BANKS[k].no}</span>
        <span class="tx"><span class="nm">${BANKS[k].name}</span><span class="ds">${BANKS[k].sub}</span></span>
        <span class="n">${bankCount(k)} 题 ›</span>
      </button>`).join('')}
    <div class="sect">专项</div>
    <button class="btn ghost" data-act="wrong">错题重练<em>${wc?wc+' 题在手':'暂无错题'}</em></button>
    <button class="btn ghost" data-act="facts">常识速记<em>250 条 · 考前扫一遍</em></button>
    <button class="btn ghost" data-act="poems">古诗词<em>${DATA.poems.length} 篇</em></button>
    <div style="text-align:center;margin-top:18px">
      <a href="#" data-act="reset" style="color:#b8a68f;font-size:12px;text-decoration:none">清空本机记录</a>
    </div>
  </div>`;
}

/* ---------- 题库详情 ---------- */
function renderBank(key){
  view = {name:'bank', bank:key};
  setTop(false);
  const n = bankCount(key);
  const seen = DATA[key].filter((_,i)=>S.seen[key+':'+i]).length;
  app.innerHTML = `
  <div class="wrap">
    <div class="sect" style="margin-top:22px"><a href="#" data-act="home" style="color:#8a8175;text-decoration:none">‹ 全部题库</a></div>
    <h1 style="font-size:23px;margin:2px 0 2px">${BANKS[key].name}</h1>
    <p class="sub">${BANKS[key].sub} · 已练 ${seen}/${n}</p>
    <div class="sect">开始</div>
    <button class="btn" data-act="start" data-b="${key}" data-n="20">练 20 题<em>约 6 分钟</em></button>
    <button class="btn" data-act="start" data-b="${key}" data-n="50">练 50 题<em>约 15 分钟</em></button>
    <button class="btn dark" data-act="start" data-b="${key}" data-n="0">全部 ${n} 题<em>一次刷完</em></button>
    <button class="btn jade" data-act="start" data-b="${key}" data-n="0" data-wrong="1" ${wrongIdSet().size?'':'disabled'}>错题优先<em>全部 ${n} 题 · 混入错题</em></button>
  </div>`;
}

/* ---------- 抽题 ---------- */
function pickPool(pool, n, preferWrong){
  const w = wrongIdSet();
  let out = [];
  if(preferWrong){
    const cand = pool.filter(x => w.has(x.id));
    shuffle(cand);
    out = cand.slice(0, Math.min(cand.length, Math.ceil(n*0.4)));
  }
  const rest = pool.filter(x => out.indexOf(x) < 0);
  shuffle(rest);
  while(out.length < n && rest.length) out.push(rest.pop());
  shuffle(out);
  return out;
}

/* ---------- 答题 ---------- */
function startQuiz(title, pool, n, preferWrong){
  const total = Math.min(n, pool.length);
  const list = pickPool(pool, total, preferWrong).map(it => {
    // 每题选项独立随机：打乱选项顺序并同步答案位置
    const idx = [0,1,2,3];
    shuffle(idx);
    const opts = idx.map(i => it.opts[i]);
    const ans = idx.indexOf(it.ans);
    return {id:it.id, q:it.q, opts, ans, e:it.e, bank:it.bank};
  });
  run = {title, items:list, i:0, locked:false, right:0, wrongThisRound:[], t0:Date.now()};
  renderQuiz();
}

function currentItem(){ return run.items[run.i]; }

function renderQuiz(){
  if(run.i >= run.items.length) return renderResult();
  const it = currentItem();
  setTop(true, run.title, (run.i+1)+' / '+run.items.length, run.i*100/run.items.length);
  app.innerHTML = `
  <div class="wrap">
    <div class="qtags"><span class="tag">单选</span><span class="tag idx">第 ${run.i+1} 题</span></div>
    <div class="stem">${esc(it.q)}</div>
    <div id="opts">${it.opts.map((o,i)=>`
      <button class="opt" data-opt="${i}">
        <span class="k">${LETTERS[i]}</span><span>${esc(o)}</span>
      </button>`).join('')}
    </div>
    <div id="fb"></div>
    <button class="btn ghost" id="revealBtn" data-act="reveal">不会，直接看答案</button>
    <button class="btn dark" id="nextBtn" data-act="next" style="display:none">下一题</button>
  </div>`;
  run.locked = false;
}

function paint(chosen){
  const it = currentItem();
  const opts = document.querySelectorAll('.opt');
  opts.forEach((el,i)=>{
    el.disabled = true;
    if(i === it.ans) el.classList.add('ok');
    if(chosen !== null && chosen !== it.ans && i === chosen) el.classList.add('bad');
  });
  const fb = document.getElementById('fb');
  const ok = chosen === it.ans;
  fb.className = 'fb ' + (ok ? 'ok' : 'bad');
  fb.innerHTML = ok
    ? `答对了<small>答案：${LETTERS[it.ans]}、${esc(it.opts[it.ans])}</small>`
    : `${chosen===null?'答案是':'答错了'}<small>正确答案：${LETTERS[it.ans]}、${esc(it.opts[it.ans])}${it.e?'　（'+esc(it.e)+'）':''}</small>`;
  document.getElementById('revealBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('nextBtn').innerHTML = run.i >= run.items.length-1 ? '看结果<em>本轮结束</em>' : '下一题';
  run.locked = true;
}

function answer(i){
  if(run.locked) return;
  const it = currentItem();
  paint(i);
  const v = S.seen[it.id] || {r:0,w:0};
  if(i === it.ans){
    v.r = (v.r||0)+1; run.right++;
    const wi = S.wrong.indexOf(it.id); if(wi >= 0) S.wrong.splice(wi,1);
  }else{
    v.w = (v.w||0)+1;
    if(S.wrong.indexOf(it.id) < 0) S.wrong.push(it.id);
    run.wrongThisRound.push({...it, chosen:i});
  }
  S.seen[it.id] = v;
  save();
}

function nextQ(){
  run.i++;
  if(run.i >= run.items.length) renderResult();
  else renderQuiz();
}

/* ---------- 结果 ---------- */
function renderResult(){
  setTop(false);
  const total = run.items.length;
  const secs = Math.round((Date.now()-run.t0)/1000);
  const pct = total ? Math.round(run.right*100/total) : 0;
  const time = secs < 60 ? secs+' 秒' : Math.floor(secs/60)+' 分 '+(secs%60)+' 秒';
  S.hist.push({t:Date.now(), total, right:run.right});
  if(S.hist.length > 50) S.hist = S.hist.slice(-50);
  save();
  const wrongList = run.wrongThisRound;
  app.innerHTML = `
  <div class="wrap">
    <div class="hero-res">
      <div class="pct">${pct}<span style="font-size:24px">%</span></div>
      <div class="lbl">${run.title} · 答对 ${run.right} / ${total} 题 · 用时 ${time}</div>
    </div>
    <div class="card" style="text-align:center;color:#5c5245;font-size:14px">
      ${pct>=90?'功底扎实，可以上场了。':pct>=70?'不错，把错题再过一遍更稳。':pct>=50?'基础尚可，重点记错题。':'别急，先看速记再回来刷。'}
    </div>
    ${wrongList.length?`
      <div class="sect">本轮错题 / 未答 · ${wrongList.length}</div>
      ${wrongList.map(w=>`
        <div class="wrongitem">
          <div class="q">${esc(w.q)}</div>
          <div class="y">${w.chosen===null?'未作答（直接看了答案）':'你选：'+LETTERS[w.chosen]+'、'+esc(w.opts[w.chosen])}</div>
          <div class="a">正确：${LETTERS[w.ans]}、${esc(w.opts[w.ans])}</div>
          <div class="src">${BANKS[w.bank].name}</div>
        </div>`).join('')}
    `:`<div class="empty">本轮全对，漂亮。</div>`}
    <div style="margin-top:18px">
      ${wrongList.length?`<button class="btn" data-act="retryWrong">重练本轮错题 / 未答<em>${wrongList.length} 题</em></button>`:''}
      <button class="btn ghost" data-act="home">回题库<em>再挑一组</em></button>
    </div>
  </div>`;
}

/* ---------- 错题本 ---------- */
function renderWrong(){
  setTop(false);
  view = {name:'wrong'};
  const items = S.wrong.map(id => {
    const [bank, i] = id.split(':');
    const it = itemOf(bank, +i);
    return it;
  }).filter(Boolean).reverse();
  app.innerHTML = `
  <div class="wrap">
    <h1 style="font-size:23px;margin:22px 0 2px">错题本</h1>
    <p class="sub">答错自动收录，答对后自动移出 · 存本机</p>
    ${items.length?`
      <div class="sect">共 ${items.length} 题</div>
      ${items.map(it=>`
        <div class="wrongitem">
          <div class="q">${esc(it.q)}</div>
          <div class="a">答案：${esc(it.opts[it.ans])}</div>
          <div class="src">${BANKS[it.bank].name}</div>
        </div>`).join('')}
      <div style="margin-top:16px">
        <button class="btn" data-act="startWrongAll">重练全部错题<em>${items.length} 题</em></button>
        <button class="btn ghost" data-act="home">回题库</button>
      </div>
    `:`<div class="empty">还没有错题。<br>去刷几题吧。</div>
      <button class="btn ghost" data-act="home">回题库</button>`}
  </div>`;
}

/* ---------- 速记 ---------- */
function renderFacts(){
  setTop(false);
  view = {name:'facts'};
  const kw = factQ.trim();
  const list = factsFilter === 'all'
    ? DATA.facts.map(f=>({n:f[0], t:f[1]}))
    : DATA.judge.map((j,i)=>({n:i+1, t:j[0], a:j[1], e:j[2]}));
  const filt = kw ? list.filter(x=>x.t.indexOf(kw)>=0) : list;
  const pageSize = 20;
  const pages = Math.max(1, Math.ceil(filt.length/pageSize));
  if(factsPage >= pages) factsPage = pages-1;
  const page = filt.slice(factsPage*pageSize, factsPage*pageSize+pageSize);
  app.innerHTML = `
  <div class="wrap">
    <h1 style="font-size:23px;margin:22px 0 2px">常识速记</h1>
    <p class="sub">100 条文学文化常识 + 150 条国学判断</p>
    <input class="search" id="factSearch" placeholder="搜索关键词，如：史记、四大、诗经" value="${esc(factQ)}">
    <div class="segs">
      <button class="seg ${factsFilter==='all'?'on':''}" data-act="factsFilter" data-f="all">常识 100 条</button>
      <button class="seg ${factsFilter==='judge'?'on':''}" data-act="factsFilter" data-f="judge">国学判断 150 条</button>
    </div>
    <div style="margin-top:14px">
    ${page.length?page.map(x=>{
      if(factsFilter==='all'){
        const idx = x.t.indexOf('：');
        const h = idx>0 ? x.t.slice(0,idx) : x.t;
        const b = idx>0 ? x.t.slice(idx+1) : '';
        return `<div class="item"><div class="h"><span class="n">${x.n}</span>${esc(h)}</div>${b?`<div class="b">${esc(b)}</div>`:''}</div>`;
      }
      const ok = x.a === '对';
      return `<div class="item"><div class="h"><span class="badge ${ok?'t':'f'}">${ok?'对':'错'}</span><span class="n">${x.n}</span>${esc(x.t)}</div>${x.e?`<div class="b">辨析：${esc(x.e)}</div>`:''}</div>`;
    }).join(''):'<div class="empty">没有匹配的条目</div>'}
    </div>
    ${pages>1?`<div class="pager">
      <button data-act="factsPage" data-p="${factsPage-1}" ${factsPage<=0?'disabled':''}>上一页</button>
      <span>${factsPage+1} / ${pages}</span>
      <button data-act="factsPage" data-p="${factsPage+1}" ${factsPage>=pages-1?'disabled':''}>下一页</button>
    </div>`:''}
  </div>`;
}

/* ---------- 诗词 ---------- */
function renderPoems(){
  setTop(false);
  view = {name:'poems'};
  const kw = poemQ.trim();
  const list = (kw ? DATA.poems.filter(p=>p[0].indexOf(kw)>=0 || p[1].indexOf(kw)>=0 || p[2].join('').indexOf(kw)>=0) : DATA.poems);
  const pageSize = 12;
  const pages = Math.max(1, Math.ceil(list.length/pageSize));
  if(poemPage >= pages) poemPage = pages-1;
  const page = list.slice(poemPage*pageSize, poemPage*pageSize+pageSize);
  app.innerHTML = `
  <div class="wrap">
    <h1 style="font-size:23px;margin:22px 0 2px">古诗词</h1>
    <p class="sub">${DATA.poems.length} 篇 · 点开看全文</p>
    <input class="search" id="poemSearch" placeholder="搜索篇名、作者或诗句" value="${esc(poemQ)}">
    <div style="margin-top:14px">
    ${page.length?page.map(p=>`
      <div class="item poem" data-act="poemToggle">
        <div class="h">${esc(p[0])}</div>
        <div class="au">${esc(p[1])}</div>
        <div class="b">${esc(p[2].join('\n'))}</div>
      </div>`).join(''):'<div class="empty">没有匹配的诗词</div>'}
    </div>
    ${pages>1?`<div class="pager">
      <button data-act="poemPage" data-p="${poemPage-1}" ${poemPage<=0?'disabled':''}>上一页</button>
      <span>${poemPage+1} / ${pages}</span>
      <button data-act="poemPage" data-p="${poemPage+1}" ${poemPage>=pages-1?'disabled':''}>下一页</button>
    </div>`:''}
  </div>`;
}

/* ---------- 导航与事件 ---------- */
function go(name){ ({
  home:renderHome, facts:()=>{factsPage=0;renderFacts();}, poems:()=>{poemPage=0;renderPoems();},
  wrong:renderWrong
}[name] || renderHome)(); }
function markNav(name){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.nav===name));
}

nav.addEventListener('click', e=>{
  const b = e.target.closest('button[data-nav]');
  if(!b) return;
  const name = b.dataset.nav;
  markNav(name);
  go(name);
});

app.addEventListener('click', e=>{
  const el = e.target.closest('[data-act], .opt');
  if(!el) return;
  if(el.classList.contains('opt')){ answer(+el.dataset.opt); return; }
  const act = el.dataset.act;
  if(act === 'bank'){
    renderBank(el.dataset.b);
  }else if(act === 'start'){
    const b = el.dataset.b, n = +el.dataset.n || bankCount(b);
    const pool = poolOf(b);
    startQuiz(BANKS[b].name, pool, n, el.dataset.wrong === '1');
  }else if(act === 'next'){ nextQ(); }
  else if(act === 'reveal'){
    if(!run.locked){
      const it = currentItem();
      run.wrongThisRound.push({...it, chosen:null});
      paint(null);
    }
  }
  else if(act === 'home'){ markNav('home'); renderHome(); }
  else if(act === 'wrong'){ markNav('wrong'); renderWrong(); }
  else if(act === 'facts'){ markNav('facts'); factsPage = 0; renderFacts(); }
  else if(act === 'poems'){ markNav('poems'); poemPage = 0; renderPoems(); }
  else if(act === 'retryWrong'){
    const items = run.wrongThisRound.map(w=>({id:w.id, bank:w.bank, q:w.q, opts:w.opts, ans:w.ans, e:w.e}));
    run = {title:'错题重练', items, i:0, locked:false, right:0, wrongThisRound:[], t0:Date.now()};
    renderQuiz();
  }
  else if(act === 'startWrongAll'){
    const pool = S.wrong.map(id=>{ const [b,i]=id.split(':'); return itemOf(b,+i); }).filter(Boolean);
    if(!pool.length) return;
    startQuiz('错题重练', pool, pool.length, false);
  }
  else if(act === 'factsFilter'){ factsFilter = el.dataset.f; factsPage = 0; renderFacts(); }
  else if(act === 'factsPage'){ factsPage = +el.dataset.p; renderFacts(); }
  else if(act === 'poemPage'){ poemPage = +el.dataset.p; renderPoems(); }
  else if(act === 'poemToggle'){ el.classList.toggle('open'); }
  else if(act === 'reset'){
    if(confirm('清空本机的答题记录和错题本？')){
      S = {seen:{}, wrong:[], hist:[]};
      try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      save(); renderHome();
    }
  }
  if(el.tagName === 'A') e.preventDefault();
});

/* 搜索输入：重渲染后把焦点与光标还原到搜索框 */
app.addEventListener('input', e=>{
  const isFact = e.target.id === 'factSearch';
  const isPoem = e.target.id === 'poemSearch';
  if(!isFact && !isPoem) return;
  const val = e.target.value;
  if(isFact){ factQ = val; factsPage = 0; renderFacts(); } else { poemQ = val; poemPage = 0; renderPoems(); }
  const el = document.getElementById(isFact ? 'factSearch' : 'poemSearch');
  if(el){ el.focus(); el.setSelectionRange(val.length, val.length); }
});

renderHome();
</script>
