name: verify

# 全仓库质量门禁。改任意一处都该跑一遍 —— 这是"提交前自查"，也是 PR 的拦截线。
#
# 为什么必须有这条流水线：仓库里有几个坑是"本地看不出来、上线才炸"的
#   1. .sh 被写成 CRLF —— bash 读 heredoc 终止行拿到 EOF\r，会吞掉整个文件，
#      所有实训与评分脚本一个都跑不起来；
#   2. manifest 改名后 study.html 的 <script src> 没同步 —— URL 不变，
#      浏览器和 CDN 会一直吐旧缓存；
#   3. study.html 里的 #d= 深链 —— 站内链接检查扫不到片段，只能靠生成器自检兜住；
#   4. 全量重建会丢文档 —— 增量通道 add_study_docs.py 与清单同步由门禁把住。
# 这四类问题都会在 CI 里被直接挡下。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # PyYAML 是 md yaml 检查的依赖（缺了会 SKIP 而不是失败，这里先装上）
      - name: 安装检查依赖
        run: python -m pip install --quiet --upgrade pip markdown pyyaml

      - name: 质量校验（14 项）
        run: python tools/verify_all.py

      - name: 复核（不带代码块实跑，失败时给出第二条线索）
        if: always()
        run: python tools/verify_all.py --fast
