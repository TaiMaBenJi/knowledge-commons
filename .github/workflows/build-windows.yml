name: build-windows
# CloudStudy · Windows 单文件 EXE（内嵌 study.html；zig 交叉编译，ubuntu 运行器）
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: '上传到 Release tag（可留空，如 v3.1）'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 zig 0.13.0
        run: |
          curl -fL --retry 3 -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -C /tmp -xf /tmp/zig.tar.xz
          echo "/tmp/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: 构建便携文件夹包（启动器 + study.html + study-data + learn）
        run: sh clients/windows/build.sh study.html dist/zhishi-gongshe-v3.1-windows-x64.zip

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhishi-gongshe-Windows
          path: dist/*.zip
          compression-level: 0

      - name: 上传到 Release
        if: github.event_name == 'push' || inputs.upload_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.upload_release || github.ref_name }}"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "知识公社 $TAG · 多端统一版" --notes "多端统一发布（Android / iOS / Windows / Web）" || true
          gh release upload "$TAG" dist/*.zip --clobber -R "$GITHUB_REPOSITORY"
