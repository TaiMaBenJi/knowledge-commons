<div class="wrap" style="padding-top:12px">
  <h2 class="sec" style="margin-top:6px">检索站内内容</h2>
  <div class="card">
    <form class="searchbar" onsubmit="go();return false;">
      <input id="q" placeholder="输入关键词：如 动态规划 / 实践论 / 资料分析 / 数列…" autocomplete="off">
      <button type="submit">检索</button>
    </form>
    <p class="small">检索范围：课程章节 · 毛选篇目 · 诗词 · 站内页面 · 资料室分组 · 资源总库 1168 条。题库检索请见「竞赛」页。</p>
    <div id="out"></div>
  </div>
  <p><a href="index.html">← 返回首页</a> · <a href="archive.html">总目</a></p>
</div>
<script src="searchidx.js"></script>
<script>
var idx = window.SEARCH_IDX || [];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function go(){
  var q = document.getElementById('q').value.trim();
  var out = document.getElementById('out');
  if(!q){ out.innerHTML=''; return; }
  var hits = idx.filter(function(it){ return (it.t+' '+(it.k||'')).indexOf(q) >= 0; }).slice(0,80);
  if(!hits.length){ out.innerHTML = '<p class="small">没有找到「'+esc(q)+'」。试试更短的关键词。</p>'; return; }
  var h = '<p class="small">共 '+hits.length+' 条：</p><ul class="list">';
  hits.forEach(function(it){
    h += '<li><span class="t"><a href="'+it.u+'">'+esc(it.t)+'</a></span><span class="n">'+esc(it.g||'')+'</span></li>';
  });
  h += '</ul>';
  out.innerHTML = h;
}
(function(){ var m = location.search.match(/[?&]q=([^&]*)/); if(m){ document.getElementById('q').value = decodeURIComponent(m[1]); go(); } })();
</script>
</body>
