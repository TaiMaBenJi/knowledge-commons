<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图文阅览 · 知识公社</title>
<style>
:root{--blue:#1f4e8c;--red:#c02c38;--ink:#222;--gray:#666;--line:#d8dfe9;--bg:#f5f6f8;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
/* 顶栏 */
.topbar{background:linear-gradient(135deg,#8e1c26 0%,#a92e35 45%,#8e1c26 100%);color:#fff}
.topbar-in{max-width:1200px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.emblem{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.site-name{font-size:20px;font-weight:700;letter-spacing:1px}
.site-sub{font-size:12px;opacity:.85;margin-top:2px}
.btn{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:4px;padding:7px 14px;font-size:14px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.15)}
.spacer{flex:1}
/* 主体 */
.wrap{max-width:1200px;margin:18px auto;padding:0 14px;display:flex;gap:18px;align-items:flex-start}
.doc{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-top:3px solid var(--red);padding:30px 38px 60px}
h1.doc-title{font-size:24px;color:var(--blue);border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:22px;line-height:1.4}
.meta{font-size:13px;color:#999;margin:-14px 0 24px}
/* 目录 */
.toc{width:250px;flex:none;background:#fff;border:1px solid var(--line);padding:16px;position:sticky;top:12px;max-height:calc(100vh - 40px);overflow:auto;display:none}
.toc h3{font-size:15px;color:var(--blue);border-left:4px solid var(--red);padding-left:9px;margin-bottom:10px}
.toc a{display:block;font-size:13px;color:#455066;text-decoration:none;padding:5px 4px 5px 0;line-height:1.5;border-bottom:1px dashed #eceff4}
.toc a:hover{color:var(--red)}
.toc .lv2{padding-left:14px}
@media(min-width:1000px){.toc{display:block}}
@media(max-width:720px){.doc{padding:20px 16px 40px}}
/* Markdown 正文排版 */
.md{line-height:1.85;font-size:16px;word-break:break-word}
.md h1{font-size:22px;color:var(--blue);margin:30px 0 14px;border-left:5px solid var(--red);padding-left:12px;line-height:1.4}
.md h2{font-size:19px;color:var(--blue);margin:26px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.md h3{font-size:17px;color:#333;margin:22px 0 10px;padding-left:9px;border-left:3px solid #b9c6dc}
.md h4{font-size:16px;margin:18px 0 8px}
.md p{margin:10px 0}
.md a{color:#1554ad;text-decoration:none}
.md a:hover{text-decoration:underline}
.md ul,.md ol{margin:10px 0 10px 26px}
.md li{margin:4px 0}
.md blockquote{border-left:4px solid #c9d4e6;background:#f6f8fb;color:#4a5568;padding:10px 16px;margin:12px 0;border-radius:0 4px 4px 0}
.md code{background:#eef1f6;color:#c7353f;padding:2px 6px;border-radius:3px;font-family:Menlo,Consolas,monospace;font-size:.9em}
.md pre{background:#22272e;color:#dbe2ea;padding:16px 18px;border-radius:6px;overflow:auto;margin:14px 0;line-height:1.6;font-size:13.5px}
.md pre code{background:none;color:inherit;padding:0;font-size:inherit}
.md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px;display:block;overflow-x:auto}
.md th{background:#eef3fa;color:var(--blue);font-weight:600}
.md th,.md td{border:1px solid #c9d4e6;padding:8px 10px;text-align:left;line-height:1.6}
.md tr:nth-child(even) td{background:#fafbfd}
.md hr{border:none;border-top:1px dashed var(--line);margin:24px 0}
.md img{max-width:100%;border:1px solid var(--line);border-radius:4px;margin:8px 0}
.md video{width:100%;max-width:760px;border-radius:6px;background:#000;margin:10px 0}
.md .task{border:1px solid #e3d3b3;background:#fdf9ef;padding:12px 16px;border-radius:6px;margin:12px 0}
.err{padding:60px 20px;text-align:center;color:#999}
.loading{padding:60px;text-align:center;color:#888}
.check{color:#1a7f37;font-weight:600}
.cross{color:var(--red);font-weight:600}
@media print{.topbar,.toc{display:none}.doc{border:none}}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="emblem">云</div>
  <div><div class="site-name">知识公社 · 图文阅览</div><div class="site-sub">竞赛真题 · 课程 · 红色经典 · 世界技能大赛 · 全技能库</div></div>
  <div class="spacer"></div>
  <button class="btn" onclick="location.href='index.html'">返回门户</button>
  <button class="btn" onclick="fontAdj(1)">A+</button>
  <button class="btn" onclick="fontAdj(-1)">A-</button>
</div></div>

<div class="wrap">
  <div class="doc" id="doc"><div class="loading">正在加载…</div></div>
  <div class="toc" id="toc"><h3>本篇目录</h3><div id="toc-list"></div></div>
</div>

<script>
var BASE=17;
function fontAdj(d){BASE=Math.min(24,Math.max(13,BASE+d));var m=document.querySelector('.md');if(m)m.style.fontSize=BASE+'px';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function joinPath(base,rel){
  if(/^(https?:|data:|#|mailto:)/.test(rel))return rel;
  var stack=base?base.split('/'):[];var parts=rel.split('/');
  for(var i=0;i<parts.length;i++){var p=parts[i];
    if(p==='.'||p==='')continue;
    else if(p==='..')stack.pop();
    else stack.push(p);}
  return stack.join('/');
}
/* 极简 Markdown 渲染器：标题/列表/表格/代码/引用/图像/视频/行内 */
function renderMD(src,dir){
  var lines=src.split(/\r?\n/),out=[],i=0,inCode=false,codeBuf='',listStack=[];
  function closeLists(){while(listStack.length){out.push('</'+listStack.pop()+'>');}}
  function inline(s){
    s=esc(s);
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,function(a,t,h){
      var u=joinPath(dir,h);return '<img src="'+u+'" alt="'+t+'" loading="lazy">';});
    s=s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,function(a,t,h){
      if(/\.md($|#)/.test(h))return '<a href="viewer.html?doc='+encodeURIComponent(joinPath(dir,h))+'">'+t+'</a>';
      var u=joinPath(dir,h);return '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>';});
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
    s=s.replace(/（截图|TODO）/g,'$1');
    return s;
  }
  while(i<lines.length){
    var L=lines[i];
    if(/^```/.test(L)){
      if(!inCode){inCode=true;codeBuf=[];closeLists();}
      else{inCode=false;out.push('<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>');}
      i++;continue;}
    if(inCode){codeBuf.push(L);i++;continue;}
    var hm=L.match(/^(#{1,6})\s+(.*)$/);
    if(hm){closeLists();var lv=hm[1].length;out.push('<h'+lv+'>'+inline(hm[2])+'</h'+lv+'>');i++;continue;}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(L)){closeLists();out.push('<hr>');i++;continue;}
    if(/^\s*>/.test(L)){
      closeLists();var q=[];
      while(i<lines.length&&/^\s*>/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++;}
      out.push('<blockquote>'+q.map(inline).join('<br>')+'</blockquote>');continue;}
    if(/^\s*\|/.test(L)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|?\s*$/.test(lines[i+1])){
      closeLists();
      var rows=[];
      while(i<lines.length&&/^\s*\|/.test(lines[i])){
        if(!/^\s*\|[\s:|-]+\|?\s*$/.test(lines[i])){
          var cells=lines[i].trim().replace(/^\||\|$/g,'').split('|');
          rows.push(cells.map(function(c){return c.trim();}));}
        i++;}
      var t='<table><thead><tr>'+rows[0].map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>';
      for(var r=1;r<rows.length;r++)t+='<tr>'+rows[r].map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>';
      out.push(t+'</tbody></table>');continue;}
    var ul=L.match(/^(\s*)[-*+]\s+(.*)$/);
    var ol=L.match(/^(\s*)\d+[.、)]\s+(.*)$/);
    var cb=L.match(/^(\s*)\[([ xX])\]\s*(.*)$/);
    if(cb){out.push('<p>'+(cb[2].toLowerCase()==='x'?'<span class="check">✔</span>':'<span class="cross">✘</span>')+' '+inline(cb[3])+'</p>');i++;continue;}
    if(ul||ol){
      var tag=ul?'ul':'ol',ind=(ul||ol)[1].length;
      while(listStack.length&&listStack.length>Math.floor(ind/2)+1)out.push('</'+listStack.pop()+'>');
      if(listStack[listStack.length-1]!==tag){closeLists();out.push('<'+tag+'>');listStack.push(tag);}
      out.push('<li>'+inline((ul||ol)[2])+'</li>');i++;continue;}
    if(/^\s*<video[^>]*>/.test(L)||/^\s*<img[^>]*>/.test(L)){
      closeLists();
      var raw=L.trim();
      raw=raw.replace(/src="([^"]+)"/g,function(a,h){
        if(/^(videos\/|https?:|data:)/.test(h))return 'src="'+h+'"';
        return 'src="'+joinPath(dir,h)+'"';
      });
      out.push(raw);i++;continue;}
    if(/^\s*$/.test(L)){closeLists();i++;continue;}
    closeLists();
    var para=[L];i++;
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,6}\s|```|\s*>|\s*[-*+]\s|\s*\d+[.、)]\s|\s*\||\s*---)/.test(lines[i])){para.push(lines[i]);i++;}
    out.push('<p>'+inline(para.join(' '))+'</p>');
  }
  closeLists();if(inCode)out.push('<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>');
  return out.join('\n');
}
function buildTOC(){
  var hs=document.querySelectorAll('.md h1,.md h2'),list=document.getElementById('toc-list'),html='';
  hs.forEach(function(h,idx){
    h.id='sec-'+idx;
    html+='<a class="'+(h.tagName==='H2'?'lv2':'')+'" href="#sec-'+idx+'">'+h.textContent+'</a>';
  });
  list.innerHTML=html||'<a>暂无目录</a>';
}
function load(){
  var q=new URLSearchParams(location.search);
  var doc=q.get('doc')||'docs/README-总导航.md';
  var el=document.getElementById('doc');
  el.innerHTML='<div class="loading">正在加载…</div>';
  fetch(doc).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(txt){
    document.title=doc.split('/').pop()+' · 知识公社';
    var dir=doc.indexOf('/')>=0?doc.slice(0,doc.lastIndexOf('/')):'';
    if(/\.txt$/i.test(doc)){
      el.innerHTML='<h1 class="doc-title">'+doc.split('/').pop()+'</h1><div class="md"><pre style="white-space:pre-wrap">'+esc(txt)+'</pre></div>';
    }else{
      var t1=txt.match(/^#\s+(.+)$/m);
      if(/^#\s/.test(txt)){var nl=txt.indexOf('\n');txt=nl>=0?txt.slice(nl+1):'';}
      var body=renderMD(txt,dir);
      var extra='';
      if(/multiskill\/[^/]+\/[^/]+\/项目总纲\.md$/.test(doc)){
        extra='<hr><h2>赛项图解 · 总纲课 · 实战训练</h2>'
          +'<p><img src="'+joinPath(dir,'图-核心能力域.svg')+'" alt="核心能力域图解" style="width:100%"></p>'
          +'<p><img src="'+joinPath(dir,'图-精通路线图.svg')+'" alt="精通路线图" style="width:100%"></p>'
          +'<p>🎬 <strong>中文解说总纲课</strong>：<video controls preload="metadata" src="'+joinPath(dir,'总纲课.mp4')+'"></video></p>'
          +'<p>🎯 <strong>交互模拟训练（十题自动评分）</strong>：<a href="'+joinPath(dir,'模拟训练.html')+'">进入模拟训练 ›</a></p>';
      }
      el.innerHTML='<h1 class="doc-title">'+esc(t1?t1[1]:doc)+'</h1><div class="meta">来源：'+esc(doc)+'</div><div class="md" style="font-size:'+BASE+'px">'+body+extra+'</div>';
      buildTOC();
    }
  }).catch(function(){
    el.innerHTML='<div class="err"><h2>暂时打不开这一篇</h2><p style="margin-top:10px">'+esc(doc)+'<br>如果你是本地直接双击打开的，请用本地服务器（如 <code>python3 -m http.server</code>）访问，或在 GitHub 仓库中浏览。</p><p style="margin-top:14px"><a href="index.html">← 返回门户首页</a></p></div>';
  });
}
load();
</script>
</body>
</html>
