<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面已迁移 · 知识公社</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="learn/style.css" id="basecss">
<link rel="icon" type="image/png" href="icons/icon-192.png" id="baseicon">
<script>
/* GitHub Pages 项目站点部署在 /knowledge-commons/ 子路径下，404 页会以任意深层路径呈现，
   根绝对路径与朴素相对路径都会失效——按已知分区目录名推断站点前缀，回写样式与导航链接 */
(function () {
  var p = location.pathname;
  var SECTS = ['learn', 'docs', 'app', 'assets', 'icons', 'videos', 'tools',
               'clients', 'lab', 'multiskill', 'study-data', 'aws-educate'];
  var b = -1;
  for (var i = 0; i < SECTS.length; i++) {
    var k = p.indexOf('/' + SECTS[i] + '/');
    if (k >= 0 && (b < 0 || k < b)) b = k;
  }
  var BASE = b < 0 ? p.slice(0, p.lastIndexOf('/') + 1) : p.slice(0, b + 1);
  var css = document.getElementById('basecss');
  if (css) css.href = BASE + 'learn/style.css';
  var ico = document.getElementById('baseicon');
  if (ico) ico.href = BASE + 'icons/icon-192.png';
  document.addEventListener('DOMContentLoaded', function () {
    var as = document.querySelectorAll('a[data-nav]');
    for (var j = 0; j < as.length; j++) as[j].href = BASE + as[j].getAttribute('href');
  });
})();
</script>
<style>body{font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;padding:2rem;line-height:1.9;max-width:44rem;margin:0 auto}
h1{font-size:1.4rem}.mono{font-family:ui-monospace,monospace;font-size:.85rem;color:#666}
ul{padding-left:1.2rem}</style>
</head>
<body>
<h1>这一页搬家了</h1>
<p>本站 2026-10-16 做过一次目录整理，旧链接会自动跳转到新位置；若没有跳转，请从下面的入口继续：</p>
<ul>
  <li><a href="index.html" data-nav>知识公社首页</a></li>
  <li><a href="learn/" data-nav>学习门户</a></li>
  <li><a href="learn/archive.html" data-nav>总目 · 全站一页直达</a></li>
  <li><a href="learn/search.html" data-nav>全站检索</a></li>
  <li><a href="library.html" data-nav>资源总库</a></li>
</ul>
<p class="mono" id="from"></p>
<script>
var MAP = {
    "resources.html": "learn/media/bilibili.html",
    "guofang.html": "learn/exam/guofang.html",
    "learn/aws-educate-catalog.html": "learn/courses/aws-educate-catalog.html",
    "learn/aws-educate.html": "learn/courses/aws-educate.html",
    "learn/calendar.html": "learn/exam/calendar.html",
    "learn/cloud-4weeks.html": "learn/cloud/4weeks.html",
    "learn/cloud-net.html": "learn/cloud/net.html",
    "learn/cloud-sprint.html": "learn/cloud/sprint.html",
    "learn/cloud-week1.html": "learn/cloud/week1.html",
    "learn/cloud.html": "learn/cloud",
    "learn/cloudlab.html": "learn/cloud/lab.html",
    "learn/course-algo.html": "learn/courses/algo.html",
    "learn/course-algo2.html": "learn/courses/algo2.html",
    "learn/course-gongkao.html": "learn/courses/gongkao.html",
    "learn/course-python.html": "learn/courses/python.html",
    "learn/exams.html": "learn/exam",
    "learn/gongkao.html": "learn/exam/gongkao.html",
    "learn/pdfview.html": "learn/media/pdfview.html",
    "learn/quiz.html": "learn/exam/quiz.html",
    "learn/red.html": "learn/red",
    "learn/socialism.html": "learn/red/socialism.html",
    "learn/wsvideos.html": "learn/media/wsvideos.html",
};
var path = location.pathname.replace(/\/+$/, "/");
var hit = null, bestLen = -1;
for (var k in MAP) {
  var tail = "/" + k.replace(/\/$/, "");
  var i = path.lastIndexOf(tail);
  if (i >= 0 && i + tail.length >= path.replace(/\/$/, "").length && k.length > bestLen) {
    hit = path.slice(0, i + 1) + MAP[k].replace(/^\//, "");
    bestLen = k.length;
  }
}
if (hit) { location.replace(hit + location.search + location.hash); }
document.getElementById("from").textContent = "访问路径：" + location.pathname;
</script>
</body>
</html>
