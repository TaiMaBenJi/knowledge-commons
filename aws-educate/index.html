<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b1f2a;--dim:#6b7280;--line:#e5e8ef;--acc:#2563eb;--acc2:#7c3aed;--ok:#0f9d58;--warn:#b45309;--bad:#c2410c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:24px;margin:0 0 6px}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.banner{background:#fff;border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:13.5px;color:#3f4657}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.stat b{display:block;font-size:20px;line-height:1.3}
.stat span{font-size:11.5px;color:var(--dim)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 12px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;color:var(--dim)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input[type=search],select{border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:14px;background:#fff;font-family:inherit;color:inherit}
input[type=search]{flex:1;min-width:190px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--dim);user-select:none}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:16px}
.card h4{margin:0 0 4px;font-size:14px}
.meta{color:var(--dim);font-size:12.5px}
.desc{color:#4b5563;font-size:13.5px;margin:8px 0}
.advice{background:#f8fafc;border:1px dashed var(--line);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:9px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;cursor:pointer}
.row .ttl{font-weight:600;font-size:14.5px}
.zh{font-weight:600}
.en{color:var(--dim);font-size:12.5px;font-weight:400;margin-top:2px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11.5px;color:var(--dim);background:#fafbfd}
.tag.lv1{border-color:#bfdbfe;color:#1d4ed8;background:#eff6ff}
.tag.lv2{border-color:#fde68a;color:#b45309;background:#fffbeb}
.tag.lv3{border-color:#fbcfe8;color:#be185d;background:#fdf2f8}
.tag.ok{border-color:#bbf7d0;color:var(--ok);background:#f0fdf4}
.tag.gd{border-color:#ddd6fe;color:var(--acc2);background:#f5f3ff}
.det{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:13px}
.det .grp{margin:9px 0 5px;font-weight:600;color:var(--dim);font-size:12.5px}
.lnk{display:inline-block;color:var(--acc);text-decoration:none;border-bottom:1px solid #bfdbfe;margin:0 8px 4px 0;font-size:12.5px;word-break:break-all}
.lnk:hover{border-color:var(--acc)}
code{background:#f1f5f9;border-radius:4px;padding:1px 5px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{background:#f8fafc;font-weight:600;font-size:12.5px;color:var(--dim)}
.tbl td.num{text-align:right;white-space:nowrap}
.hint{color:var(--dim);font-size:12.5px;margin:10px 0}
.hide{display:none}
.foot{color:var(--dim);font-size:12px;margin-top:28px;text-align:center;line-height:1.9}
ul{padding-left:20px;margin:8px 0}
li{margin:4px 0}
b.hl{background:#fef08a;border-radius:3px;padding:0 2px}
</style>
</head>

    h += '<div class="card"><b>你的课程进度</b><ul>';
    D.progress.forEach(function(p){
      h += "<li>"+esc(p.en)+" — <b>"+p.progress+"%</b></li>";
    });
    h += "</ul></div>";
  }
  return h;
}

/* ---------- 视图 2：71 门课 ---------- */
var q = "", fLevel = "", fCat = "", openSet = {};
function viewCourses(){
  var lvls = [], cats = [];
  D.catalog.forEach(function(c){ if(c.level && lvls.indexOf(c.level)<0) lvls.push(c.level); if(c.cat && cats.indexOf(c.cat)<0) cats.push(c.cat); });
  var toolsHtml = '<div class="bar"><input type="search" id="q" placeholder="搜课程名（中/英）或 AWS 服务" value="' + esc(q) + '"></div>';
  toolsHtml += '<div class="bar"><span class="meta" style="align-self:center;min-width:38px">难度</span>';
  toolsHtml += '<span class="chip' + (fLevel?"":" on") + '" data-f="level">全部</span>';
  lvls.sort().forEach(function(x){ toolsHtml += '<span class="chip' + (fLevel===x?" on":"") + '" data-f="level" data-v="' + esc(x) + '">' + esc(x) + '</span>'; });
  toolsHtml += '</div>';
  toolsHtml += '<div class="bar"><span class="meta" style="align-self:center;min-width:38px">类别</span>';
  toolsHtml += '<span class="chip' + (fCat?"":" on") + '" data-f="cat">全部</span>';
  cats.sort().forEach(function(x){ toolsHtml += '<span class="chip' + (fCat===x?" on":"") + '" data-f="cat" data-v="' + esc(x) + '">' + esc(x) + '</span>'; });
  toolsHtml += '</div>';
  document.getElementById("tools").innerHTML = toolsHtml;
  renderCourseList();
}

function renderCourseList(){
  var list = D.catalog.filter(function(c){
    if(fLevel && c.level!==fLevel) return false;
    if(fCat && c.cat!==fCat) return false;
    if(!q) return true;
    var hay = (c.zh+" "+c.en+" "+c.cat+" "+(c.svcs||[]).join(" ")).toLowerCase();
    return hay.indexOf(q.toLowerCase())>=0;
  });
  var h = '<div class="hint">共 <b>'+D.catalog.length+'</b> 门，当前显示 <b>'+list.length+'</b> 门。点任意一行展开。</div>';
  if(!list.length) h += '<div class="card">没有匹配的课程，试试清空搜索词。</div>';
  list.forEach(function(c){
    var open = !!openSet[c.en];
    var rowHtml = '<div class="card"><div class="row" data-course="' + esc(c.en) + '">';
    rowHtml += '<div style="min-width:0"><div class="ttl">' + hl(c.zh, q) + '</div>';
    rowHtml += '<div class="en">' + hl(c.en, q) + '</div></div>';
    rowHtml += '<div style="text-align:right;white-space:nowrap">' + lvTag(c.level);
    rowHtml += '<div class="meta" style="margin-top:4px">' + esc(c.hours) + ' 小时</div></div></div>';
    rowHtml += '<div class="meta" style="margin-top:7px">' + esc(c.cat) + '</div>';
    if(open) rowHtml += '<div class="det" style="display:block"><div class="grp">AWS Educate 官方课，需登录平台学习。AWS 服务：' + ((c.svcs && c.svcs.length) ? c.svcs.join(", ") : "无") + '</div></div>';
    rowHtml += "</div>";
    h += rowHtml;
  });
  document.getElementById("list").innerHTML = h;
}

/* ---------- 视图 3：说明 ---------- */
function viewAbout(){
  var h = '<div class="card"><b>抓取边界（说明白，别误会）</b>'+
    '<table class="tbl" style="margin-top:9px"><thead><tr><th>拿到了</th><th>没拿到</th></tr></thead><tbody><tr>'+
    "<td>7 条学习路径 + 描述 + 课数<br>16 次课程提及的级别/时长/分类<br>5 个筛选维度名<br>课程进度、公告</td>"+
    "<td>完整 71 门的门户内清单（在 Aura 后台，DOM 抓不到）<br>课程正文（版权属 Amazon，且托管在 Canvas 后）<br>各筛选维度的完整可选项</td>"+
    "</tr></tbody></table></div>";
  h += '<div class="card"><b>怎么用（零基础）</b><ol>'+
    "<li>先读 <a class=\"lnk\" href=\"README.md\">README.md</a> 的 §4，三套刷课路线按你现在的阶段选一条。</li>"+
    "<li>本页面「学习路径」标签下，从 <b>Getting Started</b> 开始 —— 官方推荐的第一站就是它。</li>"+
    "<li>每门课展开后的「站内离线教材」就是你的替代学习材料，点开即读，不联网也行。</li>"+
    "<li>有「可自动评分的验证脚本」的课，学完直接跑一遍脚本验证，别只看不练。</li>"+
    "<li>零基础第一门别碰 AI 路径。Professional skills 整类（8 门）与赛项无关，可以最后再说。</li>"+
    "</ol></div>";
  h += '<div class="card"><b>维护</b><div class="hint" style="margin-bottom:0">'+
    "索引 JSON 由 <code>aws-educate/catalog.json</code> 提供，本页面数据内联。"+
    "深链是否有效由 <code>tools/verify_all.py</code> 的站内链接检查把关。</div></div>";
  return h;
}

/* ---------- 路由 ---------- */
var TABS = [
  {k:"paths",  t:"学习路径", f:viewPaths},
  {k:"courses",t:"课程 "+D.catalog.length+" 门", f:viewCourses, split:true},
  {k:"about", t:"说明与边界", f:viewAbout}
];
var cur = "paths";
function drawTabs(){ document.getElementById("tabs").innerHTML = TABS.map(function(x){ return '<button class="tab'+(cur===x.k?" on":"")+'" data-tab="'+x.k+'">'+esc(x.t)+"</button>"; }).join(""); }
function draw(){
  var t = TABS.filter(function(x){ return x.k===cur; })[0] || TABS[0];
  if(t.split){
    document.getElementById("view").innerHTML = '<div id="tools"></div><div id="list"></div>';
    t.f();
  } else {
    document.getElementById("view").innerHTML = t.f();
  }
  drawTabs();
}
document.addEventListener("click", function(e){
  var tab = e.target.closest("[data-tab]"); if(tab){ cur=tab.dataset.tab; draw(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  var chip = e.target.closest(".chip"); if(chip){ var f=chip.dataset.f, v=chip.dataset.v||""; if(f==="level") fLevel=(fLevel===v?"":v); if(f==="cat") fCat=(fCat===v?"":v); viewCourses(); return; }
  var row = e.target.closest("[data-course]"); if(row){ var k=row.dataset.course; openSet[k]=!openSet[k]; renderCourseList(); return; }
});
document.addEventListener("input", function(e){ if(e.target.id!=="q") return; q=e.target.value; renderCourseList(); });
renderHead();
draw();
</script>
</body>
